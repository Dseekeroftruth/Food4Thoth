    <script>
			
			
        const NOAA_API_BASE = "https://api.tidesandcurrents.noaa.gov/api/prod/datagetter";
  const NOAA_API_PARAMS = {
    product: "predictions",
    datum: "MLLW",
    time_zone: "lst_ldt",
    units: "metric",
    interval: 6,  // or 30, or 60 (minutes)
    format: "json"
  };

  const OPEN_METEO_API_BASE = "https://api.open-meteo.com/v1/forecast";
  let chartInstance;

  // --------------------
  // 1) Fetch NOAA tide data
  // --------------------
  async function fetchTideData(station, beginDate, endDate) {
    const params = new URLSearchParams({
      ...NOAA_API_PARAMS,
      station,
      begin_date: beginDate,
      end_date: endDate,
    });
    const response = await fetch(`${NOAA_API_BASE}?${params}`);
    const data = await response.json();
    // Map NOAA predictions
    return data.predictions.map(prediction => ({
      time: prediction.t,
      height: parseFloat(prediction.v),
      type: prediction.type === "H" ? "high" : "low",
    }));
  }

  // --------------------
  // 2) Fetch weather + sunrise/sunset
  // --------------------
  async function fetchWeatherData(lat, lon, startDate, endDate) {
    const response = await fetch(`${OPEN_METEO_API_BASE}?latitude=${lat}&longitude=${lon}
&hourly=temperature_2m,weathercode,windspeed_10m,winddirection_10m,precipitation_probability
&daily=sunrise,sunset
&timezone=auto
&start_date=${startDate}
&end_date=${endDate}`);
    const data = await response.json();

    const hourlyData = data.hourly.time.map((time, index) => ({
      time: time,
      tempC: data.hourly.temperature_2m[index],
      tempF: (data.hourly.temperature_2m[index] * 9) / 5 + 32, // Convert to Fahrenheit
      windSpeed: data.hourly.windspeed_10m[index],             // mph
      windDir: data.hourly.winddirection_10m[index],           // degrees
      precipProb: data.hourly.precipitation_probability[index] // %
    }));

    const dailyData = {
      sunrise: data.daily.sunrise[0],
      sunset: data.daily.sunset[0]
    };

    return { hourlyData, dailyData };
  }
	
	function updateSummaryContainer(hourlyData, dailyData) {
    // Group hourly data by day
    const dailyGroups = hourlyData.reduce((acc, hour) => {
        const day = new Date(hour.time).toISOString().split("T")[0]; // Extract YYYY-MM-DD
        if (!acc[day]) acc[day] = [];
        acc[day].push(hour);
        return acc;
    }, {});

    // Prepare HTML for daily averages
    const averagesContainer = document.getElementById("averages");
    averagesContainer.innerHTML = ""; // Clear previous content

    Object.keys(dailyGroups).forEach((day, index) => {
        const dayData = dailyGroups[day];
        const totalHours = dayData.length;
        const avgWind = dayData.reduce((sum, hour) => sum + (hour.windSpeed || 0), 0) / totalHours;
        const avgPrecip = dayData.reduce((sum, hour) => sum + (hour.precipProb || 0), 0) / totalHours;
        const avgTempF = dayData.reduce((sum, hour) => sum + (hour.tempF || 0), 0) / totalHours;

        // Add each day's averages to the container
        const dayHTML = `
            <div>
                <h4>Day ${index + 1} (${day})</h4>
                <p><strong>Average Wind Speed:</strong> ${avgWind.toFixed(1)} mph</p>
                <p><strong>Average Precipitation Probability:</strong> ${avgPrecip.toFixed(1)}%</p>
                <p><strong>Average Temperature:</strong> ${avgTempF.toFixed(1)} °F</p>
            </div>
        `;
        averagesContainer.innerHTML += dayHTML;
    });

    // Update sunrise and sunset times (first day's data as an example)
    const sunriseTime = new Date(dailyData.sunrise).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: true });
    const sunsetTime = new Date(dailyData.sunset).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: true });

    document.getElementById("sunrise-time").textContent = sunriseTime;
    document.getElementById("sunset-time").textContent = sunsetTime;
}

      

  // --------------------
  // 3) Best time to walk (low tide + temperature scoring)
  // --------------------
  function getBestLowTideTime(tideData, weatherData) {
    let bestTime = null;
    let bestScore = Number.POSITIVE_INFINITY;
    const idealTemp = 67.5;

    tideData.forEach((tide) => {
      if (tide.type !== "low") return;
      const tideTime = new Date(tide.time).getTime();

      // Find closest weather hour
      let closestWeather = null;
      let closestDiff = Number.POSITIVE_INFINITY;
      weatherData.forEach((w) => {
        const weatherTime = new Date(w.time).getTime();
        const diff = Math.abs(weatherTime - tideTime);
        if (diff < closestDiff) {
          closestDiff = diff;
          closestWeather = w;
        }
      });

      if (!closestWeather) return;

      // Incorporate temperature difference, wind speed, precipitation
      const tempF = closestWeather.tempF;
      const wind = closestWeather.windSpeed || 0;  
      const precipProb = closestWeather.precipProb || 0; 
      
      const tempScore = Math.abs(tempF - idealTemp);
      const windScore = wind / 5;         
      const precipScore = precipProb / 10;
      const tideScore = tide.height; // smaller is better
      const score = tempScore + windScore + precipScore + tideScore;

      if (score < bestScore) {
        bestScore = score;
        bestTime = {
          time: tide.time,
          tideHeight: tide.height.toFixed(2),
          tempF: tempF.toFixed(1),
          wind: wind.toFixed(1),
          precipProb: precipProb.toFixed(1),
          score: score.toFixed(2),
        };
      }
    });

    if (bestTime) {
      bestTime.formattedTime = new Date(bestTime.time).toLocaleString([], {
        month: '2-digit',
        day: '2-digit',
        year: 'numeric',
        hour: '2-digit',
        minute: '2-digit',
        hour12: true
      });
    }
    return bestTime;
  }

  // --------------------
  // 4) Best sunset low tide
  // --------------------
  function getBestSunsetLowTideTime(tideData, sunsetTime) {
    const sunset = new Date(sunsetTime).getTime();
    let bestEvent = null;
    let bestDiff = Number.POSITIVE_INFINITY;

    tideData.forEach((tide) => {
      if (tide.type !== "low") return;
      const tideTime = new Date(tide.time).getTime();
      const diff = Math.abs(tideTime - sunset);
      if (diff < bestDiff) {
        bestDiff = diff;
        bestEvent = tide;
      }
    });

    if (bestEvent) {
      return {
        time: bestEvent.time,
        tideHeight: bestEvent.height.toFixed(2),
        formattedTime: new Date(bestEvent.time).toLocaleString([], {
          month: '2-digit',
          day: '2-digit',
          year: 'numeric',
          hour: '2-digit',
          minute: '2-digit',
          hour12: true
        })
      };
    }
    return null;
  }

  // --------------------
  // 5) Main chart update
  // --------------------
  async function updateChart(location) {
    const [station, lat, lon] = location.split("|");
    const now = new Date();
    const todayStr = now.toISOString().split("T")[0]; // YYYY-MM-DD

    // For 3 days, add 2 more days beyond 'today'
    const threeDaysLater = new Date(now.getTime() + 2 * 24 * 60 * 60 * 1000);
    const threeDaysLaterStr = threeDaysLater.toISOString().split("T")[0];

    // NOAA requires YYYYMMDD
    const beginDate = todayStr.replace(/-/g, "");
    const endDate = threeDaysLaterStr.replace(/-/g, "");

    // 1) Fetch tide + weather in parallel
    const [tideData, { hourlyData, dailyData }] = await Promise.all([
      fetchTideData(station, beginDate, endDate),
      fetchWeatherData(lat, lon, todayStr, threeDaysLaterStr)
    ]);
		
		updateSummaryContainer(hourlyData, dailyData);
		
		
		
		// Ensure the video is only played inline without full-screen
    const videoElement = document.getElementById("animation-video");
    if (videoElement.paused) {
        try {
            videoElement.play();
        } catch (error) {
            console.warn("Video play issue:", error);
        }
    }

    // Prevent accidental focus on the video element
    videoElement.blur();

 

// Ensure no full-screen behavior is triggered
videoElement.addEventListener('fullscreenchange', (event) => {
    if (document.fullscreenElement) {
        document.exitFullscreen();
    }
});

  

    // 2) Build basic arrays for the chart
    const labelFormatOptions = { 
      month: '2-digit', 
      day: '2-digit', 
      hour: '2-digit', 
      minute: '2-digit', 
      hour12: true 
    };
    const labels = tideData.map(d => new Date(d.time).toLocaleString([], labelFormatOptions));
    const heights = tideData.map(d => d.height);
    const colors = tideData.map(d => d.type === "high" ? "blue" : "grey");

    // 3) For the other weather lines, find the closest weather hour for each tide timestamp
    function findClosestWeather(tideTime) {
      const t = new Date(tideTime).getTime();
      let closest = null, minDiff = Infinity;
      hourlyData.forEach(w => {
        const wTime = new Date(w.time).getTime();
        const diff = Math.abs(wTime - t);
        if (diff < minDiff) {
          minDiff = diff;
          closest = w;
        }
      });
      return closest;
    }

    const tempsF = [];
    const windSpeeds = [];
    const precipProbs = [];

    tideData.forEach((tide) => {
      const w = findClosestWeather(tide.time);
      if (w) {
        tempsF.push(w.tempF);
        windSpeeds.push(w.windSpeed);
        precipProbs.push(w.precipProb);
      } else {
        tempsF.push(null);
        windSpeeds.push(null);
        precipProbs.push(null);
      }
    });

    // 4) Best times to walk
    const bestTime = getBestLowTideTime(tideData, hourlyData);
    const bestSunsetTime = getBestSunsetLowTideTime(tideData, dailyData.sunset);

    // 5) Update textual recommendations
    const lowTideRecommendationElement = document.getElementById("low-tide-recommendation");
    if (bestTime) {
      lowTideRecommendationElement.textContent = `Best time to walk: ${bestTime.formattedTime} 
      (Tide: ${bestTime.tideHeight} m, Temp: ${bestTime.tempF} °F)`;
    } else {
      lowTideRecommendationElement.textContent = "No suitable low tide time found for walking.";
    }

    const sunsetTideRecommendationElement = document.getElementById("sunset-tide-recommendation");
    if (bestSunsetTime) {
      sunsetTideRecommendationElement.textContent = `Best sunset walk time: ${bestSunsetTime.formattedTime} 
      (Low Tide: ${bestSunsetTime.tideHeight} m)`;
    } else {
      sunsetTideRecommendationElement.textContent = "No suitable low tide near sunset found.";
    }

    // 6) Destroy existing chart if exists
    if (chartInstance) chartInstance.destroy();

    // 7) Create new Chart.js instance with multiple datasets
    const ctx = document.getElementById("tideWeatherChart").getContext("2d");
    chartInstance = new Chart(ctx, {
      type: "bar",
      data: {
        labels: labels,
        datasets: [
          // Bar: Tide Height
          {
            type: "bar",
            label: "Tide Height (m)",
            data: heights,
            backgroundColor: colors,
            borderColor: "gray",
            borderWidth: 1,
            yAxisID: "y"  // left axis
          },
          // Line: Temperature
          {
            type: "line",
            label: "Temperature (°F)",
            data: tempsF,
            borderColor: "red",
            backgroundColor: "red",
            borderWidth: 2,
            tension: 0.4,
            yAxisID: "y1" // right axis
          },
          // Line: Wind Speed
          {
            type: "line",
            label: "Wind Speed (mph)",
            data: windSpeeds,
            borderColor: "green",
            backgroundColor: "green",
            borderWidth: 2,
            tension: 0.4,
            yAxisID: "y1"
          },
          // Line: Precip Probability
          {
            type: "line",
            label: "Precip. Prob. (%)",
            data: precipProbs,
            borderColor: "purple",
            backgroundColor: "purple",
            borderWidth: 2,
            tension: 0.4,
            yAxisID: "y1"
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: true,
        plugins: {
          legend: { position: "top" },
          tooltip: {
            mode: 'index',
            intersect: false,
            callbacks: {
              label: function(context) {
                const datasetLabel = context.dataset.label;
                const rawVal = context.raw;
                // Provide custom tooltip for each dataset
                if (datasetLabel === "Tide Height (m)") {
                  return `Tide: ${rawVal.toFixed(2)} m`;
                } else if (datasetLabel === "Temperature (°F)") {
                  return `Temp: ${rawVal != null ? rawVal.toFixed(1) : "N/A"} °F`;
                } else if (datasetLabel === "Wind Speed (mph)") {
                  return `Wind: ${rawVal != null ? rawVal.toFixed(1) : "N/A"} mph`;
                } else if (datasetLabel === "Precip. Prob. (%)") {
                  return `Precip: ${rawVal != null ? rawVal.toFixed(0) : "N/A"}%`;
                }
                return `${datasetLabel}: ${rawVal}`;
              }
            }
          }
        },
        scales: {
          x: {
            title: { display: true, text: "Date/Time" }
          },
          y: {
            title: { display: true, text: "Tide Height (m)" },
            beginAtZero: true
          },
          y1: {
            position: "right",
            title: { display: true, text: "Weather Metrics" },
            grid: { drawOnChartArea: false },
            beginAtZero: true
          }
        }
      }
    });
  }
	

  // --------------------
  // 6) Location change + initialization
  // --------------------
  document.getElementById("location-select").addEventListener("change", (e) => {
    updateChart(e.target.value);
  });

  // Initialize chart with default location
  updateChart("9435380|44.6155|-124.0462"); // South Beach, OR
</script>
