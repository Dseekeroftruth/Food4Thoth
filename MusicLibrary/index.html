  <div class="container" id="media-list">
    <h1>{{ title }}</h1>
    <select v-on:change="filterList">
      <option value="">Filter by album...</option>
      <option v-for="item in uniqueAlbumsList" :key="item">{{ item }}</option>
    </select>
    <ul>
      <li v-for="media in filteredMediaList" 
          :key="media.title"
          :class="{ playing: currentlyPlaying === media, active: currentlyPlaying === media }">
        <h3 @click="toggleDetails(media)">{{ media.title }}</h3>
        <div v-show="media.showDetails">
          <p><strong>Artist:</strong> {{ media.artist }}</p>
          <p><strong>Genre:</strong> {{ media.genre }}</p>
          <p><strong>Released:</strong> {{ media.released }}</p>
          <p><strong>Album:</strong> {{ media.album }}</p>
          <audio :src="media.url" controls @play="playAudio(media, $event)"></audio>
        </div>
      </li>
    </ul>
  </div>
