    <div class="sep"></div>

    <div class="row">
      <label>BPM</label><input id="bpm" type="number" min="30" max="300" value="120" />

        <option value="1">1 beat (¼ note)</option>
        <option value="0.5">½ beat (8th)</option>
        <option value="0.25">¼ beat (16th)</option>

        <input type="checkbox" id="fxOn" checked />

      <label>FB</label><input id="dlFb" type="range" min="0" max="0.95" step="0.01" value="0.45" />

      <label>Depth</label><input id="vbDepth" type="range" min="0" max="0.02" step="0.001" value="0.004" />

      <label>Drive</label><input id="dsDrive" type="range" min="0" max="1.5" step="0.01" value="0.6" />
      <label>Wet</label><input id="dsWet" type="range" min="0" max="1" step="0.01" value="0.2" />
    </div>

    <div class="row">
      <div class="switch"><input type="checkbox" id="bcOn" /><label for="bcOn">Bitcrusher</label></div>
      <label>Bits</label><input id="bcBits" type="range" min="4" max="16" step="1" value="8" />
      <label>Down</label><input id="bcRed" type="range" min="1" max="16" step="1" value="4" />
      <label>Wet</label><input id="bcWet" type="range" min="0" max="1" step="0.01" value="0.25" />

    <div class="sep"></div>
    <h2>Sequencer</h2>

      <label>Steps/Bar</label>

<script>
(() => {
  /* ========== DOM HOOKS (unchanged ids) ========= */
  const videoFile = document.getElementById('videoFile');
  const backFile  = document.getElementById('backFile');
  const playBack  = document.getElementById('playBack');
  const backVol   = document.getElementById('backVol');
  const masterVol = document.getElementById('masterVol');
  const sliceMode = document.getElementById('sliceMode');
  const sliceLen  = document.getElementById('sliceLen');
  const sliceCount= document.getElementById('sliceCount');
  const offsetInp = document.getElementById('offset');
  const makeClips = document.getElementById('makeClips');
  const durInfo   = document.getElementById('durInfo');
  const bpmInp    = document.getElementById('bpm');
  const gridSel   = document.getElementById('grid');
  const toggleQuant = document.getElementById('toggleQuant');
  const visualFollow = document.getElementById('visualFollow');
  const clipVol   = document.getElementById('clipVol');
  const stopAll   = document.getElementById('stopAll');

  const mainVideo = document.getElementById('mainVideo');
  const clipsGrid = document.getElementById('clips');
  const cloneBin  = document.getElementById('cloneBin');

  // mini keyboard
  const miniKeys  = document.getElementById('miniKeys');
  const prevBank  = document.getElementById('prevBank');
  const nextBank  = document.getElementById('nextBank');
  const bankInfo  = document.getElementById('bankInfo');

  // sequencer UI
  const seqStartBtn = document.getElementById('seqStart');
  const seqStopBtn  = document.getElementById('seqStop');
  const seqBarsInp  = document.getElementById('seqBars');
  const seqSPBInp   = document.getElementById('seqSPB');
  const seqSwingInp = document.getElementById('seqSwing');
  const seqTracksInp= document.getElementById('seqTracks');
  const seqRebuild  = document.getElementById('seqRebuild');
  const seqClearBtn = document.getElementById('seqClear');
  const seqFourBtn  = document.getElementById('seqFour');
  const seqRandBtn  = document.getElementById('seqRand');
  const seqEuclidBtn= document.getElementById('seqEuclid');
  const seqExportBtn= document.getElementById('seqExport');
  const seqImportFile = document.getElementById('seqImportFile');
  const seqStepsHead= document.getElementById('seqStepsHead');
  const seqRowsEl   = document.getElementById('seqRows');

  /* ========= GLOBAL STATE ========= */
  let videoURL = null, videoLoaded = false, videoDuration = 0, quantizeOn = false;

  /* ========= AUDIO / FX ========= */
  let audioCtx = null, masterGain = null, backGain = null;
  let clipsPreGain, clipsGate, clipsDryGain, clipsBus, fxSendGain, fxSumGain, fxMasterWet;
  let rvConvolver, rvWet, dlDelay, dlFbGain, dlWet, vbDelay, vbLFO, vbWet, dsShaper, dsWet;
  let bcNode, bcWet, fxInitialized = false, bitcrusherModuleLoaded = false;
  let gateOpened = false;

  /* ========= POLYPHONY / VOICE POOL ========= */
  const MAX_HARD_VOICES = 64;          // absolute ceiling to avoid runaway DOM
  let voices=[], voiceIndex=0;
  let poolTarget = 16;                 // auto-raised to peak pattern need
  const maxOverlapInp = document.getElementById('maxOverlap');
  maxOverlapInp.value = String(Math.max(16, parseInt(maxOverlapInp.value||16,10)));

  /* ========= HELPERS ========= */
  function ensureAudioCtx() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    backGain   = audioCtx.createGain();
    masterGain.gain.value = parseFloat(masterVol.value);
    backGain.gain.value   = parseFloat(backVol.value);
    backGain.connect(masterGain);
    masterGain.connect(audioCtx.destination);

    // keep it alive
    const tryResume = () => { if (audioCtx.state !== 'running') audioCtx.resume().catch(()=>{}); };
    window.addEventListener('pointerdown', tryResume, {passive:true});
    window.addEventListener('keydown', tryResume);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') tryResume(); });
    audioCtx.addEventListener('statechange', tryResume);

    // also prime the main video so autoplay is granted
    mainVideo.muted = true; mainVideo.play().then(()=>mainVideo.pause()).catch(()=>{});
  }
  function openGateOnce(){
    if (!gateOpened && audioCtx && clipsGate){

  }
  function clamp(v,min,max){ return Math.min(max,Math.max(min,v)); }
  function fmt(t){ const m=Math.floor(t/60), s=(t%60).toFixed(2).padStart(5,'0'); return `${m}:${s}`; }

  function buildImpulse(ctx, seconds=2.5) {
    const rate = ctx.sampleRate, len = Math.max(1, Math.floor(seconds*rate));
    const buf = ctx.createBuffer(2, len, rate);
    for (let ch=0; ch<2; ch++){
      const d = buf.getChannelData(ch);
      for (let i=0;i<len;i++){ d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 2.5) * 0.8; }
    }
    return buf;
  }
  function makeCurve(amount=0.6) {
    const k=amount*100+1, n=44100, c=new Float32Array(n);
    for (let i=0;i<n;i++){ const x=(i/n)*2-1; c[i]=Math.tanh(k*x)/Math.tanh(k); }
    return c;
  }

  async function createBitcrusher(ctx){
    if (ctx.audioWorklet && !bitcrusherModuleLoaded){
      const code = `
        class BitCrusher extends AudioWorkletProcessor {
          static get parameterDescriptors(){ return [
            {name:'bits', defaultValue:8, minValue:4, maxValue:16, automationRate:'k-rate'},
            {name:'reduction', defaultValue:4, minValue:1, maxValue:32, automationRate:'k-rate'}
          ];}
          constructor(){ super(); this.phase=0; this.last=0; }
          process(inputs, outputs, params){
            const input=inputs[0], output=outputs[0];
            if (!input || !input[0]) return true;
            const bits=params.bits[0]|0, red=params.reduction[0]|0;
            const step=2/(Math.pow(2,bits)-1);
            for (let ch=0; ch<output.length; ch++){
              const iCh=input[ch]||input[0], oCh=output[ch];
              for (let i=0;i<oCh.length;i++){
                if (++this.phase>=Math.max(1,red)){ this.phase=0; this.last=step*Math.round(iCh[i]/step); }
                oCh[i]=this.last;
              }
            }
            return true;
          }
        }
        registerProcessor('bitcrusher', BitCrusher);
      `;
      const url = URL.createObjectURL(new Blob([code],{type:'application/javascript'}));
      await ctx.audioWorklet.addModule(url); URL.revokeObjectURL(url); bitcrusherModuleLoaded=true;
    }
    if (bitcrusherModuleLoaded){
      return new AudioWorkletNode(ctx,'bitcrusher',{numberOfInputs:1,numberOfOutputs:1,outputChannelCount:[2]});
    }
    return ctx.createScriptProcessor(1024,2,2);
  }

  /* ========= FX INIT ========= */
  async function initFXOnce(){

    // Controls

    const dlOn     = document.getElementById('dlOn');
    const dlTime   = document.getElementById('dlTime');
    const dlFb     = document.getElementById('dlFb');
    const dlWetCtl = document.getElementById('dlWet');

    const vbRate   = document.getElementById('vbRate');
    const vbDepth  = document.getElementById('vbDepth');
    const vbWetCtl = document.getElementById('vbWet');
    const dsOn     = document.getElementById('dsOn');

    const dsWetCtl = document.getElementById('dsWet');
    const bcOn     = document.getElementById('bcOn');

    // Buses
    clipsBus     = audioCtx.createGain();
    clipsPreGain = audioCtx.createGain();
    clipsGate    = audioCtx.createGain();
    clipsDryGain = audioCtx.createGain();

    fxSumGain    = audioCtx.createGain();
    fxMasterWet  = audioCtx.createGain();

    // Init values

    rvWet = audioCtx.createGain();

    // Routing

    fxSendGain.connect(vbDelay);     vbDelay.connect(vbWet).connect(fxSumGain);
    fxSendGain.connect(dsShaper);    dsShaper.connect(dsWet).connect(fxSumGain);

    };
    fxOn.addEventListener('change', updMix);
    fxMixEl.addEventListener('input', updMix);

    rvWet.gain.value = parseFloat(rvWetCtl.value);
    rvOn.addEventListener('change',  ()=> rvWet.gain.value = rvOn.checked ? parseFloat(rvWetCtl.value) : 0);
    rvWetCtl.addEventListener('input',()=> rvWet.gain.value = rvOn.checked ? parseFloat(rvWetCtl.value) : 0);
    rvSizeEl.addEventListener('change',()=> rvConvolver.buffer = buildImpulse(audioCtx, parseFloat(rvSizeEl.value)));

    dlDelay.delayTime.value = parseFloat(dlTime.value);
    dlFbGain.gain.value     = parseFloat(dlFb.value);
    dlWet.gain.value        = dlOn.checked ? parseFloat(dlWetCtl.value) : 0;
    dlOn.addEventListener('change',  ()=> dlWet.gain.value = dlOn.checked ? parseFloat(dlWetCtl.value) : 0);
    dlWetCtl.addEventListener('input',()=> dlWet.gain.value = dlOn.checked ? parseFloat(dlWetCtl.value) : 0);
    dlTime.addEventListener('input', ()=> dlDelay.delayTime.value = parseFloat(dlTime.value));
    dlFb.addEventListener('input',   ()=> dlFbGain.gain.value     = parseFloat(dlFb.value));

    vbLFO.frequency.value   = parseFloat(vbRate.value);
    vbDelay.delayTime.value = parseFloat(vbDepth.value);
    vbWet.gain.value        = vbOn.checked ? parseFloat(vbWetCtl.value) : 0;
    vbOn.addEventListener('change',  ()=> vbWet.gain.value = vbOn.checked ? parseFloat(vbWetCtl.value) : 0);
    vbWetCtl.addEventListener('input',()=> vbWet.gain.value = vbOn.checked ? parseFloat(vbWetCtl.value) : 0);
    vbRate.addEventListener('input', ()=> vbLFO.frequency.value = parseFloat(vbRate.value));
    vbDepth.addEventListener('input',()=> vbDelay.delayTime.value = parseFloat(vbDepth.value));

    dsShaper.curve   = makeCurve(parseFloat(dsDrive.value));
    dsWet.gain.value = dsOn.checked ? parseFloat(dsWetCtl.value) : 0;
    dsOn.addEventListener('change',  ()=> dsWet.gain.value = dsOn.checked ? parseFloat(dsWetCtl.value) : 0);
    dsWetCtl.addEventListener('input',()=> dsWet.gain.value = dsOn.checked ? parseFloat(dsWetCtl.value) : 0);
    dsDrive.addEventListener('input', ()=> dsShaper.curve = makeCurve(parseFloat(dsDrive.value)));

    bcWet.gain.value = bcOn.checked ? parseFloat(bcWetCtl.value) : 0;
    bcOn.addEventListener('change',  ()=> bcWet.gain.value = bcOn.checked ? parseFloat(bcWetCtl.value) : 0);
    bcWetCtl.addEventListener('input',()=> bcWet.gain.value = bcOn.checked ? parseFloat(bcWetCtl.value) : 0);

  /* ========= BACKING ========= */
  let backingMode='none', backBuffer=null, backSource=null, backPlaying=false, backStartTime=0, backOffset=0;
  let backMediaEl=null, backMediaNode=null, backMediaURL=null;

  function clearBacking(){
    stopBacking(true);
    backBuffer=null; backSource=null; backPlaying=false; backOffset=0;
    try { backMediaEl?.pause(); } catch{}
    try { backMediaNode?.disconnect(); } catch{}
    if (backMediaURL) URL.revokeObjectURL(backMediaURL);
    backMediaEl=null; backMediaNode=null; backMediaURL=null; backingMode='none';
  }
  function startBacking(){
    ensureAudioCtx();
    if (backingMode==='buffer'){
      if (backSource){ try{backSource.stop();}catch{} backSource.disconnect(); }
      backSource = audioCtx.createBufferSource();
      backSource.buffer = backBuffer; backSource.loop=true; backSource.connect(backGain);
      backStartTime = audioCtx.currentTime;
      backSource.start(0, backOffset % backBuffer.duration);
      backPlaying=true; playBack.textContent='⏸ Backing';
    } else if (backingMode==='media'){
      if (!backMediaEl) return;
      backMediaEl.loop=true; backMediaEl.muted=true; backMediaEl.volume=1;
      backMediaEl.play().then(()=>{ playBack.textContent='⏸ Backing'; }).catch(()=>{});
      backPlaying=true;
    }
  }
  function stopBacking(force=false){
    if (backingMode==='buffer'){
      if (backSource){
        if (!force){ const t=backingClockSeconds()??0; backOffset = backBuffer ? (t % backBuffer.duration) : 0; }
        try{ backSource.stop(); }catch{} backSource.disconnect(); backSource=null;
      }
      backPlaying=false;
    } else if (backingMode==='media'){
      try{ backMediaEl?.pause(); }catch{} backPlaying=false;
    }
    playBack.textContent='▶ Backing';
  }
  function backingClockSeconds(){
    if (!audioCtx || !backPlaying) return null;
    if (backingMode==='buffer' && backBuffer) return backOffset + (audioCtx.currentTime - backStartTime);
    if (backingMode==='media' && backMediaEl) return backMediaEl.currentTime || 0;
    return null;
  }

  // global media volume routing (elements with role='clip' are muted; audio goes via WebAudio)
  const allMedia = new Set();
  function setMasterVolumeForMedia(v){
    allMedia.forEach(m => { if (m.dataset.role==='clip') m.volume=0; else m.volume=v; });
  }
  masterVol.addEventListener('input', ()=>{
    const v=parseFloat(masterVol.value); setMasterVolumeForMedia(v); if (masterGain) masterGain.gain.value=v;
  });
  backVol.addEventListener('input', ()=> { if (backGain) backGain.gain.value = parseFloat(backVol.value); });

  /* ========= LOAD MAIN VIDEO ========= */
  videoFile.addEventListener('change', ()=>{
    const f = videoFile.files?.[0]; if (!f) return;
    if (videoURL) URL.revokeObjectURL(videoURL);
    videoURL = URL.createObjectURL(f);
    mainVideo.src = videoURL; mainVideo.muted = true; mainVideo.dataset.role='screen';
    allMedia.add(mainVideo);
    mainVideo.onloadedmetadata = () => {
      videoDuration = mainVideo.duration || 0; videoLoaded = true;
      durInfo.textContent = `Video duration: ${videoDuration.toFixed(2)}s`;
      makeClips.disabled = false; mainVideo.currentTime = 0.01;
      initVoicesPool(); // prepare voices
    };
  });

  /* ========= LOAD BACKING ========= */
  backFile.addEventListener('change', async ()=>{
    const f = backFile.files?.[0]; if (!f) return;
    ensureAudioCtx(); clearBacking(); playBack.disabled=true; playBack.textContent='…loading';
    try { const ab=await f.arrayBuffer(); backBuffer=await audioCtx.decodeAudioData(ab);
      backingMode='buffer'; backOffset=0; playBack.disabled=false; playBack.textContent='▶ Backing'; return;
    } catch {}
    try {
      backMediaURL = URL.createObjectURL(f);
      backMediaEl  = f.type.startsWith('video/') ? document.createElement('video') : document.createElement('audio');
      backMediaEl.src = backMediaURL; backMediaEl.preload='auto'; backMediaEl.crossOrigin='anonymous';
      backMediaEl.muted=true; backMediaEl.loop=true; backMediaEl.playsInline=true; backMediaEl.controls=false;
      backMediaEl.disablePictureInPicture = true;
      backMediaEl.disableRemotePlayback = true;
      backMediaEl.setAttribute('controlsList','nodownload noplaybackrate noremoteplayback');
      backMediaNode = (ensureAudioCtx(), audioCtx.createMediaElementSource(backMediaEl));
      backMediaNode.connect(backGain);
      backMediaEl.addEventListener('canplay', ()=>{ backingMode='media'; playBack.disabled=false; playBack.textContent='▶ Backing'; }, {once:true});
      backMediaEl.addEventListener('loadedmetadata', ()=>{ if (playBack.disabled){ playBack.disabled=false; playBack.textContent='▶ Backing'; } }, {once:true});
    } catch (e) { console.error(e); playBack.disabled=true; playBack.textContent='Unsupported'; backingMode='none'; }
  });
  playBack.addEventListener('click', async ()=>{ ensureAudioCtx(); await audioCtx.resume(); if (backingMode==='none') return; backPlaying?stopBacking():startBacking(); });

  /* ========= QUANTIZE ========= */
  toggleQuant.addEventListener('click', ()=>{ quantizeOn=!quantizeOn; toggleQuant.textContent=`Quantize: ${quantizeOn?'ON':'OFF'}`; });
  function quantizeDelaySec(){
    if (!quantizeOn) return 0;
    const bpm=Math.max(1, parseFloat(bpmInp.value)||120), beats=parseFloat(gridSel.value)||1;
    const qSec=(60/bpm)*beats, bt=backingClockSeconds(), t=(bt!==null)?bt:performance.now()/1000;
    const next=Math.ceil(t/qSec)*qSec; return Math.max(0,next-t);
  }

  /* ========= CLIPS (slicing + UI) ========= */
  const BASE_KEYS = (()=>{
    const d=['1','2','3','4','5','6','7','8','9','0'], l=Array.from({length:26},(_,i)=>String.fromCharCode(97+i));
    return [...d,...l];
  })();
  let segments = [], clipButtons=[], keyBanks=[], currentBank=0;

  function labelForClip(i){ const per=BASE_KEYS.length, bank=Math.floor(i/per), k=BASE_KEYS[i%per].toUpperCase(); return bank===0?k:`⇧+${k}`; }
  function renderMiniKeys(){
    miniKeys.innerHTML=''; const map=keyBanks[currentBank]||new Map();
    for (const [k, idx] of map){
      const b=document.createElement('button'); b.className='keypad-btn'; b.textContent=k.toUpperCase(); b.title=`Clip ${idx+1}`;
      b.addEventListener('pointerdown', e=>{ e.preventDefault(); triggerByIndex(idx); });
      b.addEventListener('click', e=>e.preventDefault());
      miniKeys.appendChild(b);
    }
    bankInfo.textContent=`Bank ${currentBank+1}/${Math.max(1,keyBanks.length)}`;
    prevBank.disabled=currentBank===0; nextBank.disabled=currentBank>=keyBanks.length-1;
  }
  function buildKeyBanks(n){ const per=BASE_KEYS.length, banks=[], total=Math.max(1,Math.ceil(n/per));
    for (let b=0;b<total;b++){ const m=new Map(); for (let i=0;i<per;i++){ const ci=b*per+i; if (ci>=n) break; m.set(BASE_KEYS[i], ci); } banks.push(m); } return banks;
  }
  function renderAllClips(){
    clipsGrid.innerHTML=''; clipButtons=[];
    segments.forEach((seg,i)=>{
      const card=document.createElement('div'); card.className='clip-card'; card.dataset.index=i;
      const btn=document.createElement('button'); btn.className='clip-btn';
      btn.innerHTML=`<span class="kbd">${labelForClip(i)}</span><span class="badge" data-badge>${seg.dur.toFixed(2)}s</span>Clip ${i+1}<small data-range>${fmt(seg.start)} → ${fmt(seg.start+seg.dur)}</small>`;
      btn.addEventListener('click', ()=> triggerClip(seg.start, seg.dur));
      card.appendChild(btn); clipButtons.push(btn);

      const ctrls=document.createElement('div'); ctrls.className='clip-ctrls';
      ctrls.innerHTML=`<label>Start</label><input type="number" step="0.01" min="0" value="${seg.start.toFixed(2)}" data-start>
                       <label>Len</label><input type="number" step="0.01" min="0.05" value="${seg.dur.toFixed(2)}" data-len>
                       <button class="small save">Save</button><button class="small del">Delete</button>`;
      ctrls.querySelector('.save').addEventListener('click', ()=>{
        const s=clamp(parseFloat(ctrls.querySelector('[data-start]').value), 0, Math.max(0, videoDuration-0.01));
        const d=clamp(parseFloat(ctrls.querySelector('[data-len]').value),   0.05, Math.max(0.05, videoDuration-s));
        segments[i] = {start:s, dur:d}; renderAfterChange();
      });
      ctrls.querySelector('.del').addEventListener('click', ()=>{ segments.splice(i,1); renderAfterChange(true); });
      card.appendChild(ctrls); clipsGrid.appendChild(card);
    });
    refreshTrackClipSelectors();
  }
  function renderAfterChange(del=false){ keyBanks=buildKeyBanks(segments.length); if (del) currentBank=Math.min(currentBank, Math.max(0,keyBanks.length-1)); renderMiniKeys(); renderAllClips(); }
  makeClips.addEventListener('click', ()=>{
    if (!videoLoaded) return;
    const offset=Math.max(0, parseFloat(offsetInp.value)||0);
    segments=[];
    if (sliceMode.value==='length'){
      const L=Math.max(0.1, parseFloat(sliceLen.value)||2);
      for (let t=offset; t+0.05<videoDuration; t+=L){ segments.push({start:t, dur:Math.min(L, videoDuration-t)}); }
    } else {
      const N=Math.max(1, parseInt(sliceCount.value,10)||8), usable=Math.max(0, videoDuration-offset), L=usable/N;
      for (let i=0;i<N;i++){ const s=offset+i*L, d=Math.min(L, videoDuration-s); if (d>0.05) segments.push({start:s, dur:d}); }
    }
    currentBank=0; keyBanks=buildKeyBanks(segments.length); renderMiniKeys(); renderAllClips(); buildSequencerUI(); recalcPolyphonyTarget();
  });

  // keyboard trigger
  function normalizeKey(e){ let k=e.key||''; const map={'!':'1','@':'2','#':'3','$':'4','%':'5','^':'6','&':'7','*':'8','(':'9',')':'0'}; if (map[k]) k=map[k]; k=k.toLowerCase(); if (k.length!==1||!/^[a-z0-9]$/.test(k)) return null; return k; }
  document.addEventListener('keydown', (e)=>{
    const tag=(document.activeElement?.tagName||'').toUpperCase();
    if (['INPUT','TEXTAREA','SELECT'].includes(tag) || document.activeElement?.isContentEditable) return;
    if (e.repeat) return;
    const k=normalizeKey(e); if (!k) return;
    const bank = (e.shiftKey && keyBanks[1]) ? 1 : currentBank;
    const map = keyBanks[bank] || new Map();
    if (map.has(k)){ e.preventDefault(); triggerByIndex(map.get(k)); }
  });
  prevBank.addEventListener('click', ()=>{ if (currentBank>0){ currentBank--; renderMiniKeys(); } });
  nextBank.addEventListener('click', ()=>{ if (currentBank<keyBanks.length-1){ currentBank++; renderMiniKeys(); } });
  function triggerByIndex(i){ const seg=segments[i]; if (!seg) return; triggerClip(seg.start, seg.dur); flashClip(i); }
  function flashClip(i){ const b=clipButtons[i]; if (!b) return; b.classList.remove('flash'); b.offsetHeight; b.classList.add('flash'); }

  /* ========= HIGH-PRECISION SCHEDULING ========= */
  function callAtCtxTime(targetCtxTime, fn){
    ensureAudioCtx();
    const early=0.05, tight=0.005; // slightly more lead; tighter final tick
    const wake = Math.max(0, (targetCtxTime - audioCtx.currentTime - early)*1000);
    setTimeout(function tick(){
      const dt = targetCtxTime - audioCtx.currentTime;
      if (dt <= tight) { fn(); }
      else { setTimeout(tick, Math.max(1, (dt - tight)*1000)); }
    }, wake);
  }

  /* ========= VOICE POOL ========= */
  function maxVoicesSetting(){ return Math.max(1, parseInt(maxOverlapInp.value||16,10)); }

  function createVoice(){
    const v=document.createElement('video');
    v.src=videoURL; v.preload='auto'; v.crossOrigin='anonymous'; v.playsInline=true; v.controls=false;
    v.muted=true; v.volume=0; v.tabIndex=-1; v.dataset.role='clip';
    v.disablePictureInPicture = true;
    v.disableRemotePlayback = true;
    v.setAttribute('controlsList','nodownload noplaybackrate noremoteplayback');
    cloneBin.appendChild(v); allMedia.add(v);

    // warm up autoplay/decoder so later starts are instant
    v.play().then(()=>v.pause()).catch(()=>{});

    (async()=>{ await initFXOnce(); ensureAudioCtx(); v._srcNode = audioCtx.createMediaElementSource(v); v._srcNode.connect(clipsPreGain); })();
    return {el:v, busy:false, stopAt:0};
  }

  function initVoicesPool(){
    voices.forEach(v=>{ try{v.el.pause();}catch{} try{v.el._srcNode?.disconnect();}catch{} v.el.removeAttribute('src'); v.el.load?.(); allMedia.delete(v.el); v.el.remove(); });
    voices=[]; voiceIndex=0;
    ensurePoolSize(Math.max(2, maxVoicesSetting()));
  }

  function ensurePoolSize(target){
    target = Math.min(MAX_HARD_VOICES, Math.max(target, maxVoicesSetting()));
    while (voices.length < target) voices.push(createVoice());
    if (voices.length > target){
      // trim extras that are idle
      for (let i=voices.length-1; i>=target; i--){
        if (!voices[i].busy){
          const v = voices.pop();
          try{v.el.pause();}catch{} try{v.el._srcNode?.disconnect();}catch{} allMedia.delete(v.el); v.el.remove();
        } else break;
      }
    }
    poolTarget = target;
  }

  function getVoice(){
    for (let i=0;i<voices.length;i++){
      const idx=(voiceIndex+i)%voices.length;
      if (!voices[idx].busy) { voiceIndex=(idx+1)%voices.length; return voices[idx]; }
    }
    // grow if allowed
    if (voices.length < Math.min(MAX_HARD_VOICES, Math.max(poolTarget, maxVoicesSetting()))){
      const v=createVoice(); voices.push(v); voiceIndex=voices.length%voices.length; return v;
    }
    // otherwise steal the one finishing soonest
    let best=0, bestRemain=Infinity, now=audioCtx?audioCtx.currentTime:0;
    voices.forEach((v,i)=>{ const rem=Math.max(0,v.stopAt-now); if (rem<bestRemain){bestRemain=rem; best=i;} });
    voiceIndex=(best+1)%voices.length; return voices[best];
  }

  function armClipOnVoice(voice, startSec, durSec, whenCtx){
    const v=voice.el;
    voice.busy=true; voice.stopAt = whenCtx + durSec + 0.2; // leave a tiny FX tail

    const lead = 0.15;
    callAtCtxTime(Math.max(audioCtx.currentTime, whenCtx - lead), ()=>{
      try{
        if ('fastSeek' in v) v.fastSeek(startSec);
        else v.currentTime = Math.max(0.01, Math.min(startSec, videoDuration||startSec));
      }catch{}
    });

    callAtCtxTime(whenCtx, ()=>{
      const stopAt = startSec + durSec;
      const tick = () => {
        if (v.currentTime >= stopAt - 0.005) { try{v.pause();}catch{} voice.busy=false; v.removeEventListener('stalled', retry); }
        else { requestAnimationFrame(tick); }
      };
      const retry = () => { v.play().catch(()=>{}); };
      v.addEventListener('stalled', retry);
      v.play().then(()=>{ requestAnimationFrame(tick); }).catch(()=>{ voice.busy=false; });
    });

    // final safety
    setTimeout(()=>{ voice.busy=false; try{v.pause();}catch{} }, Math.max(150, (durSec+0.75)*1000));
  }

  // drive main screen visuals without opening new video windows
  function scheduleVisualClip(startSec, durSec, whenCtx){
    if (!visualFollow.checked) return;
    const lead = 0.12;
    callAtCtxTime(Math.max(audioCtx.currentTime, whenCtx - lead), ()=>{
      try{
        if ('fastSeek' in mainVideo) mainVideo.fastSeek(startSec);
        else mainVideo.currentTime = Math.max(0.01, Math.min(startSec, videoDuration||startSec));
      }catch{}
    });
    callAtCtxTime(whenCtx, ()=>{ mainVideo.muted = true; mainVideo.play().catch(()=>{}); });
  }

  /* ========= MANUAL TRIGGER ========= */
  async function triggerClip(start, dur){
    ensureAudioCtx(); await audioCtx.resume(); openGateOnce();
    ensurePoolSize(Math.max(poolTarget, maxVoicesSetting()));
    const delay = quantizeDelaySec();
    const when  = audioCtx.currentTime + delay;

    scheduleVisualClip(start, dur, when);
    if (!videoLoaded) return;
    const voice = getVoice();
    armClipOnVoice(voice, start, dur, when);
  }

  stopAll.addEventListener('click', ()=>{
    voices.forEach(v=>{ try{v.el.pause();}catch{} v.busy=false; });
    mainVideo.pause();
  });

  setMasterVolumeForMedia(parseFloat(masterVol.value));

  /* ========= SEQUENCER ========= */
  const seq = {
    playing:false, bars:parseInt(seqBarsInp.value,10), stepsPerBar:parseInt(seqSPBInp.value,10),
    beatsPerBar:4, swing:parseFloat(seqSwingInp.value), tracks:[]
  };
  function totalSteps(){ return seq.bars*seq.stepsPerBar; }
  function stepSeconds(){ const bpm=Math.max(1, parseFloat(bpmInp.value)||120); return (60/bpm)*(seq.beatsPerBar/seq.stepsPerBar); }

  let headCols = [];
  function buildHeadRow(){
    const cols=totalSteps(); seqStepsHead.innerHTML=''; seqStepsHead.style.gridTemplateColumns=`repeat(${cols},22px)`; headCols.length=cols;
    for (let i=0;i<cols;i++){
      const h=document.createElement('div'); h.className='tiny'; h.style.textAlign='center';
      const bar=Math.floor(i/seq.stepsPerBar)+1, pos=(i%seq.stepsPerBar)+1; h.textContent=(pos===1)?bar:'•';
      seqStepsHead.appendChild(h); headCols[i]=[];
    }
  }
  function renderStepsRow(container, track){
    const cols=totalSteps(); container.innerHTML='';
    for (let c=0;c<cols;c++){
      const btn=document.createElement('button'); btn.className='seq-step'; if (track.steps[c]) btn.classList.add('on');
      btn.addEventListener('click', ()=>{
        track.steps[c]=track.steps[c]?0:1;
        btn.classList.toggle('on', !!track.steps[c]);
        recalcPolyphonyTarget();  // keep pool sized to pattern
      });
      container.appendChild(btn);
      (headCols[c]||(headCols[c]=[])).push(btn);
    }
  }
  function buildTrackRows(){
    const cols=totalSteps(); seqRowsEl.innerHTML='';
    seq.tracks.forEach((t,i)=>{
      const row=document.createElement('div'); row.className='seq-row';
      const controls=document.createElement('div'); controls.className='seq-track-controls';
      controls.innerHTML=`<span class="tiny">Track ${i+1}</span><select data-clip></select>
                          <button class="pill" data-mute>${t.mute?'Unmute':'Mute'}</button>
                          <button class="pill" data-clear>Clear</button>`;
      row.appendChild(controls);
      const sel=controls.querySelector('[data-clip]');
      sel.innerHTML = segments.map((s,idx)=>`<option value="${idx}" ${idx===t.clip?'selected':''}>Clip ${idx+1} (${fmt(s.start)}→${fmt(s.start+s.dur)})</option>`).join('');
      sel.addEventListener('change', ()=> t.clip=parseInt(sel.value,10)||0);
      const muteBtn=controls.querySelector('[data-mute]');
      const setMute=()=>{ muteBtn.textContent=t.mute?'Unmute':'Mute'; muteBtn.classList.toggle('on',t.mute); recalcPolyphonyTarget(); };
      muteBtn.addEventListener('click', ()=>{ t.mute=!t.mute; setMute(); }); setMute();
      controls.querySelector('[data-clear]').addEventListener('click', ()=>{ t.steps.fill(0); renderStepsRow(stepsWrap,t); recalcPolyphonyTarget(); });

      const stepsWrap=document.createElement('div'); stepsWrap.className='seq-steps'; stepsWrap.style.gridTemplateColumns=`repeat(${cols},22px)`; row.appendChild(stepsWrap);
      renderStepsRow(stepsWrap,t);
      seqRowsEl.appendChild(row);
    });
  }
  function refreshTrackClipSelectors(){
    document.querySelectorAll('select[data-clip]').forEach((sel,idx)=>{
      const t=seq.tracks[idx], prev=t?.clip??0;
      sel.innerHTML=segments.map((s,i)=>`<option value="${i}" ${i===prev?'selected':''}>Clip ${i+1} (${fmt(s.start)}→${fmt(s.start+s.dur)})</option>`).join('');
    });
  }
  function resizePatternPreserving(){
    const n=totalSteps();
    seq.tracks.forEach(t=>{ const old=t.steps, next=new Uint8Array(n); next.set(old.subarray(0,Math.min(old.length,n))); t.steps=next; });
  }
  function buildSequencerUI(){
    const want=parseInt(seqTracksInp.value,10)||4;
    while (seq.tracks.length<want) seq.tracks.push({clip: Math.min(seq.tracks.length, Math.max(0,segments.length-1)), mute:false, steps:new Uint8Array(totalSteps())});
    while (seq.tracks.length>want) seq.tracks.pop();
    buildHeadRow(); buildTrackRows(); recalcPolyphonyTarget();
  }
  seqRebuild.addEventListener('click', ()=>{ seq.bars=parseInt(seqBarsInp.value,10)||1; seq.stepsPerBar=parseInt(seqSPBInp.value,10)||16; seq.swing=parseFloat(seqSwingInp.value)||0; resizePatternPreserving(); buildSequencerUI(); });
  seqBarsInp.addEventListener('change', ()=>seqRebuild.click()); seqSPBInp.addEventListener('change', ()=>seqRebuild.click());
  seqSwingInp.addEventListener('input', ()=>{ seq.swing=parseFloat(seqSwingInp.value)||0; });

  // pattern tools
  seqClearBtn.addEventListener('click', ()=>{ seq.tracks.forEach(t=>t.steps.fill(0)); buildSequencerUI(); });
  seqFourBtn.addEventListener('click', ()=>{
    const spb=seq.stepsPerBar, bpb=seq.beatsPerBar;
    seq.tracks.forEach(t=>{ t.steps.fill(0); for (let bar=0;bar<seq.bars;bar++){ for (let beat=0;beat<bpb;beat++){ t.steps[bar*spb + beat*(spb/bpb)] = 1; } }});
    buildSequencerUI();
  });
  seqRandBtn.addEventListener('click', ()=>{ const p=0.35; seq.tracks.forEach(t=>{ for (let i=0;i<totalSteps();i++) t.steps[i] = (Math.random()<p)?1:0; }); buildSequencerUI(); });
  function euclid(pulses, steps){ let pattern=[], counts=[], rem=[pulses], level=0, divisor=steps-pulses;
    while (true){ counts.push(Math.floor(divisor/rem[level])); const r=divisor%rem[level]; rem.push(r); divisor=rem[level]; level++; if (rem[level]<=1) break; } counts.push(divisor);
    function build(l){ if (l===-1) pattern.push(0); else if (l===-2) pattern.push(1); else { for (let i=0;i<counts[l];i++) build(l-1); if (rem[l]!==0) build(l-2); } } build(level); return pattern.slice(0,steps);
  }
  seqEuclidBtn.addEventListener('click', ()=>{ const steps=totalSteps(), pulses=Math.max(1,Math.round(steps*0.3)), base=euclid(pulses,steps); seq.tracks.forEach(t=> t.steps=new Uint8Array(base)); buildSequencerUI(); });

  // polyphony estimator (keeps pool big enough for current pattern)
  function estimatePeakPolyphony() {
    const n = totalSteps(); let peak = 1;
    for (let c=0;c<n;c++){
      let count = 0;
      for (const t of seq.tracks) if (!t.mute && t.steps[c]) count++;
      if (count > peak) peak = count;
    }
    return Math.min(MAX_HARD_VOICES, Math.max(1, peak));
  }
  function recalcPolyphonyTarget() {
    const needed = estimatePeakPolyphony();
    ensurePoolSize(Math.max(needed, maxVoicesSetting()));
  }

  // play/stop
  let schedulerTimer=null, nextStepIndex=0, nextStepTime=0, playheadCol=-1;
  function setPlayhead(col, on){
    (headCols[col]||[]).forEach(el=>el.classList.toggle('play', !!on));
  }
  function startSequencer(){
    ensureAudioCtx(); if (seq.playing) return; seq.playing=true; openGateOnce();
    recalcPolyphonyTarget();
    const s=stepSeconds(); nextStepIndex=0; nextStepTime = audioCtx.currentTime + 0.15;
    const lookahead=0.025, horizon=0.20;
    const loop = ()=>{
      if (!seq.playing) return;
      const now=audioCtx.currentTime;
      while (nextStepTime < now + horizon){
        scheduleStep(nextStepIndex, nextStepTime);
        nextStepIndex = (nextStepIndex+1) % totalSteps();
        nextStepTime += s;
      }
      schedulerTimer = setTimeout(loop, lookahead*1000);
    };
    loop(); seqStartBtn.textContent='⏸ Running'; seqStartBtn.disabled=true;
  }
  function stopSequencer(){
    seq.playing=false; if (schedulerTimer){ clearTimeout(schedulerTimer); schedulerTimer=null; }
    if (playheadCol>=0) setPlayhead(playheadCol,false);
    playheadCol=-1; seqStartBtn.textContent='▶ Start'; seqStartBtn.disabled=false;
  }
  function scheduleStep(stepIdx, whenCtx){
    // swing
    if (seq.swing>0){
      const spb=seq.stepsPerBar/seq.beatsPerBar;
      if (spb>=2){
        const inBeat = stepIdx % Math.round(spb);
        if ((inBeat%2)===1) whenCtx += (stepSeconds()/2)*seq.swing;
      }
    }

    // draw playhead exactly on time (no early flicker)
    callAtCtxTime(whenCtx, ()=>{
      if (playheadCol>=0) setPlayhead(playheadCol,false);
      playheadCol = stepIdx;
      setPlayhead(stepIdx,true);
    });

    // fire tracks (full clip length, overlapping allowed)
    const fired = [];
    for (const t of seq.tracks){
      if (t.mute || !t.steps[stepIdx]) continue;
      const clip = segments[t.clip]; if (!clip) continue;
      fired.push(clip);
      ensurePoolSize(Math.max(poolTarget, fired.length)); // scale up if this step is dense
      const voice = getVoice();
      armClipOnVoice(voice, clip.start, clip.dur, whenCtx);
    }

    // drive main screen with the last triggered clip this step
    if (fired.length){
      const last = fired[fired.length-1];
      scheduleVisualClip(last.start, last.dur, whenCtx);
    }
  }
  seqStartBtn.addEventListener('click', startSequencer);
  seqStopBtn.addEventListener('click',  stopSequencer);

  /* ========= INIT ========= */
// NOTE: BASE_KEYS, keyBanks, currentBank, clipButtons, labelForClip/renderMiniKeys/renderAllClips
// are already defined above in the "CLIPS (slicing + UI)" section — don't redeclare them here.

function buildInitialTracks(){
  const want = parseInt(seqTracksInp.value, 10) || 4;
  seq.tracks.length = 0;
  for (let i = 0; i < want; i++){
    seq.tracks.push({ clip: 0, mute: false, steps: new Uint8Array(totalSteps()) });
  }
}

buildInitialTracks();
buildSequencerUI();
})();
</script>
