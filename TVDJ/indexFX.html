<script>
(() => {
  // --- Elements
  const videoFile = document.getElementById('videoFile');
  const backFile  = document.getElementById('backFile');
  const playBack  = document.getElementById('playBack');
  const backVol   = document.getElementById('backVol');
  const masterVol = document.getElementById('masterVol');
  const sliceMode = document.getElementById('sliceMode');
  const sliceLen  = document.getElementById('sliceLen');
  const sliceCount= document.getElementById('sliceCount');
  const offsetInp = document.getElementById('offset');
  const makeClips = document.getElementById('makeClips');
  const durInfo   = document.getElementById('durInfo');
  const bpmInp    = document.getElementById('bpm');
  const gridSel   = document.getElementById('grid');
  const toggleQuant = document.getElementById('toggleQuant');
  const visualFollow = document.getElementById('visualFollow');
  const clipVol   = document.getElementById('clipVol');
  const stopAll   = document.getElementById('stopAll');

  const mainVideo = document.getElementById('mainVideo');
  const clipsGrid = document.getElementById('clips');
  const cloneBin  = document.getElementById('cloneBin');

  // Mini keyboard
  const miniKeys  = document.getElementById('miniKeys');
  const prevBank  = document.getElementById('prevBank');
  const nextBank  = document.getElementById('nextBank');
  const bankInfo  = document.getElementById('bankInfo');

  // --- State
  let videoURL = null;
  let videoLoaded = false;
  let videoDuration = 0;
  let quantizeOn = false;

  /* ====== FX RACK (clips only) ============================================ */
  let clipsPreGain, clipsDryGain, clipsBus, fxSendGain, fxSumGain, fxMasterWet;
  let rvConvolver, rvWet, dlDelay, dlFbGain, dlWet, vbDelay, vbLFO, vbWet, dsShaper, dsWet;
  let bcNode, bcWet;
  let fxInitialized = false;

  const fxOn     = document.getElementById('fxOn');
  const fxMix    = document.getElementById('fxMix');
  // Reverb
  const rvOn     = document.getElementById('rvOn');
  const rvWetCtl = document.getElementById('rvWet');
  const rvSize   = document.getElementById('rvSize');
  // Delay
  const dlOn     = document.getElementById('dlOn');
  const dlTime   = document.getElementById('dlTime');
  const dlFb     = document.getElementById('dlFb');
  const dlWetCtl = document.getElementById('dlWet');
  // Vibrato
  const vbOn     = document.getElementById('vbOn');
  const vbRate   = document.getElementById('vbRate');
  const vbDepth  = document.getElementById('vbDepth');
  const vbWetCtl = document.getElementById('vbWet');
  // Distortion
  const dsOn     = document.getElementById('dsOn');
  const dsDrive  = document.getElementById('dsDrive');
  const dsWetCtl = document.getElementById('dsWet');
  // Bitcrusher
  const bcOn     = document.getElementById('bcOn');
  const bcBits   = document.getElementById('bcBits');
  const bcRed    = document.getElementById('bcRed');
  const bcWetCtl = document.getElementById('bcWet');

  function buildImpulse(ctx, seconds=2.5) {
    const rate = ctx.sampleRate;
    const len  = Math.max(1, Math.floor(seconds * rate));
    const buf  = ctx.createBuffer(2, len, rate);
    for (let ch=0; ch<2; ch++) {
      const data = buf.getChannelData(ch);
      for (let i=0; i<len; i++) {
        const n = Math.random()*2-1;
        const decay = Math.pow(1 - i/len, 2.5);
        data[i] = n * decay * 0.8;
      }
    }
    return buf;
  }
  function makeCurve(amount=0.6) {
    const k = amount * 100 + 1;
    const n = 44100;
    const curve = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      const x = (i / n) * 2 - 1;
      curve[i] = Math.tanh(k * x) / Math.tanh(k);
    }
    return curve;
  }

  let bitcrusherModuleLoaded = false;
  async function createBitcrusher(ctx) {
    if (ctx.audioWorklet && !bitcrusherModuleLoaded) {
      const code = `
        class BitCrusher extends AudioWorkletProcessor {
          static get parameterDescriptors() {
            return [
              { name:'bits', defaultValue:8, minValue:1, maxValue:16, automationRate:'k-rate' },
              { name:'reduction', defaultValue:4, minValue:1, maxValue:32, automationRate:'k-rate' }
            ];
          }
          constructor(){ super(); this.phase = 0; this.last = 0; }
          process(inputs, outputs, parameters){
            const input = inputs[0], output = outputs[0];
            if (!input || !input[0]) return true;
            const bits = parameters.bits[0]|0;
            const red  = parameters.reduction[0]|0;
            const step = 2 / (Math.pow(2, bits) - 1);
            for (let ch=0; ch<output.length; ch++){
              const iCh = input[ch] || input[0], oCh = output[ch];
              for (let i=0; i<oCh.length; i++){
                this.phase++;
                if (this.phase >= Math.max(1, red)) {
                  this.phase = 0;
                  this.last = step * Math.round(iCh[i] / step);
                }
                oCh[i] = this.last;
              }
            }
            return true;
          }
        }
        registerProcessor('bitcrusher', BitCrusher);
      `;
      const blob = new Blob([code], {type:'application/javascript'});
      const url  = URL.createObjectURL(blob);
      await ctx.audioWorklet.addModule(url);
      URL.revokeObjectURL(url);
      bitcrusherModuleLoaded = true;
    }

    if (bitcrusherModuleLoaded) {
      const node = new AudioWorkletNode(ctx, 'bitcrusher', {
        numberOfInputs: 1, numberOfOutputs: 1, outputChannelCount: [2]
      });
      node.parameters.get('bits').value = parseFloat(bcBits.value);
      node.parameters.get('reduction').value = parseFloat(bcRed.value);
      return node;
    }

    const sp = ctx.createScriptProcessor(1024, 2, 2);
    sp.bits = parseFloat(bcBits.value)|0; sp.reduction = parseFloat(bcRed.value)|0;
    sp.onaudioprocess = (e) => {
      for (let ch=0; ch<2; ch++){
        const input = e.inputBuffer.getChannelData(ch);
        const output= e.outputBuffer.getChannelData(ch);
        const step  = 2 / (Math.pow(2, sp.bits) - 1);
        sp._phase = sp._phase || 0; sp._last = sp._last || 0;
        for (let i=0;i<input.length;i++){
          sp._phase++;
          if (sp._phase >= Math.max(1, sp.reduction)) {
            sp._phase = 0;
            sp._last = step * Math.round(input[i] / step);
          }
          output[i] = sp._last;
        }
      }
    };
    return sp;
  }

  // --- Web Audio mixer (backing)
  let audioCtx = null, masterGain = null, backGain = null;
  function ensureAudioCtx() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = audioCtx.createGain();
      backGain   = audioCtx.createGain();
      masterGain.gain.value = parseFloat(masterVol.value);
      backGain.gain.value   = parseFloat(backVol.value);
      backGain.connect(masterGain);
      masterGain.connect(audioCtx.destination);
      window.addEventListener('click', () => audioCtx.resume(), { once:true });
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible' && audioCtx?.state === 'suspended') audioCtx.resume();
      });
    }
  }

  // ===== Build FX graph once and wire =====
  async function initFXOnce() {
    if (fxInitialized) return;
    ensureAudioCtx();

    clipsBus    = audioCtx.createGain();
    clipsPreGain= audioCtx.createGain();
    clipsDryGain= audioCtx.createGain();
    fxSendGain  = audioCtx.createGain();
    fxSumGain   = audioCtx.createGain();
    fxMasterWet = audioCtx.createGain();

    clipsPreGain.gain.value = parseFloat(clipVol.value);
    clipsDryGain.gain.value = 1 - parseFloat(fxMix.value);
    fxSendGain.gain.value   = 1;
    fxMasterWet.gain.value  = parseFloat(fxMix.value);

    rvConvolver = audioCtx.createConvolver();
    rvConvolver.buffer = buildImpulse(audioCtx, parseFloat(rvSize.value));
    rvWet = audioCtx.createGain(); rvWet.gain.value = parseFloat(rvWetCtl.value);

    dlDelay   = audioCtx.createDelay(2.0);
    dlDelay.delayTime.value = parseFloat(dlTime.value);
    dlFbGain  = audioCtx.createGain(); dlFbGain.gain.value = parseFloat(dlFb.value);
    dlWet     = audioCtx.createGain(); dlWet.gain.value = parseFloat(dlWetCtl.value);
    dlDelay.connect(dlFbGain); dlFbGain.connect(dlDelay);

    vbDelay = audioCtx.createDelay(0.05);
    vbDelay.delayTime.value = parseFloat(vbDepth.value);
    vbLFO   = audioCtx.createOscillator();
    const vbGain = audioCtx.createGain(); vbGain.gain.value = parseFloat(vbDepth.value);
    vbLFO.frequency.value = parseFloat(vbRate.value);
    vbLFO.connect(vbGain).connect(vbDelay.delayTime);
    vbLFO.start();
    vbWet = audioCtx.createGain(); vbWet.gain.value = parseFloat(vbWetCtl.value);

    dsShaper = audioCtx.createWaveShaper();
    dsShaper.curve = makeCurve(parseFloat(dsDrive.value));
    dsWet = audioCtx.createGain(); dsWet.gain.value = parseFloat(dsWetCtl.value);

    bcNode = await createBitcrusher(audioCtx);
    bcWet  = audioCtx.createGain(); bcWet.gain.value = parseFloat(bcWetCtl.value);

    fxSendGain.connect(rvConvolver); rvConvolver.connect(rvWet).connect(fxSumGain);
    fxSendGain.connect(dlDelay);     dlDelay.connect(dlWet).connect(fxSumGain);
    fxSendGain.connect(vbDelay);     vbDelay.connect(vbWet).connect(fxSumGain);
    fxSendGain.connect(dsShaper);    dsShaper.connect(dsWet).connect(fxSumGain);
    fxSendGain.connect(bcNode);      bcNode.connect(bcWet).connect(fxSumGain);

    clipsPreGain.connect(clipsDryGain).connect(clipsBus);
    clipsPreGain.connect(fxSendGain);
    fxSumGain.connect(fxMasterWet).connect(clipsBus);

    clipsBus.connect(masterGain);

    const updMix = () => {
      const mix = fxOn.checked ? parseFloat(fxMix.value) : 0;
      clipsDryGain.gain.value = 1 - mix;
      fxMasterWet.gain.value  = mix;
    };
    fxOn.addEventListener('change', updMix);
    fxMix.addEventListener('input', updMix);

    rvOn.addEventListener('change', ()=> rvWet.gain.value = rvOn.checked ? parseFloat(rvWetCtl.value) : 0);
    rvWetCtl.addEventListener('input', ()=> rvWet.gain.value = rvOn.checked ? parseFloat(rvWetCtl.value) : 0);
    rvSize.addEventListener('change', ()=> { rvConvolver.buffer = buildImpulse(audioCtx, parseFloat(rvSize.value)); });

    dlOn.addEventListener('change', ()=> dlWet.gain.value = dlOn.checked ? parseFloat(dlWetCtl.value) : 0);
    dlWetCtl.addEventListener('input', ()=> dlWet.gain.value = dlOn.checked ? parseFloat(dlWetCtl.value) : 0);
    dlTime.addEventListener('input', ()=> dlDelay.delayTime.value = parseFloat(dlTime.value));
    dlFb.addEventListener('input',   ()=> dlFbGain.gain.value     = parseFloat(dlFb.value));

    vbOn.addEventListener('change', ()=> vbWet.gain.value = vbOn.checked ? parseFloat(vbWetCtl.value) : 0);
    vbWetCtl.addEventListener('input', ()=> vbWet.gain.value = vbOn.checked ? parseFloat(vbWetCtl.value) : 0);
    vbRate.addEventListener('input', ()=> vbLFO.frequency.value = parseFloat(vbRate.value));
    vbDepth.addEventListener('input',()=> vbDelay.delayTime.value = parseFloat(vbDepth.value));

    dsOn.addEventListener('change', ()=> dsWet.gain.value = dsOn.checked ? parseFloat(dsWetCtl.value) : 0);
    dsWetCtl.addEventListener('input', ()=> dsWet.gain.value = dsOn.checked ? parseFloat(dsWetCtl.value) : 0);
    dsDrive.addEventListener('input', ()=> dsShaper.curve = makeCurve(parseFloat(dsDrive.value)));

    bcOn.addEventListener('change', ()=> bcWet.gain.value = bcOn.checked ? parseFloat(bcWetCtl.value) : 0);
    bcWetCtl.addEventListener('input', ()=> bcWet.gain.value = bcOn.checked ? parseFloat(bcWetCtl.value) : 0);
    bcBits.addEventListener('input', ()=> {
      if (bcNode.parameters) { bcNode.parameters.get('bits').value = parseFloat(bcBits.value); }
      else { bcNode.bits = parseFloat(bcBits.value)|0; }
    });
    bcRed.addEventListener('input', ()=> {
      if (bcNode.parameters) { bcNode.parameters.get('reduction').value = parseFloat(bcRed.value); }
      else { bcNode.reduction = parseFloat(bcRed.value)|0; }
    });

    clipVol.addEventListener('input', () => {
      if (clipsPreGain) clipsPreGain.gain.value = parseFloat(clipVol.value);
    });

    fxInitialized = true;
  }

  /* Connect a <video> clone’s audio into the FX bus (Safari-safe) */
  async function attachClipToFX(videoEl){
    await initFXOnce();
    ensureAudioCtx();

    // Important: keep element UNMUTED so MediaElementSource has signal.
    // Silence its direct output to avoid double audio; WebAudio carries the sound.
    videoEl.muted = false;
    videoEl.volume = 0;

    const src = audioCtx.createMediaElementSource(videoEl);
    videoEl._srcNode = src;
    src.connect(clipsPreGain);
  }

  // --- Backing engine (BUFFER or MEDIA)
  let backingMode = 'none';
  let backBuffer = null, backSource = null, backPlaying = false, backStartTime = 0, backOffset = 0;
  let backMediaEl = null, backMediaNode = null, backMediaURL = null;

  function clearBacking() {
    stopBacking(true);
    backBuffer = null; backSource = null; backPlaying = false; backOffset = 0;
    if (backMediaEl) { try { backMediaEl.pause(); } catch {} }
    if (backMediaNode) { try { backMediaNode.disconnect(); } catch {} }
    if (backMediaURL) { URL.revokeObjectURL(backMediaURL); }
    backMediaEl = null; backMediaNode = null; backMediaURL = null;
    backingMode = 'none';
  }

  function startBacking() {
    ensureAudioCtx();
    if (backingMode === 'buffer') {
      if (!backBuffer) return;
      if (backSource) { try { backSource.stop(); } catch {} backSource.disconnect(); }
      backSource = audioCtx.createBufferSource();
      backSource.buffer = backBuffer;
      backSource.loop = true;
      backSource.connect(backGain);
      backStartTime = audioCtx.currentTime;
      backSource.start(0, backOffset % backBuffer.duration);
      backPlaying = true;
      playBack.textContent = '⏸ Backing';
    } else if (backingMode === 'media') {
      if (!backMediaEl) return;
      backMediaEl.loop = true;
      backMediaEl.muted = true;
      backMediaEl.volume = 1;
      backMediaEl.play().then(()=>{ playBack.textContent = '⏸ Backing'; }).catch(()=>{});
      backPlaying = true;
    }
  }

  function stopBacking(force = false) {
    if (backingMode === 'buffer') {
      if (backSource) {
        if (!force) {
          const t = backingClockSeconds() ?? 0;
          backOffset = backBuffer ? (t % backBuffer.duration) : 0;
        }
        try { backSource.stop(); } catch {}
        backSource.disconnect();
        backSource = null;
      }
      backPlaying = false;
    } else if (backingMode === 'media') {
      if (backMediaEl) { try { backMediaEl.pause(); } catch {} }
      backPlaying = false;
    }
    playBack.textContent = '▶ Backing';
  }

  function backingClockSeconds() {
    if (!audioCtx || !backPlaying) return null;
    if (backingMode === 'buffer' && backBuffer) {
      return backOffset + (audioCtx.currentTime - backStartTime);
    }
    if (backingMode === 'media' && backMediaEl) {
      return backMediaEl.currentTime || 0;
    }
    return null;
  }

  // Volumes for HTMLMedia (clips & main video)
  const allMedia = new Set();
  function setMasterVolumeForMedia(v) {
    allMedia.forEach(m => {
      if (m.dataset.role === 'clip') {
        // Always keep element output at 0 to prevent double audio.
        m.volume = 0;
      } else {
        m.volume = v;
      }
    });
  }
  masterVol.addEventListener('input', () => {
    setMasterVolumeForMedia(parseFloat(masterVol.value));
    if (masterGain) masterGain.gain.value = parseFloat(masterVol.value);
  });
  backVol.addEventListener('input', () => {
    if (backGain) backGain.gain.value = parseFloat(backVol.value);
  });

  // --- Load Main Video
  videoFile.addEventListener('change', () => {
    const f = videoFile.files?.[0];
    if (!f) return;
    if (videoURL) URL.revokeObjectURL(videoURL);
    videoURL = URL.createObjectURL(f);
    mainVideo.src = videoURL;
    mainVideo.muted = true; // visuals only; audio via clones
    allMedia.add(mainVideo);
    mainVideo.onloadedmetadata = () => {
      videoDuration = mainVideo.duration || 0;
      videoLoaded = true;
      durInfo.textContent = `Video duration: ${videoDuration.toFixed(2)}s`;
      makeClips.disabled = false;
      mainVideo.currentTime = 0.01;
    };
  });

  // --- Load Backing (try BUFFER decode, else MEDIA element including video)
  backFile.addEventListener('change', async () => {
    const f = backFile.files?.[0];
    if (!f) return;
    ensureAudioCtx();
    clearBacking();
    playBack.disabled = true;
    playBack.textContent = '…loading';

    try {
      const arrBuf = await f.arrayBuffer();
      backBuffer = await audioCtx.decodeAudioData(arrBuf);
      backingMode = 'buffer';
      backOffset = 0;
      playBack.disabled = false;
      playBack.textContent = '▶ Backing';
      return;
    } catch (e) {}

    try {
      backMediaURL = URL.createObjectURL(f);
      backMediaEl = f.type.startsWith('video/') ? document.createElement('video') : document.createElement('audio');
      backMediaEl.src = backMediaURL;
      backMediaEl.preload = 'auto';
      backMediaEl.crossOrigin = 'anonymous';
      backMediaEl.muted = true;
      backMediaEl.loop = true;
      backMediaEl.playsInline = true;
      backMediaEl.controls = false;
      backMediaNode = audioCtx.createMediaElementSource(backMediaEl);
      backMediaNode.connect(backGain);

      backMediaEl.addEventListener('canplay', () => {
        backingMode = 'media';
        playBack.disabled = false;
        playBack.textContent = '▶ Backing';
      }, { once: true });
      backMediaEl.addEventListener('loadedmetadata', () => {
        if (playBack.disabled) { playBack.disabled = false; playBack.textContent = '▶ Backing'; }
      }, { once: true });
    } catch (err) {
      console.error('Backing load failed:', err);
      playBack.disabled = true;
      playBack.textContent = 'Unsupported';
      backingMode = 'none';
    }
  });

  // --- Backing toggle
  playBack.addEventListener('click', async () => {
    ensureAudioCtx();
    await audioCtx.resume();
    if (backingMode === 'none') return;
    if (!backPlaying) startBacking();
    else stopBacking();
  });

  // --- Quantize
  toggleQuant.addEventListener('click', () => {
    quantizeOn = !quantizeOn;
    toggleQuant.textContent = `Quantize: ${quantizeOn ? 'ON' : 'OFF'}`;
  });
  function quantizeDelaySec() {
    if (!quantizeOn) return 0;
    const bpm   = Math.max(1, parseFloat(bpmInp.value) || 120);
    const theBeats = parseFloat(gridSel.value) || 1;
    const qSec  = (60 / bpm) * theBeats;
    const bt    = backingClockSeconds();
    const t     = (bt !== null) ? bt : performance.now()/1000;
    const next  = Math.ceil(t / qSec) * qSec;
    return Math.max(0, next - t);
  }

  // === Keyboard mapping / mini keyboard ====================================
  const BASE_KEYS = (() => {
    const digits = ['1','2','3','4','5','6','7','8','9','0'];
    const letters = Array.from({length:26}, (_,i)=> String.fromCharCode(97+i));
    return [...digits, ...letters];
  })();
  let segments = [];           // [{start,dur}, ...]
  let clipButtons = [];        // DOM nodes for visual flash
  let keyBanks = [];           // [ Map(key -> clipIndex), ... ]
  let currentBank = 0;

  function buildKeyBanks(count) {
    const banks = [];
    const per = BASE_KEYS.length;
    const totalBanks = Math.max(1, Math.ceil(count / per));
    for (let b = 0; b < totalBanks; b++) {
      const m = new Map();
      for (let i = 0; i < per; i++) {
        const clipIndex = b*per + i;
        if (clipIndex >= count) break;
        m.set(BASE_KEYS[i], clipIndex);
      }
      banks.push(m);
    }
    return banks;
  }

  function renderMiniKeys() {
    miniKeys.innerHTML = '';
    const map = keyBanks[currentBank] || new Map();
    for (const [k, idx] of map) {
      const btn = document.createElement('button');
      btn.className = 'keypad-btn';
      btn.textContent = k.toUpperCase();
      btn.title = `Clip ${idx+1}`;
      btn.addEventListener('pointerdown', (e) => { e.preventDefault(); triggerByIndex(idx); });
      btn.addEventListener('click', (e) => { e.preventDefault(); });
      miniKeys.appendChild(btn);
    }
    bankInfo.textContent = `Bank ${currentBank+1}/${Math.max(1, keyBanks.length)}`;
    prevBank.disabled = currentBank === 0;
    nextBank.disabled = currentBank >= keyBanks.length - 1;
  }

  function normalizeKey(e) {
    let k = e.key || '';
    if (!k) return null;
    const mapShiftDigits = {'!':'1','@':'2','#':'3','$':'4','%':'5','^':'6','&':'7','*':'8','(':'9',')':'0'};
    if (mapShiftDigits[k]) k = mapShiftDigits[k];
    k = k.toLowerCase();
    if (k.length !== 1) return null;
    if (!/[a-z0-9]/.test(k)) return null;
    return k;
  }

  document.addEventListener('keydown', (e) => {
    const tag = (document.activeElement?.tagName || '').toUpperCase();
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || document.activeElement?.isContentEditable) return;
    if (e.repeat) return;

    const k = normalizeKey(e);
    if (!k) return;

    const bankTry = e.shiftKey && keyBanks[1] ? 1 : currentBank;
    const map = keyBanks[bankTry] || new Map();
    if (map.has(k)) {
      e.preventDefault();
      triggerByIndex(map.get(k));
    }
  });

  prevBank.addEventListener('click', () => { if (currentBank > 0) { currentBank--; renderMiniKeys(); } });
  nextBank.addEventListener('click', () => { if (currentBank < keyBanks.length-1) { currentBank++; renderMiniKeys(); } });

  function labelForClip(i){
    const per = BASE_KEYS.length;
    const bank = Math.floor(i / per);
    const k = BASE_KEYS[i % per].toUpperCase();
    return bank === 0 ? k : `⇧+${k}`;
  }

  function flashClip(i){
    const btn = clipButtons[i];
    if (!btn) return;
    btn.classList.remove('flash'); btn.offsetHeight;
    btn.classList.add('flash');
  }

  function triggerByIndex(i){
    const seg = segments[i];
    if (!seg) return;
    triggerClip(seg.start, seg.dur);
    flashClip(i);
  }

  // ====== CLIP RENDERING with EDIT/DELETE ===================================
  function clamp(val, min, max){ return Math.min(max, Math.max(min, val)); }

  function renderAllClips() {
    clipsGrid.innerHTML = '';
    clipButtons = [];
    segments.forEach((seg, i) => {
      const card = document.createElement('div');
      card.className = 'clip-card';
      card.dataset.index = i;

      const btn = document.createElement('button');
      btn.className = 'clip-btn';
      btn.innerHTML = `<span class="kbd">${labelForClip(i)}</span>
                       <span class="badge" data-badge>${seg.dur.toFixed(2)}s</span>
                       Clip ${i+1}
                       <small data-range>${fmt(seg.start)} → ${fmt(seg.start+seg.dur)}</small>`;
      btn.addEventListener('click', () => triggerClip(seg.start, seg.dur));
      card.appendChild(btn);
      clipButtons.push(btn);

      const ctrls = document.createElement('div');
      ctrls.className = 'clip-ctrls';
      ctrls.innerHTML = `
        <label>Start</label>
        <input type="number" step="0.01" min="0" value="${seg.start.toFixed(2)}" data-start>
        <label>Len</label>
        <input type="number" step="0.01" min="0.05" value="${seg.dur.toFixed(2)}" data-len>
        <button class="small save">Save</button>
        <button class="small del">Delete</button>
      `;
      ctrls.querySelector('.save').addEventListener('click', () => {
        const startInp = ctrls.querySelector('[data-start]');
        const lenInp   = ctrls.querySelector('[data-len]');
        let s = parseFloat(startInp.value); if (!Number.isFinite(s)) s = seg.start;
        let d = parseFloat(lenInp.value);   if (!Number.isFinite(d)) d = seg.dur;

        s = clamp(s, 0, Math.max(0, videoDuration - 0.01));
        d = clamp(d, 0.05, Math.max(0.05, videoDuration - s));
        segments[i] = { start: s, dur: d };
        renderAfterChange();
      });
      ctrls.querySelector('.del').addEventListener('click', () => {
        segments.splice(i, 1);
        renderAfterChange(true);
      });

      card.appendChild(ctrls);
      clipsGrid.appendChild(card);
    });
  }

  function renderAfterChange(deleted=false){
    keyBanks = buildKeyBanks(segments.length);
    if (deleted) currentBank = Math.min(currentBank, Math.max(0, keyBanks.length-1));
    renderMiniKeys();
    renderAllClips();
  }

  // --- Slice / Make buttons
  makeClips.addEventListener('click', () => {
    if (!videoLoaded) return;
    segments = [];

    const offset = Math.max(0, parseFloat(offsetInp.value) || 0);

    if (sliceMode.value === 'length') {
      const L = Math.max(0.1, parseFloat(sliceLen.value) || 2);
      for (let t = offset; t + 0.05 < videoDuration; t += L) {
        const dur = Math.min(L, videoDuration - t);
        segments.push({ start: t, dur });
      }
    } else {
      const N = Math.max(1, parseInt(sliceCount.value,10) || 8);
      const usable = Math.max(0, videoDuration - offset);
      const L = usable / N;
      for (let i = 0; i < N; i++) {
        const start = offset + i * L;
        const dur = Math.min(L, videoDuration - start);
        if (dur > 0.05) segments.push({ start, dur });
      }
    }

    keyBanks = buildKeyBanks(segments.length);
    currentBank = 0;
    renderMiniKeys();
    renderAllClips();
  });

  function fmt(t) {
    const m = Math.floor(t/60), s = (t%60).toFixed(2).padStart(5,'0');
    return `${m}:${s}`;
  }

  // --- Clip triggering
  const liveClones = new Set();
  async function triggerClip(start, dur) {
    const delay = quantizeDelaySec();
    ensureAudioCtx();
    await audioCtx.resume();

    // Visual bus
    if (visualFollow.checked) {
      seekAndPlay(mainVideo, start, dur, delay, /*mute*/ true);
    } else {
      // just line up the scrubber for reference (don’t play audio here)
      setTimeout(() => { mainVideo.currentTime = Math.max(0.01, start); }, delay*1000);
    }

    // Layered audio via hidden clones
    pruneClones();
    const allowed = Math.max(1, parseInt(document.getElementById('maxOverlap').value,10) || 4);
    if (liveClones.size >= allowed) {
      const first = liveClones.values().next().value;
      stopClone(first);
    }

    const v = document.createElement('video');
    v.src = videoURL;
    v.preload = 'auto';
    v.crossOrigin = 'anonymous';
    v.playsInline = true;
    v.controls = false;
    v.dataset.role = 'clip';

    cloneBin.appendChild(v);
    allMedia.add(v);
    liveClones.add(v);

    await attachClipToFX(v);

    // IMPORTANT: do NOT mute clones — pass mute=false
    seekAndPlay(v, start, dur, delay, /*mute*/ false, () => { stopClone(v); });
  }

  function pruneClones() {
    [...liveClones].forEach(v => {
      if (v.ended || (v.paused && v.currentTime === 0)) stopClone(v);
    });
  }
  function stopClone(v) {
    try { v.pause(); } catch {}
    try {
      if (v._srcNode) { v._srcNode.disconnect(); v._srcNode = null; }
    } catch {}
    v.removeAttribute('src'); v.load?.();
    allMedia.delete(v);
    liveClones.delete(v);
    v.remove();
  }

  function seekAndPlay(videoEl, start, dur, delaySec, mute, onDone) {
    const target = Math.min(Math.max(0.01, start), Math.max(0.01, (videoDuration||start)));
    videoEl.pause();

    // Mute only non-clip elements (visual player); keep clip elements unmuted but volume=0
    if (videoEl.dataset.role === 'clip') {
      videoEl.muted = false;
      videoEl.volume = 0;
    } else {
      videoEl.muted = !!mute;
    }

    const scheduleAt = performance.now() + (delaySec*1000);

    const playAt = () => {
      const armStop = () => {
        const stopAt = target + dur;
        const tick = () => {
          if (videoEl.currentTime >= stopAt - 0.005) {
            videoEl.pause();
            onDone && setTimeout(onDone, 200); // small grace for FX tails
          } else {
            requestAnimationFrame(tick);
          }
        };
        requestAnimationFrame(tick);
      };
      videoEl.addEventListener('playing', armStop, { once: true });
      videoEl.play().catch(()=>{ /* user-gesture/autoplay races are fine */ });
    };

    const startPlay = () => {
      const ms = Math.max(0, scheduleAt - performance.now());
      if (ms <= 4) playAt(); else setTimeout(playAt, ms);
    };

    if (isNaN(videoEl.duration) || videoEl.readyState < 2) {
      videoEl.addEventListener('loadedmetadata', () => {
        videoEl.currentTime = target;
        videoEl.addEventListener('seeked', startPlay, { once: true });
      }, { once: true });
      return;
    }
    videoEl.addEventListener('seeked', startPlay, { once: true });
    try { videoEl.currentTime = target; } catch { startPlay(); }
  }

  // --- Stop all (does NOT stop backing)
  stopAll.addEventListener('click', () => {
    [...liveClones].forEach(stopClone);
    mainVideo.pause();
  });

  // Apply initial volumes
  setMasterVolumeForMedia(parseFloat(masterVol.value));

  // --- Load Backing wiring (kept same)
  backFile.addEventListener('change', async () => {
    const f = backFile.files?.[0];
    if (!f) return;
    ensureAudioCtx();
    clearBacking();
    playBack.disabled = true;
    playBack.textContent = '…loading';

    try {
      const arrBuf = await f.arrayBuffer();
      backBuffer = await audioCtx.decodeAudioData(arrBuf);
      backingMode = 'buffer';
      backOffset = 0;
      playBack.disabled = false;
      playBack.textContent = '▶ Backing';
      return;
    } catch (e) {}

    try {
      backMediaURL = URL.createObjectURL(f);
      backMediaEl = f.type.startsWith('video/') ? document.createElement('video') : document.createElement('audio');
      backMediaEl.src = backMediaURL;
      backMediaEl.preload = 'auto';
      backMediaEl.crossOrigin = 'anonymous';
      backMediaEl.muted = true;
      backMediaEl.loop = true;
      backMediaEl.playsInline = true;
      backMediaEl.controls = false;
      backMediaNode = audioCtx.createMediaElementSource(backMediaEl);
      backMediaNode.connect(backGain);

      backMediaEl.addEventListener('canplay', () => {
        backingMode = 'media';
        playBack.disabled = false;
        playBack.textContent = '▶ Backing';
      }, { once: true });
      backMediaEl.addEventListener('loadedmetadata', () => {
        if (playBack.disabled) { playBack.disabled = false; playBack.textContent = '▶ Backing'; }
      }, { once: true });
    } catch (err) {
      console.error('Backing load failed:', err);
      playBack.disabled = true;
      playBack.textContent = 'Unsupported';
      backingMode = 'none';
    }
  });

})();
</script>
