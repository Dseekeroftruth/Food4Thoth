<script>
  const music = document.getElementById("music");
  const musicButton = document.getElementById("musicButton");

  musicButton.addEventListener("click", () => {
    if (music.paused) {
      music.play();
      musicButton.textContent = "Stop Music";
    } else {
      music.pause();
      music.currentTime = 0; // Reset to start
      musicButton.textContent = "Play Music";
    }
  });
</script>

  <script>
    // 1) List all the URLs for the 24 iframes.
    const iframeURLs = [
      "./index5.html",
      "./index6.html",
      "./index7.html",
      "./index8.html",
      "./index10.html"
    ];

    const iframeGrid = document.getElementById("iframeGrid");

    // 2) Recursive function that loads one iframe at a time.
    function loadIframesSequentially(index) {
      // If we've loaded all URLs, stop.
      if (index >= iframeURLs.length) {
        console.log("All iframes have finished loading.");
        return;
      }

      // Create a new iframe for this URL.
      const iframe = document.createElement("iframe");
      iframe.src = iframeURLs[index];

      // When this iframe finishes loading, trigger the next iframe to load.
      iframe.onload = function() {
        console.log(`Iframe ${index + 1} of ${iframeURLs.length} loaded.`);
        // Move on to the next iframe.
        loadIframesSequentially(index + 1);
      };

      // Add the iframe to the grid container.
      iframeGrid.appendChild(iframe);
    }

    // 3) Start loading from the first iframe.
    //    Each one will load after the previous finishes.
    loadIframesSequentially(0);
  </script>
