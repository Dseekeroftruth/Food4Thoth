/* --- Single-Active Iframe Cards --- */
.iframe-grid {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-columns: repeat(1, 1fr);
  gap: 20px;
  width: 100vw;
  margin: 40px auto;
  padding: 20px;
  margin-top: 100px;
  padding-left: 70px;
  padding-right: 70px;
}

.iframe-card {
  position: relative;
  height: 60vh;
  border: 10px solid purple;
  border-radius: 50px;
  background: rgba(10, 0, 25, 0.55);
  overflow: hidden;
  display: grid;
  place-items: center;
}

/* When live iframe is present */
.iframe-card.is-active {
  background: #000;
  box-shadow: 0 0 24px rgba(255, 0, 255, 0.35);
}

.iframe-card iframe {
  width: 100%;
  height: 100%;
  border: 0;
  display: block;
}

/* Poster state (before activation) */
.iframe-card .poster {
  width: 100%;
  height: 100%;
  display: grid;
  place-items: center;
  gap: 12px;
  background: radial-gradient(1200px 600px at 50% 50%, rgba(255,0,255,0.15), rgba(0,0,0,0.75));
  color: #00ffff;
  text-align: center;
  padding: 16px;
}

.iframe-card .label {
  font-size: clamp(18px, 2.4rem, 32px);
  font-weight: 700;
  text-shadow: 0 0 8px #ff00ff, 0 0 12px #00ffff;
}

/* Reuse your neon button vibe */

  <!-- Where the iframes will appear -->
  <div class="iframe-grid" id="iframeGrid"></div>

<script>
  // 🔮 Only ONE live iframe at a time
  const iframeURLs = [
    "./index.html",
    "./index2.html",
    "./index3.html",
    "./index4.html"
  ];

  const grid = document.getElementById("iframeGrid");
  let active = { card: null, iframe: null };

  // Helper to safely notify inner frame (if it listens)
  function postCmd(frame, cmd) {
    try { frame?.contentWindow?.postMessage({ cmd }, "*"); } catch (e) {}
  }

  function buildPosterHTML(label) {
    return `
      <div class="poster">
        <div class="label">${label}</div>
        <button class="activate-btn" type="button" aria-label="Activate ${label}">Activate</button>
      </div>
    `;
  }

  function deactivateActive() {
    if (!active.card) return;

    // Ask inner frame to pause first
    postCmd(active.iframe, "pause");

    // Hard-stop to recover memory on mobile/iOS
    try { active.iframe.src = "about:blank"; } catch (_) {}
    active.card.classList.remove("is-active");
    active.card.innerHTML = buildPosterHTML(active.card.dataset.label);

    active = { card: null, iframe: null };
  }

  function activateCard(card) {
    if (active.card === card) return; // already active

    // Turn off currently-live frame
    deactivateActive();

    // Build new live iframe in this card
    const url = card.dataset.url;
    const iframe = document.createElement("iframe");
    iframe.src = url;                 // load only on click
    iframe.loading = "eager";         // it's the only live one
    iframe.referrerPolicy = "no-referrer";
    iframe.setAttribute("allow", "autoplay; fullscreen");
    iframe.setAttribute("title", card.dataset.label);

    // Close control
    const close = document.createElement("button");
    close.className = "close-btn";
    close.type = "button";
    close.textContent = "×";
    close.title = "Deactivate";
    close.addEventListener("click", (e) => {
      e.stopPropagation();
      deactivateActive();
    });

    card.classList.add("is-active");
    card.innerHTML = "";
    card.appendChild(close);
    card.appendChild(iframe);

    active = { card, iframe };
  }

  // Build cards (posters) only; no iframes yet
  iframeURLs.forEach((url, i) => {
    const card = document.createElement("div");
    card.className = "iframe-card";
    card.dataset.url = url;
    // Always show "Reveal N" instead of file name
  card.dataset.label = "Reveal " + (i + 1);

 

    card.innerHTML = buildPosterHTML(card.dataset.label);

    // Activate on button click (not the whole card to avoid mis-taps)
    card.addEventListener("click", (e) => {
      const btn = e.target.closest(".activate-btn");
      if (!btn) return;
      activateCard(card);
    });

    grid.appendChild(card);
  });

  // If the page loses visibility, reclaim resources
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) deactivateActive();
  });

  // Allow ESC to deactivate
  window.addEventListener("keydown", (e) => {
    if (e.key === "Escape") deactivateActive();
  });

  //   else { try { bg.play(); } catch(_){} }
  // });

</script>
