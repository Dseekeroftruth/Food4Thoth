    <source src="../Mescalito/MescalinosAmazingStory.wav" type="audio/wav">
    Your browser does not support the audio element.
  </audio>

<script>
  const music = document.getElementById("music");
  const musicButton = document.getElementById("musicButton");

  musicButton.addEventListener("click", () => {
    if (music.paused) {
      music.play();
      musicButton.textContent = "Stop Music";
    } else {
      music.pause();
      music.currentTime = 0; // Reset to start
      musicButton.textContent = "Play Music";
    }
  });
</script>

  <!-- Grid Container for Cyberpunk Cards -->
<div class="cyberpunk-container" id="cyberpunkGrid"></div>

<script>
  // Array of image sources and corresponding index links
  const images = [
    "./images/1.webp", "./images/2.webp", "./images/3.webp",
    "./images/4.webp", "./images/a1.webp", "./images/a2.webp",
    "./images/a3.webp", "./images/a4.webp", "./images/a5.webp",
    "./images/a6.webp"
  ];

  // Select the container div
  const container = document.getElementById("cyberpunkGrid");

  // Loop through images and generate cards dynamically
  images.forEach((src, index) => {
    const card = document.createElement("div");
    card.classList.add("cyberpunk-card");

    const img = document.createElement("img");
    img.src = src;
    img.alt = `Index ${index + 1}`;
    img.classList.add("cyberpunk-image");

    const link = document.createElement("a");
    link.href = `./index${index + 1}.html`; // Generates ./index1.html, ./index2.html, etc.
    link.textContent = `Index ${index + 1}`;

    card.appendChild(img);
    card.appendChild(link);
    container.appendChild(card);
  });
</script>
