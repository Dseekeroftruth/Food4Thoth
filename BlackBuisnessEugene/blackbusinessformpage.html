<h4><strong>FOOD4THOTH</strong></h4>

<div class="form-container">
    <h2>Submit Your Business</h2>
    <form action="https://formspree.io/f/xdknravw" method="POST">
        <!-- Business Name -->
        <label for="businessName">Business Name:</label>
        <input type="text" id="businessName" name="businessName" placeholder="Enter your business name" required>

        <!-- Category -->
        <label for="category">Category:</label>
        <select id="category" name="category" required>
            <option value="" disabled selected>Select a category</option>
            <option value="Aesthetics">Aesthetics & Personal Care</option>
            <option value="Authors">Authors</option>
            <option value="Automotive">Automotive</option>
            <option value="Consultants">Consultants</option>
            <option value="Education">Education</option>
            <option value="Financial">Financial Services</option>
            <option value="Fitness">Fitness & Wellness</option>
            <option value="Food">Food & Beverage</option>
            <option value="Home">Home Improvement</option>
            <option value="Legal">Legal</option>
            <option value="Manufacturing">Manufacturing</option>
            <option value="Marketing">Marketing & Creative Arts</option>
            <option value="Medical">Medical & Mental Health</option>
            <option value="Real Estate">Real Estate/Brokerage</option>
            <option value="Nonprofits">Non-profits & Organizations</option>
            <option value="Retail">Retail</option>
            <option value="Vapors">Vapors/Cannabis</option>
            <option value="Other">Other</option>
        </select>

        <!-- Address -->
        <label for="address">Address:</label>
        <input type="text" id="address" name="address" placeholder="Enter your business address">

        <!-- Phone Number -->
        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone" placeholder="e.g., +1 234 567 890">

        <!-- Email -->
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="e.g., yourname@example.com">

        <!-- Website -->
        <label for="website">Website URL:</label>
        <input type="url" id="website" name="website" placeholder="e.g., https://example.com">

        <!-- Social Media -->
        <label for="socialMedia">Social Media Links (e.g., Instagram, Facebook):</label>
        <textarea id="socialMedia" name="socialMedia" placeholder="List social media links separated by commas"></textarea>

        <!-- Description -->
        <label for="description">Business Description:</label>
        <textarea id="description" name="description" rows="4" placeholder="Write a brief description of your business"></textarea>

        <!-- Contact Person -->
        <label for="contactPerson">Contact Person (Name and Title):</label>
        <input type="text" id="contactPerson" name="contactPerson" placeholder="e.g., John Doe, Manager">

        <!-- Additional Information -->
        <label for="additionalInfo">Additional Information:</label>
        <textarea id="additionalInfo" name="additionalInfo" rows="4" placeholder="Include any extra details you'd like to share"></textarea>

        <!-- Map URL -->
        <label for="mapUrl">Map URL (Google Maps link):</label>
        <input type="url" id="mapUrl" name="mapUrl" placeholder="Paste your Google Maps link here">

        <!-- Submit Button -->
        <button type="submit">Submit Business Information</button>
    </form>
