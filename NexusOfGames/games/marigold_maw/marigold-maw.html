<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#ff2d8a" />
  <title>MARIGOLD MAW · a luck-grid descent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Caudex:ital@0;1&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,700;1,9..144,400&family=Fredoka:wght@400;700&display=swap" rel="stylesheet">
  <style>
/* ═══════════════════════════════════════════════════════════════════════
   MARIGOLD MAW · stylesheet
   Yellow-Submarine palette x Mesoamerican folk-print
   ═══════════════════════════════════════════════════════════════════════ */

:root {
  /* The candy palette */
  --ink:        #1a0d2e;
  --deep:       #231942;
  --plum:       #5e2d79;
  --magenta:    #ff2d8a;
  --hotpink:    #ff6fb5;
  --tangerine:  #ff7a1a;
  --marigold:   #ffd23f;
  --sunbeam:    #fff066;
  --lime:       #a8e63c;
  --grass:      #4ab84d;
  --teal:       #00c2b3;
  --cyan:       #5fdfff;
  --periwinkle: #6973ff;
  --grape:      #b56dff;
  --bone:       #f8edd0;
  --parchment:  #f4e3b3;
  --blood:      #b8252b;
  --shadow:     #0d0518;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html {
  width: 100%;
  height: 100%;
}
body {
  width: 100%;
  min-height: 100vh;
  min-height: 100dvh;
  margin: 0;
  overflow: hidden;
  background: var(--shadow);
  color: var(--bone);
  font-family: 'Caudex', 'Fraunces', serif;
  -webkit-font-smoothing: antialiased;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
  touch-action: manipulation;
}

#root {
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  position: relative;
  overflow: hidden;
  background: var(--shadow);
}

button {
  font-family: inherit;
  cursor: pointer;
  background: none;
  border: none;
  color: inherit;
}
button:disabled { cursor: not-allowed; }

.noscript-msg {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
  background: var(--shadow); color: var(--marigold);
  font-family: 'Bowlby One', sans-serif; font-size: 24px;
  padding: 2rem; text-align: center;
}

.audio-prompt {
  position: fixed;
  bottom: max(12px, env(safe-area-inset-bottom));
  right: max(12px, env(safe-area-inset-right));
  background: var(--marigold); color: var(--ink);
  padding: 6px 12px; border: 2px solid var(--ink);
  border-radius: 20px; font-family: 'Fredoka', sans-serif;
  font-size: 12px; z-index: 9999; pointer-events: none;
  animation: pulse 1.4s ease-in-out infinite;
}
.audio-prompt.hidden { display: none; }

/* ═══════════════ KEYFRAMES — the dance of the marigold ═══════════════ */

@keyframes bob { 0%,100% { transform: translateY(0);} 50% { transform: translateY(-5px);} }
@keyframes bobBig { 0%,100% { transform: translateY(0) rotate(-1deg);} 50% { transform: translateY(-7px) rotate(1deg);} }
@keyframes bobSlow { 0%,100% { transform: translateY(0);} 50% { transform: translateY(-3px);} }

@keyframes flicker {
  0%,100% { opacity: 1; transform: scale(1);}
  25% { opacity: 0.85; transform: scale(0.95) rotate(-3deg);}
  50% { opacity: 1; transform: scale(1.08) rotate(2deg);}
  75% { opacity: 0.92; transform: scale(0.97);}
}

@keyframes wobble {
  0%,100% { transform: rotate(-2deg) translateX(0); }
  25% { transform: rotate(2deg) translateX(2px); }
  50% { transform: rotate(-1deg) translateX(-1px); }
  75% { transform: rotate(2deg) translateX(1px); }
}

/* The "silly" enemy state — exaggerated wobble dance */
@keyframes sillyDance {
  0%   { transform: rotate(-12deg) scale(0.75) translateY(0); }
  20%  { transform: rotate(12deg) scale(0.78) translateY(-3px); }
  40%  { transform: rotate(-8deg) scale(0.72) translateY(2px); }
  60%  { transform: rotate(15deg) scale(0.78) translateY(-2px); }
  80%  { transform: rotate(-15deg) scale(0.74) translateY(0); }
  100% { transform: rotate(-12deg) scale(0.75) translateY(0); }
}

/* The "looming" enemy state — slow ominous breathing */
@keyframes loom {
  0%,100% { transform: scale(1.15) translateY(0); filter: drop-shadow(0 0 12px rgba(255,45,138,0.5)); }
  50%     { transform: scale(1.25) translateY(-3px); filter: drop-shadow(0 0 24px rgba(255,45,138,0.85)); }
}

@keyframes shake {
  0%,100% { transform: translate(0); }
  10% { transform: translate(-4px, 2px); }
  20% { transform: translate(5px, -2px); }
  30% { transform: translate(-3px, 3px); }
  40% { transform: translate(4px, -3px); }
  50% { transform: translate(-5px, 1px); }
  60% { transform: translate(4px, 2px); }
  70% { transform: translate(-2px, -3px); }
  80% { transform: translate(3px, 3px); }
  90% { transform: translate(-2px, 1px); }
}

@keyframes lunge {
  0%,100% { transform: translateY(0) scale(1); }
  40%     { transform: translateY(-12px) scale(1.18) rotate(-5deg); }
  60%     { transform: translateY(-8px) scale(1.22) rotate(5deg); }
}

/* Death animations — deliberately weird */
@keyframes diePop {
  0%   { transform: scale(1); opacity: 1; }
  20%  { transform: scale(1.4); }
  35%  { transform: scale(0.4); }
  50%  { transform: scale(1.3) rotate(45deg); }
  100% { transform: scale(0) translateY(-100px) rotate(720deg); opacity: 0; }
}
@keyframes diePetals {
  0%   { transform: scale(1); opacity: 1; filter: hue-rotate(0); }
  100% { transform: scale(2.5); opacity: 0; filter: hue-rotate(360deg) blur(8px); }
}
@keyframes dieDeflate {
  0%   { transform: scale(1,1); }
  20%  { transform: scale(1.1,0.95); }
  40%  { transform: scale(0.85,1.15); }
  60%  { transform: scale(1.05,0.7); }
  80%  { transform: scale(0.7,0.5); }
  100% { transform: scale(0,0); opacity: 0; }
}
@keyframes dieSwirl {
  0%   { transform: rotate(0) scale(1); opacity: 1; }
  100% { transform: rotate(1080deg) scale(0.05) translateY(150px); opacity: 0; }
}
@keyframes dieMonster {
  0%   { transform: scale(1) rotate(0); opacity: 1; }
  30%  { transform: scale(1.3) rotate(20deg); }
  60%  { transform: scale(0.9) rotate(-30deg); opacity: 0.6; }
  100% { transform: scale(0.2) translateY(80px) rotate(180deg); opacity: 0; }
}

@keyframes rise {
  0%   { transform: translateY(0) rotate(0); opacity: 0; }
  10%  { opacity: 0.9; }
  90%  { opacity: 0.9; }
  100% { transform: translateY(-800px) rotate(360deg); opacity: 0; }
}
@keyframes float {
  0%,100% { transform: translateY(0) translateX(0); }
  33%     { transform: translateY(-12px) translateX(8px); }
  66%     { transform: translateY(-4px) translateX(-10px); }
}

@keyframes rowPulse {
  0%,100% { box-shadow: inset 0 0 0 0 var(--marigold); }
  50%     { box-shadow: inset 0 0 22px 2px rgba(255,210,63,0.7); }
}

@keyframes doorGlow {
  0%,100% { box-shadow: 0 0 12px var(--marigold), 4px 4px 0 var(--ink); transform: scale(1); }
  50%     { box-shadow: 0 0 36px var(--marigold), 4px 4px 0 var(--ink); transform: scale(1.04); }
}

@keyframes sparkGlow {
  0%,100% { box-shadow: inset 0 0 0 0 transparent, 0 0 0 0 var(--marigold); }
  50%     { box-shadow: inset 0 0 18px var(--sunbeam), 0 0 20px var(--marigold); }
}

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes fadeDown {
  from { opacity: 0; transform: translateY(-20px); }
  to   { opacity: 1; transform: translateY(0); }
}

@keyframes land {
  0%   { transform: translate(-50%, -60px) scale(0.6); opacity: 0; }
  60%  { transform: translate(-50%, -22px) scale(1.1); opacity: 1; }
  100% { transform: translate(-50%, -16px) scale(1); opacity: 1; }
}

@keyframes spin { from { transform: rotate(0); } to { transform: rotate(360deg); } }
@keyframes spinSlow { from { transform: rotate(0); } to { transform: rotate(360deg); } }
@keyframes spinFast { from { transform: rotate(0); } to { transform: rotate(720deg); } }

@keyframes pulse {
  0%,100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.06); opacity: 0.92; }
}

@keyframes hueCycle {
  0%   { filter: hue-rotate(0deg); }
  100% { filter: hue-rotate(360deg); }
}

@keyframes kaleidoSpin { from { transform: rotate(0); } to { transform: rotate(360deg); } }

@keyframes strikeShake {
  0%,100% { transform: scale(1); }
  40% { transform: scale(1.18) translateX(-12px); }
  50% { transform: scale(1.18) translateX(12px); }
}

@keyframes flashRed {
  0%,100% { background: transparent; }
  50% { background: rgba(255, 45, 60, 0.4); }
}

@keyframes shimmer {
  0% { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}

@keyframes bounce {
  0%,100% { transform: translateY(0); }
  30% { transform: translateY(-12px); }
  60% { transform: translateY(0); }
  70% { transform: translateY(-4px); }
}

@keyframes drumRoll {
  0%,100% { transform: rotate(0); }
  20% { transform: rotate(-3deg); }
  40% { transform: rotate(4deg); }
  60% { transform: rotate(-3deg); }
  80% { transform: rotate(2deg); }
}

@keyframes bigZoom {
  0% { transform: scale(0); opacity: 0; }
  60% { transform: scale(1.2); opacity: 1; }
  100% { transform: scale(1); opacity: 1; }
}

@keyframes shineEdge {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(200%); }
}

@keyframes sproutHearts {
  0% { transform: scale(0) translateY(0); opacity: 0; }
  60% { transform: scale(1.2) translateY(-30px); opacity: 1; }
  100% { transform: scale(0.8) translateY(-60px); opacity: 0; }
}

/* ════════════════════ Animation utility classes ═════════════════════ */
.anim-bob       { animation: bob 2.4s ease-in-out infinite; }
.anim-bob-big   { animation: bobBig 2.6s ease-in-out infinite; }
.anim-bob-slow  { animation: bobSlow 3s ease-in-out infinite; }
.anim-flicker   { animation: flicker 0.6s ease-in-out infinite; transform-origin: center; }
.anim-wobble    { animation: wobble 1.6s ease-in-out infinite; }
.anim-silly     { animation: sillyDance 0.7s ease-in-out infinite; transform-origin: center; }
.anim-loom      { animation: loom 2.2s ease-in-out infinite; transform-origin: center bottom; }
.anim-shake     { animation: shake 0.5s; }
.anim-lunge     { animation: lunge 0.45s; }
.anim-die-pop      { animation: diePop 1.2s forwards; }
.anim-die-petals   { animation: diePetals 1.4s forwards; }
.anim-die-deflate  { animation: dieDeflate 1.0s forwards; }
.anim-die-swirl    { animation: dieSwirl 1.4s forwards; }
.anim-die-monster  { animation: dieMonster 0.9s forwards; }
.anim-rise         { animation: rise linear infinite; }
.anim-float        { animation: float 5s ease-in-out infinite; }
.anim-row-pulse    { animation: rowPulse 1.4s ease-in-out infinite; }
.anim-door-glow    { animation: doorGlow 1.6s ease-in-out infinite; }
.anim-spark-glow   { animation: sparkGlow 1.2s ease-in-out infinite; }
.anim-fade-in      { animation: fadeIn 0.6s ease-out; }
.anim-fade-up      { animation: fadeUp 0.7s ease-out both; }
.anim-fade-down    { animation: fadeDown 0.7s ease-out both; }
.anim-land         { animation: land 0.5s ease-out forwards; }
.anim-spin         { animation: spin 4s linear infinite; }
.anim-spin-slow    { animation: spinSlow 30s linear infinite; }
.anim-spin-fast    { animation: spinFast 0.8s linear infinite; }
.anim-pulse        { animation: pulse 1.4s ease-in-out infinite; }
.anim-hue          { animation: hueCycle 12s linear infinite; }
.anim-kaleido      { animation: kaleidoSpin 60s linear infinite; }
.anim-strike-shake { animation: strikeShake 0.5s; }
.anim-flash-red    { animation: flashRed 0.4s; }
.anim-shimmer      { animation: shimmer 3s linear infinite; }
.anim-bounce       { animation: bounce 1.6s ease-in-out infinite; }
.anim-drum         { animation: drumRoll 0.5s ease-in-out infinite; }
.anim-zoom-in      { animation: bigZoom 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }

/* ════════════════════ Background wallpapers ════════════════════ */

.bg-marigold-rays {
  background:
    radial-gradient(circle at 50% 50%, var(--marigold) 0%, transparent 30%),
    conic-gradient(from 0deg at 50% 50%,
      var(--magenta) 0deg, var(--tangerine) 30deg,
      var(--marigold) 60deg, var(--lime) 90deg,
      var(--teal) 120deg, var(--cyan) 150deg,
      var(--periwinkle) 180deg, var(--grape) 210deg,
      var(--magenta) 240deg, var(--hotpink) 270deg,
      var(--marigold) 300deg, var(--tangerine) 330deg,
      var(--magenta) 360deg);
}

.bg-floor-1 {
  background:
    radial-gradient(ellipse at 30% 20%, rgba(255, 210, 63, 0.16) 0%, transparent 50%),
    radial-gradient(ellipse at 70% 80%, rgba(255, 45, 138, 0.16) 0%, transparent 50%),
    linear-gradient(160deg, #2a1140 0%, #4a1660 60%, #1a0728 100%);
}
.bg-floor-2 {
  background:
    radial-gradient(ellipse at 50% 30%, rgba(95, 223, 255, 0.18) 0%, transparent 55%),
    radial-gradient(ellipse at 20% 80%, rgba(0, 194, 179, 0.16) 0%, transparent 55%),
    linear-gradient(180deg, #0a1a3a 0%, #053056 60%, #021024 100%);
}
.bg-floor-3 {
  background:
    radial-gradient(ellipse at 50% 40%, rgba(255, 122, 26, 0.22) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 70%, rgba(255, 45, 138, 0.18) 0%, transparent 50%),
    linear-gradient(180deg, #3a0a1c 0%, #6a1820 60%, #200810 100%);
}
.bg-floor-4 {
  background:
    radial-gradient(ellipse at 50% 30%, rgba(181, 109, 255, 0.28) 0%, transparent 55%),
    radial-gradient(ellipse at 50% 90%, rgba(255, 240, 102, 0.16) 0%, transparent 60%),
    linear-gradient(180deg, #1d0524 0%, #100020 60%, #050010 100%);
}

.kaleido-overlay {
  position: absolute;
  top: -25%; left: -25%; right: -25%; bottom: -25%;
  width: 150%; height: 150%;
  pointer-events: none;
  opacity: 0.14;
  mix-blend-mode: screen;
  background:
    repeating-conic-gradient(
      from 0deg at 50% 50%,
      var(--magenta) 0deg 8deg,
      transparent 8deg 24deg,
      var(--marigold) 24deg 32deg,
      transparent 32deg 48deg,
      var(--cyan) 48deg 56deg,
      transparent 56deg 72deg);
}

/* ════════════════════ Component styles ════════════════════ */

.tile-button {
  width: 64px; height: 64px;
  border: 2px solid var(--ink);
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  position: relative;
  transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
  background: rgba(20, 8, 40, 0.5);
}
.tile-button:hover:not(:disabled) { transform: scale(1.04); }
.tile-button.visited { opacity: 0.4; cursor: default; }
.tile-button.row-hover {
  border-color: var(--marigold);
  outline: 3px solid rgba(255, 210, 63, 0.4);
  z-index: 2;
}
.tile-button.spark-eligible {
  border-color: var(--sunbeam);
}

@media (max-width: 480px) {
  .tile-button { width: 58px; height: 58px; }
  .grid-container { padding: 6px; gap: 5px; }
  .hud-bar { padding: 6px 8px; gap: 8px; font-size: 12px; }
  .inv-bar { padding: 4px 6px; gap: 4px; }
}
@media (max-width: 380px) {
  .tile-button { width: 50px; height: 50px; }
  .grid-container { padding: 5px; gap: 4px; }
}
@media (max-height: 700px) {
  .tile-button { width: 54px; height: 54px; }
  .grid-container { padding: 5px; gap: 5px; }
}
@media (max-height: 600px) {
  .tile-button { width: 46px; height: 46px; }
  .grid-container { padding: 4px; gap: 4px; }
}
/* Tablet: bigger, more touchable tiles */
@media (min-width: 700px) and (min-height: 700px) {
  .tile-button { width: 84px; height: 84px; }
  .grid-container { padding: 12px; gap: 10px; }
  .hud-bar { font-size: 16px; padding: 10px 16px; gap: 14px; }
  .inv-bar { padding: 8px 12px; gap: 8px; min-height: 48px; }
  .inv-slot { padding: 5px; }
}
@media (min-width: 1000px) and (min-height: 800px) {
  .tile-button { width: 96px; height: 96px; }
  .grid-container { padding: 14px; gap: 12px; }
}

.btn-primary {
  font-family: 'Bowlby One', sans-serif;
  background: var(--marigold);
  color: var(--ink);
  padding: 12px 24px;
  border: 3px solid var(--ink);
  border-radius: 8px;
  font-size: 18px;
  letter-spacing: 0.06em;
  box-shadow: 5px 5px 0 var(--ink);
  transition: transform 0.15s, box-shadow 0.15s;
}
.btn-primary:hover:not(:disabled) {
  transform: translate(-2px, -2px);
  box-shadow: 7px 7px 0 var(--ink);
}
.btn-primary:active:not(:disabled) {
  transform: translate(3px, 3px);
  box-shadow: 2px 2px 0 var(--ink);
}
.btn-primary:disabled { opacity: 0.5; }

.btn-secondary {
  font-family: 'Bowlby One', sans-serif;
  background: transparent;
  color: var(--bone);
  padding: 8px 18px;
  border: 2px solid var(--bone);
  border-radius: 6px;
  font-size: 14px;
  letter-spacing: 0.08em;
  transition: transform 0.15s;
}
.btn-secondary:hover:not(:disabled) {
  transform: scale(1.05);
  background: rgba(248, 237, 208, 0.1);
}

.btn-pink {
  font-family: 'Bowlby One', sans-serif;
  background: var(--magenta);
  color: var(--bone);
  padding: 10px 18px;
  border: 3px solid var(--ink);
  border-radius: 8px;
  font-size: 16px;
  letter-spacing: 0.04em;
  box-shadow: 4px 4px 0 var(--ink);
  transition: transform 0.15s, box-shadow 0.15s;
}
.btn-pink:hover:not(:disabled) {
  transform: translate(-2px, -2px);
  box-shadow: 6px 6px 0 var(--ink);
}

.btn-cyan {
  font-family: 'Bowlby One', sans-serif;
  background: var(--cyan);
  color: var(--ink);
  padding: 10px 18px;
  border: 3px solid var(--ink);
  border-radius: 8px;
  font-size: 16px;
  box-shadow: 4px 4px 0 var(--ink);
}

.title-text {
  font-family: 'Bowlby One', sans-serif;
  letter-spacing: 0.04em;
  line-height: 0.9;
}

.serif {
  font-family: 'Fraunces', 'Caudex', serif;
}

.script {
  font-family: 'Caudex', serif;
  font-style: italic;
}

.heart {
  display: inline-block;
}

/* HUD bar */
.hud-bar {
  flex: 0 0 auto;
  position: relative;
  background: rgba(13, 5, 24, 0.92);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  border-bottom: 2px solid var(--ink);
  padding: 8px 10px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  font-family: 'Bowlby One', sans-serif;
  font-size: 13px;
  z-index: 10;
  row-gap: 4px;
}

.inv-bar {
  flex: 0 0 auto;
  position: relative;
  background: rgba(13, 5, 24, 0.85);
  border-top: 1px solid var(--ink);
  padding: 6px 10px;
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  z-index: 10;
  min-height: 38px;
}

.inv-slot {
  background: var(--parchment);
  border: 2px solid var(--ink);
  border-radius: 4px;
  padding: 3px;
  transition: transform 0.15s;
}
.inv-slot:hover:not(:disabled) { transform: scale(1.12); }
.inv-slot.charm { background: var(--plum); }

/* Grid container */
.grid-container {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  padding: 10px;
  background: rgba(10, 5, 25, 0.6);
  border: 3px solid var(--ink);
  border-radius: 10px;
  box-shadow: 0 8px 0 var(--ink), 0 0 50px rgba(255, 210, 63, 0.2);
  backdrop-filter: blur(2px);
}

/* Modal/overlay */
.full-overlay {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding:
    max(20px, env(safe-area-inset-top))
    max(16px, env(safe-area-inset-right))
    max(20px, env(safe-area-inset-bottom))
    max(16px, env(safe-area-inset-left));
  z-index: 50;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

/* Inner wrapper for menu screens — adapts from phone to tablet */
.menu-inner {
  width: 100%;
  max-width: 480px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* On tablet-sized screens (iPad), allow more room */
@media (min-width: 700px) {
  .menu-inner { max-width: 600px; }
}
@media (min-width: 1000px) {
  .menu-inner { max-width: 720px; }
}

/* Dungeon layout: top HUD, flexible center (with grid), bottom inventory */
.dungeon-frame {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;

const C = {
  ink:'#1a0d2e', deep:'#231942', plum:'#5e2d79',

// PERSISTENT STORAGE — surface bank, unlocks. Falls back to memory.
// ───────────────────────────────────────────────────────────────────────
const STORAGE_KEY = 'marigold-maw-save-v1';
const initialSave = {

  perks: { startStr: 0, startMag: 0, startMaxHp: 0, startItems: [] },

// ───────────────────────────────────────────────────────────────────────
// AUDIO — synthesised SFX + ambient pad + occasional voice line.
// ───────────────────────────────────────────────────────────────────────
const Audio = (() => {
  let ctx = null;
  let masterGain = null;
  let unlocked = false;
  let muted = false;
  let ambientNodes = null;

  function ensure() {
    if (ctx) return ctx;
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = ctx.createGain();
    masterGain.gain.value = 0.55;
    masterGain.connect(ctx.destination);
    return ctx;
  }
  function unlock() {
    if (unlocked) return;
    ensure();
    if (ctx.state === 'suspended') ctx.resume();
    unlocked = true;
    document.getElementById('audio-prompt')?.classList.add('hidden');
  }
  function setMuted(m) {
    muted = m;
    if (masterGain) masterGain.gain.value = m ? 0 : 0.55;
  }
  function isMuted() { return muted; }

  // Helper: schedule a quick envelope on a gain
  function envelope(gain, attack, peak, decay, sustain, sustainTime, release, t0) {
    const t = t0 ?? ctx.currentTime;
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(peak, t + attack);
    gain.gain.linearRampToValueAtTime(sustain, t + attack + decay);
    gain.gain.linearRampToValueAtTime(0, t + attack + decay + sustainTime + release);
  }

  function blip(freq=440, dur=0.12, type='sine', vol=0.3) {
    if (!unlocked || muted) return;
    const t = ctx.currentTime;
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g).connect(masterGain);
    osc.start(t); osc.stop(t + dur + 0.05);
  }

  function chord(freqs, dur=0.4, type='triangle', vol=0.18) {
    freqs.forEach(f => blip(f, dur, type, vol));
  }

  function whoosh(dur=0.5, lowF=200, highF=2000) {
    if (!unlocked || muted) return;
    const t = ctx.currentTime;
    const noise = ctx.createBufferSource();
    const buf = ctx.createBuffer(1, ctx.sampleRate * dur, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i=0;i<data.length;i++) data[i] = (Math.random()*2-1) * (1 - i/data.length);
    noise.buffer = buf;
    const filter = ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.setValueAtTime(highF, t);
    filter.frequency.exponentialRampToValueAtTime(lowF, t + dur);
    filter.Q.value = 4;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.18, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    noise.connect(filter).connect(g).connect(masterGain);
    noise.start(t); noise.stop(t + dur);
  }

  function wahWah() {
    // Sad trombone
    if (!unlocked || muted) return;
    const t0 = ctx.currentTime;
    [{f:392,d:0.18},{f:330,d:0.18},{f:294,d:0.18},{f:220,d:0.5}].forEach((n,i) => {
      const t = t0 + i*0.18;
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type='sawtooth'; osc.frequency.value = n.f;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.18, t+0.02);
      g.gain.exponentialRampToValueAtTime(0.001, t + n.d);
      osc.connect(g).connect(masterGain);
      osc.start(t); osc.stop(t + n.d + 0.05);
    });
  }

  function fanfare() {
    if (!unlocked || muted) return;
    const notes = [261.6, 329.6, 392, 523.25, 659.25, 783.99];
    notes.forEach((f, i) => setTimeout(() => blip(f, 0.4, 'triangle', 0.22), i*120));
    setTimeout(() => chord([523.25, 659.25, 783.99], 1.2, 'triangle', 0.18), 800);
  }

  function startAmbient() {
    if (!unlocked || muted || ambientNodes) return;
    const t = ctx.currentTime;
    const oscs = [];
    const gains = [];
    // Drone in a minor chord
    [110, 130.8, 164.8, 220].forEach(f => {
      const osc = ctx.createOscillator();
      osc.type = 'sine';
      osc.frequency.value = f;
      const g = ctx.createGain();
      g.gain.value = 0.04 + Math.random() * 0.02;
      // Slow tremolo via LFO
      const lfo = ctx.createOscillator();
      lfo.frequency.value = 0.1 + Math.random() * 0.2;
      const lfoGain = ctx.createGain();
      lfoGain.gain.value = 0.02;
      lfo.connect(lfoGain).connect(g.gain);
      lfo.start();
      osc.connect(g).connect(masterGain);
      osc.start();
      oscs.push(osc); gains.push(g); oscs.push(lfo);
    });
    ambientNodes = { oscs, gains };
  }
  function stopAmbient() {
    if (!ambientNodes) return;
    const t = ctx.currentTime;
    ambientNodes.gains.forEach(g => g.gain.linearRampToValueAtTime(0, t + 0.5));
    setTimeout(() => {
      ambientNodes?.oscs.forEach(o => { try { o.stop(); } catch(e){} });
      ambientNodes = null;
    }, 600);
  }

  // Voice-over via SpeechSynthesis — deliberately weird intonation
  function speak(text, opts={}) {
    if (muted) return;
    if (!('speechSynthesis' in window)) return;
    try {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.rate = opts.rate ?? (0.7 + Math.random() * 0.4);
      u.pitch = opts.pitch ?? (0.4 + Math.random() * 1.4);
      u.volume = opts.volume ?? 0.85;
      // Try a quirky voice
      const voices = window.speechSynthesis.getVoices();
      if (voices.length) {
        const preferred = voices.find(v => /Google.*UK|Daniel|Karen|Samantha|Fred|Albert|Whisper|Cellos|Bahh|Trinoids|Zarvox|Bubbles/i.test(v.name));
        if (preferred) u.voice = preferred;
        else u.voice = voices[Math.floor(Math.random() * voices.length)];
      }
      window.speechSynthesis.speak(u);
    } catch (e) {}
  }
  function shutUp() {
    try { window.speechSynthesis?.cancel(); } catch(e){}
  }

  return {
    unlock, setMuted, isMuted, blip, chord, whoosh, wahWah, fanfare,
    startAmbient, stopAmbient, speak, shutUp,
  };
})();

const BASE_W = { monster: 1.0, chest: 1.0, ember: 0.85, trap: 0.95 };
//                                        ^ 'ember' is the strawberry tile in this game

function makeGrid(floorData, charmIds, statueMod) {
  // Boss floor: special arrangement
  if (floorData.isBoss) {
    const tiles = Array.from({ length: 16 }, (_, i) => {
      // distribute embers/chests/traps with the king centred
      const t = (i === 5) ? { type:'monster', enemy:'hollow_sun' }
              : (i === 6 || i === 9) ? { type:'ember' }
              : (i === 4 || i === 11) ? { type:'chest' }
              : (i % 3 === 0) ? { type:'ember' }
              : (i % 5 === 0) ? { type:'chest' }
              : { type:'trap' };
      return { id:i, ...t, visited:false };
    });
    return tiles;
  }
  const w = { ...BASE_W };
  charmIds.forEach(id => {
    const c = CHARMS[id];
    if (c?.weight) for (const k in c.weight) w[k] = (w[k] || 1) * c.weight[k];
  });
  if (statueMod) for (const k in statueMod) w[k] = (w[k] || 1) * statueMod[k];

  const types = Object.keys(w);
  const total = Object.values(w).reduce((a,b)=>a+b,0);
  let tiles = Array.from({ length: 16 }, (_, i) => {
    let r = Math.random() * total, pick = types[0];
    for (const t of types) { r -= w[t]; if (r <= 0) { pick = t; break; } }
    let enemy = null;
    if (pick === 'monster') enemy = floorData.enemies[Math.floor(Math.random() * floorData.enemies.length)];
    return { id:i, type: pick, enemy, visited:false };
  });

  // Guarantee at least 2 chests and 1 strawberry per floor
  const guarantee = (type, count) => {
    let have = tiles.filter(t => t.type === type).length;
    let attempts = 0;
    while (have < count && attempts < 30) {
      const idx = Math.floor(Math.random() * 16);
      if (tiles[idx].type !== type && tiles[idx].type !== 'ember' && tiles[idx].type !== 'chest') {
        tiles[idx] = { ...tiles[idx], type, enemy: null };
        have++;
      }
      attempts++;
    }
  };
  guarantee('chest', 2);
  guarantee('ember', 1);

  // Marigold Petal charm: replace 1 trap with strawberry
  if (charmIds.includes('petal')) {
    const trapIdx = tiles.findIndex(t => t.type === 'trap');
    if (trapIdx !== -1) tiles[trapIdx] = { ...tiles[trapIdx], type: 'ember' };
  }

  return tiles;
}

function rowProbabilities(tiles, rowIdx) {
  const row = [0,1,2,3].map(c => tiles[rowIdx*4 + c]);
  const unvisited = row.filter(t => !t.visited);
  if (unvisited.length === 0) return [0,0,0,0];
  const p = 1 / unvisited.length;
  return row.map(t => t.visited ? 0 : p);
}
function rollRow(tiles, rowIdx) {
  const probs = rowProbabilities(tiles, rowIdx);
  const total = probs.reduce((a,b)=>a+b,0);
  if (total === 0) return null;
  let r = Math.random() * total;
  for (let c = 0; c < 4; c++) { r -= probs[c]; if (r <= 0) return rowIdx*4 + c; }
  return rowIdx*4 + 3;
}

// Determine if an enemy is "looming" (will hurt you) or "silly" (you outclass it)
function enemyState(enemyId, player) {
  const e = ENEMIES[enemyId];
  if (!e) return 'normal';
  const stat = e.attack === 'str' ? player.str : player.mag;
  return stat >= e.dmg ? 'silly' : 'looming';
}

function TileGlyph({ tile, player }) {
  if (tile.visited) return <VisitedGlyph />;
  if (tile.type === 'ember') return <StrawberryGlyph />;
  if (tile.type === 'chest') return <ChestGlyph />;
  if (tile.type === 'trap')  return <TrapGlyph />;
  if (tile.type === 'monster') {
    const state = enemyState(tile.enemy, player);
    return <MonsterGlyph enemy={tile.enemy} state={state} />;
  }
  return null;
}

function FloatingThings({ count=10, kind='petals' }) {
  const things = useMemo(() => Array.from({ length: count }, (_, i) => ({
    id: i,
    left: (i * 17 + 5) % 100,
    delay: (i * 0.7) % 8,
    duration: 9 + (i % 6),
    size: 8 + (i % 4) * 4,
    color: [C.marigold, C.magenta, C.cyan, C.lime, C.hotpink][i % 5],
  })), [count, kind]);
  return (
    <div style={{ position:'absolute', inset:0, overflow:'hidden', pointerEvents:'none' }}>
      {things.map(t => (
        <div key={t.id} className="anim-rise"
             style={{
               position: 'absolute',
               left: `${t.left}%`,
               bottom: '-40px',
               willChange: 'transform',
               animationDelay: `${t.delay}s`,
               animationDuration: `${t.duration}s`,
             }}>
          {kind === 'petals' && (
            <svg width={t.size} height={t.size} viewBox="0 0 20 20" style={{display:'block'}}>
              <ellipse cx="10" cy="10" rx="4" ry="9" fill={t.color} stroke={C.ink} strokeWidth="1.2" />
            </svg>
          )}
          {kind === 'eyes' && (
            <svg width={t.size+4} height={t.size+4} viewBox="0 0 20 20" style={{display:'block'}}>

function HubScreen({ save, onUpdateSave, onBack }) {
  const buyChar = (id) => {
    const ch = CHARACTERS[id];
    if (save.surfaceGold < ch.cost || save.unlockedChars.includes(id)) return;
    SFX.coin();
    onUpdateSave({ ...save, surfaceGold: save.surfaceGold - ch.cost,
                   unlockedChars: [...save.unlockedChars, id] });
  };
  const buyPerm = (perm) => {
    const owned = save.perks[perm.key] || 0;
    if (owned >= perm.max || save.surfaceGold < perm.cost) return;
    SFX.coin();
    onUpdateSave({ ...save, surfaceGold: save.surfaceGold - perm.cost,
                   perks: { ...save.perks, [perm.key]: owned + 1 } });
  };
  return (
    <div className="full-overlay" style={{ position: 'relative' }}>

      <div style={{ position:'relative', zIndex:10, width:'100%', maxWidth: 520 }} className="anim-fade-up">

          </div>

            Coins you sent up in the bucket. Spend them on permanent gifts before you go down again.
          </div>

          <div style={{ fontFamily:"'Bowlby One',sans-serif", fontSize: 13, marginBottom: 6, color: C.plum }}>
            ⸻ NEW DESCENDERS ⸻
          </div>
          <div style={{ display:'flex', gap: 8, flexWrap:'wrap', marginBottom: 14 }}>
            {Object.values(CHARACTERS).map(ch => {
              const owned = save.unlockedChars.includes(ch.id);

                    {ch.sun.name}: {ch.sun.desc}

                  {owned ? (
                    <div style={{ fontFamily:"'Bowlby One',sans-serif", fontSize: 12, color: C.grass, marginTop: 4 }}>✓ OPEN</div>
                  ) : (
                    <button onClick={() => buyChar(ch.id)} disabled={save.surfaceGold < ch.cost}
                            className="btn-pink" style={{ fontSize: 12, padding: '4px 10px', marginTop: 4, width: '100%' }}>
                      open · {ch.cost}g
                    </button>

          </div>

function DungeonScreen({
  floorIdx, tiles, visited, player, charms, character,
  hoveredRow, setHoveredRow, onPickRow, animation,
  message, doorOpen, onEnterDoor, onUseItem, pendingTileId,
  sparkMode, setSparkMode, onSparkPick,
  selectingRow, onSelectRow, onCancel,
}) {
  const f = FLOORS[floorIdx];
  const probs = (hoveredRow !== null && !sparkMode && !selectingRow) ? rowProbabilities(tiles, hoveredRow) : null;
  const ch = CHARACTERS[character.id];
  const PlayerArtComp = PLAYER_ART[character.id];
  return (
    <div className="dungeon-frame">
      <PsychBackground floorClass={f.bgClass} kind="petals" />

      {/* Top: HUD */}
      <HUD player={player} floor={f} character={ch} />

      {/* Middle: status text + grid + actions */}
      <div className="dungeon-center">
        <div className="serif" style={{
          color: C.bone, fontSize: 13, fontStyle:'italic', textAlign:'center',
          marginBottom: 6, minHeight: 18, padding: '0 12px',
          textShadow: `1px 1px 0 ${C.ink}`, position: 'relative', zIndex: 2,
        }}>
          {sparkMode ? `☀ ${ch.sun.name}: ${ch.sun.desc}`
            : selectingRow ? "⚡ pick a row to wipe"
            : message || (f.isBoss
                ? "the Hollow Sun waits at the centre. find it."
                : doorOpen
                  ? "the door is open. step through."
                  : `clear ${f.required - visited} more`)}
        </div>

        <div className={`grid-container ${animation === 'shake' ? 'anim-shake' : ''}`}
             style={{ position: 'relative', zIndex: 2 }}>
          {tiles.map((t, idx) => {
            const row = Math.floor(idx / 4);
            const col = idx % 4;
            const isHoveredRow = hoveredRow === row && !sparkMode && !selectingRow;
            const prob = isHoveredRow ? probs[col] : null;
            const isPlayerHere = pendingTileId === idx;
            return (
              <button key={idx}
                      disabled={t.visited && !sparkMode}
                      onMouseEnter={() => !sparkMode && !selectingRow && setHoveredRow(row)}
                      onMouseLeave={() => setHoveredRow(null)}
                      onClick={() => {
                        if (selectingRow) onSelectRow(row);
                        else if (sparkMode) onSparkPick(idx);
                        else onPickRow(row);
                      }}
                      className={`tile-button
                        ${t.visited && !sparkMode ? 'visited' : ''}
                        ${isHoveredRow ? 'row-hover anim-row-pulse' : ''}
                        ${sparkMode && !t.visited ? 'spark-eligible anim-spark-glow' : ''}`}
                      style={{
                        background: t.visited ? 'rgba(13,5,24,0.5)' :
                          t.type === 'ember' ? `${C.hotpink}33` :
                          t.type === 'chest' ? `${C.tangerine}33` :
                          t.type === 'trap' ? `${C.magenta}33` :
                          t.type === 'monster' ? `${ENEMIES[t.enemy]?.color || C.deep}40` :
                          'rgba(20,8,40,0.5)',
                      }}>
                <TileGlyph tile={t} player={player} />
                {prob !== null && prob > 0 && (
                  <div style={{
                    position: 'absolute', top: -2, right: -2,
                    background: C.marigold, color: C.ink,
                    fontFamily:"'Bowlby One',sans-serif", fontSize: 10,
                    border: `1.5px solid ${C.ink}`, borderRadius: 4,
                    padding: '1px 4px', lineHeight: 1.2, zIndex: 3,
                  }}>{Math.round(prob*100)}%</div>
                )}
                {isPlayerHere && (
                  <div style={{ position:'absolute', top: -10, left: '50%', zIndex: 10 }}
                       className="anim-land">
                    <PlayerArtComp size={42} idle={false} />
                  </div>
                )}
              </button>
            );
          })}
        </div>

        <div style={{ marginTop: 10, display: 'flex', gap: 8, flexWrap: 'wrap',
                      justifyContent: 'center', position: 'relative', zIndex: 2 }}>
          <button disabled={!doorOpen} onClick={() => { SFX.door(); onEnterDoor(); }}
                  className={doorOpen ? 'btn-primary anim-door-glow' : 'btn-primary'}
                  style={!doorOpen ? { opacity: 0.4, padding: '8px 16px', fontSize: 14 } : { padding: '8px 16px', fontSize: 14 }}>
            {doorOpen ? '↓ DOWN ↓' : 'sealed'}
          </button>

          {player.sun >= 3 && !sparkMode && !selectingRow && (
            <button onClick={() => { SFX.spark(); pickVoice('spark'); setSparkMode(true); }}
                    className="btn-pink anim-pulse"
                    style={{ padding: '8px 14px', fontSize: 13 }}>
              ☀ {ch.sun.name}
            </button>
          )}
          {(sparkMode || selectingRow) && (
            <button onClick={() => { onCancel(); }} className="btn-secondary"
                    style={{ padding: '8px 14px', fontSize: 13 }}>cancel</button>
          )}
        </div>
      </div>

      {/* Bottom: Inventory */}
      <InventoryBar player={player} charms={charms} onUseItem={onUseItem} />
    </div>
  );
}

// ── COMBAT OVERLAY ──────────────────────────────────────────────────
function CombatOverlay({ enemy, phase, dmg, won, state, character, onDone }) {
  const e = ENEMIES[enemy];
  if (!e) return null;
  const EnemyArt = ENEMY_ART[enemy];
  const PlayerArtComp = PLAYER_ART[character.id];
  const looming = state === 'looming';
  return (
    <div style={{ position:'absolute', inset:0, zIndex: 60,
                  display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center',
                  background: looming
                    ? `radial-gradient(circle at center, ${C.deep}f0 0%, ${C.shadow}ff 80%)`
                    : `radial-gradient(circle at center, ${C.plum}c0 0%, ${C.shadow}ee 80%)`,
                  padding: 20,
                }}
         className="anim-fade-in">
      <div style={{ position:'absolute', inset: 0, opacity: 0.18, pointerEvents:'none' }} className="kaleido-overlay anim-kaleido" />
      <div style={{ textAlign:'center', marginBottom: 6, position:'relative' }}>
        <div style={{ fontFamily:"'Bowlby One',sans-serif", color: looming ? C.magenta : C.lime, fontSize: 14, letterSpacing: '0.2em' }}>
          {looming ? '— LOOMS OVER YOU —' : '— pfft —'}
        </div>
      </div>
      <div style={{ fontFamily:"'Bowlby One',sans-serif", color: C.bone, fontSize: 26 }}>{e.name}</div>
      <div className="serif" style={{ color: C.parchment, fontStyle:'italic', marginBottom: 16 }}>
        {e.attack === 'str' ? '⚔ strikes with strength' : '✦ weaves with magic'} · {e.dmg} damage
      </div>

      <div className={phase === 'strike' ? 'anim-strike-shake' : ''}>
        <EnemyArt size={140} state={state} attacking={phase === 'strike'} dying={phase === 'die'} />
      </div>

      {phase === 'result' && (
        <div style={{ marginTop: 20, textAlign: 'center' }} className="anim-fade-in">
          {won ? (
            <>
              <div style={{
                fontFamily:"'Bowlby One',sans-serif",
                color: dmg > 0 ? C.magenta : C.marigold,
                fontSize: 22,
              }}>
                {dmg > 0 ? `wounded — ${dmg} HP lost` : 'untouched!'}
              </div>
              <div style={{ color: C.marigold, fontSize: 16, marginTop: 4, fontFamily:"'Bowlby One',sans-serif" }}>
                +{e.gold}g
              </div>
            </>
          ) : (
            <div style={{ color: C.magenta, fontFamily:"'Bowlby One',sans-serif", fontSize: 22 }}>
              the dark eats you whole
            </div>
          )}
          <button onClick={onDone} className="btn-primary" style={{ marginTop: 16 }}>continue</button>
        </div>
      )}
    </div>
  );
}

function SpecialRoomScreen({ kind, save, player, charms, onLeave, onUpdatePlayer, onUpdateCharms, onUpdateSave }) {
  if (kind === 'shop') return <ShopRoom player={player} charms={charms} onLeave={onLeave} onUpdatePlayer={onUpdatePlayer} onUpdateCharms={onUpdateCharms} />;
  if (kind === 'statue') return <StatueRoom player={player} onLeave={onLeave} />;
  if (kind === 'fishing') return <FishingRoom player={player} onLeave={onLeave} onUpdatePlayer={onUpdatePlayer} />;

function ShopRoom({ player, charms, onLeave, onUpdatePlayer, onUpdateCharms }) {
  const [offers, setOffers] = useState(() => {
    const itemKeys = Object.keys(ITEMS);
    const charmKeys = Object.keys(CHARMS).filter(c => !charms.find(x => x.id === c));
    const chosen = [];
    chosen.push({ kind:'item', id: itemKeys[Math.floor(Math.random()*itemKeys.length)] });
    if (charmKeys.length) chosen.push({ kind:'charm', id: charmKeys[Math.floor(Math.random()*charmKeys.length)] });
    chosen.push({ kind:'item', id: itemKeys[Math.floor(Math.random()*itemKeys.length)] });
    return chosen;
  });

  const buy = (i) => {
    const o = offers[i];
    const data = o.kind === 'item' ? ITEMS[o.id] : CHARMS[o.id];
    if (player.gold < data.price || o.bought) return;
    if (o.kind === 'item' && player.items.length >= 4) return;
    SFX.coin(); pickVoice('coin');
    let np = { ...player, gold: player.gold - data.price };
    if (o.kind === 'item') np.items = [...player.items, o.id];
    else if (data.stat) {
      if (data.stat.str) np.str += data.stat.str;
      if (data.stat.mag) np.mag += data.stat.mag;
      if (data.stat.maxHp) { np.maxHp += data.stat.maxHp; np.hp = np.maxHp; }
    }
    onUpdatePlayer(np);
    if (o.kind === 'charm') onUpdateCharms([...charms, CHARMS[o.id]]);
    setOffers(offs => offs.map((x, idx) => idx === i ? { ...x, bought: true } : x));
  };

  return (
    <div className="full-overlay" style={{ position:'relative' }}>
      <PsychBackground floorClass="bg-floor-3" kind="sparkles" />
      <div style={{ position:'relative', zIndex:10, maxWidth: 480, width:'100%' }} className="anim-fade-up">
        {/* Peddler character */}
        <div style={{ display:'flex', alignItems:'flex-end', gap: 14, marginBottom: 14, justifyContent:'center' }}>
          <svg viewBox="0 0 100 130" width={90} height={117} className="anim-bob">
            <g filter="url(#wobble)">
              <ellipse cx="50" cy="124" rx="24" ry="3" fill={C.shadow} opacity="0.5" />
              {/* Robe */}
              <path d="M 28 60 Q 22 110 30 122 L 70 122 Q 78 110 72 60 Q 60 50 50 48 Q 40 50 28 60 Z"
                    fill={C.grape} stroke={C.ink} strokeWidth="2.5" />
              <path d="M 32 78 L 68 78 M 32 92 L 68 92 M 36 106 L 64 106"
                    stroke={C.marigold} strokeWidth="1.8" fill="none" opacity="0.7" />
              {/* Hood */}
              <path d="M 28 58 Q 24 28 50 24 Q 76 28 72 58 Q 60 50 50 50 Q 40 50 28 58 Z"
                    fill={C.plum} stroke={C.ink} strokeWidth="2.5" />
              {/* Face — three eyes */}
              <circle cx="42" cy="48" r="2.5" fill={C.marigold} />
              <circle cx="58" cy="48" r="2.5" fill={C.marigold} />
              <circle cx="50" cy="42" r="2" fill={C.cyan} />
              {/* Smile */}
              <path d="M 42 56 Q 50 62 58 56" stroke={C.bone} strokeWidth="2" fill="none" />
            </g>
          </svg>
          <div className="speech-bubble" style={{ marginBottom: 18 }}>
            "Coin or kindness, traveller. The mouth wants both."
          </div>
        </div>

        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom: 8 }}>
          <h2 className="title-text" style={{ color: C.bone, fontSize: 22, textShadow: `2px 2px 0 ${C.ink}` }}>
            THE PEDDLER
          </h2>
          <div style={{ fontFamily:"'Bowlby One',sans-serif", color: C.marigold, fontSize: 16 }}>
            ★ {player.gold}g
          </div>
        </div>

        <div style={{ display:'flex', flexDirection:'column', gap: 8 }}>
          {offers.map((o, i) => {
            const isItem = o.kind === 'item';
            const data = isItem ? ITEMS[o.id] : CHARMS[o.id];

            return (

                        display:'flex', alignItems:'center', gap: 10, textAlign:'left', cursor: cant ? 'not-allowed' : 'pointer',
                        opacity: cant ? 0.55 : 1, padding: 10,
                      }}>
                <div style={{ background: C.parchment, padding: 4, border: `2px solid ${C.ink}`, borderRadius: 4 }}>
                  {isItem ? <ItemIcon id={data.icon} size={32} /> : <CharmIcon id={data.id} size={32} />}

        <button onClick={() => { SFX.click(); onLeave(); }}

      </div>

  );

function FishingRoom({ player, onLeave, onUpdatePlayer }) {
  const [state, setState] = useState('idle'); // idle | casting | result
  const [result, setResult] = useState(null);
  const [tries, setTries] = useState(0);

  const fishLoot = () => {
    const r = Math.random();
    if (r < 0.15) return { kind:'item', id:'honey', text:"a honey vial, somehow soaked in brine" };
    if (r < 0.3)  return { kind:'item', id:'smoke', text:"a smoke petal, still dry" };
    if (r < 0.55) return { kind:'gold', amount: 4 + Math.floor(Math.random()*8), text:`${4 + Math.floor(Math.random()*8)} gold coins clamped in something's jaw` };
    if (r < 0.7)  return { kind:'heal', amount: 2, text:"a strawberry-fish, plump and pink" };
    if (r < 0.85) return { kind:'gold', amount: 1, text:"a single coin and an old shoe" };
    return { kind:'nothing', text:"only seaweed and disappointment" };
  };

  const cast = () => {
    if (tries >= 2) return;
    SFX.splash();
    setState('casting');
    setTries(t => t + 1);
    setTimeout(() => {
      const r = fishLoot();
      setResult(r);
      setState('result');
      if (r.kind === 'gold') { pickVoice('coin'); SFX.coin(); }
      else if (r.kind === 'heal') { pickVoice('heal'); SFX.heal(); }
      else if (r.kind === 'item') { pickVoice('coin'); SFX.bell(); }
      else { pickVoice('fishBad'); }
    }, 1100);
  };
  const accept = () => {
    if (!result) return;
    let np = { ...player };
    if (result.kind === 'gold') np.gold += result.amount;
    if (result.kind === 'heal') np.hp = Math.min(np.maxHp, np.hp + result.amount);
    if (result.kind === 'item' && np.items.length < 4) np.items = [...np.items, result.id];
    onUpdatePlayer(np);
    setResult(null);
    setState('idle');
  };

  return (
    <div className="full-overlay" style={{ position:'relative' }}>
      <PsychBackground floorClass="bg-floor-2" kind="petals" />
      <div style={{ position:'relative', zIndex:10, maxWidth: 460, width:'100%', textAlign:'center' }} className="anim-fade-up">
        <h2 className="title-text" style={{
          color: C.cyan, fontSize: 'clamp(22px, 5.5vw, 32px)',
          textShadow: `3px 3px 0 ${C.ink}`, marginBottom: 8,
        }}>THE FISHING POOL</h2>
        <p className="serif" style={{ color: C.bone, fontStyle:'italic', fontSize: 14, marginBottom: 14 }}>
          Black water with bright things in it. You may cast twice.
        </p>

        {/* Pool art */}
        <div style={{ position:'relative', margin: '0 auto 12px', width: 260, height: 140 }}>
          <svg viewBox="0 0 260 140" width="260" height="140">
            <g filter="url(#wobble)">
              {/* Pool */}
              <ellipse cx="130" cy="100" rx="120" ry="34" fill={C.deep} stroke={C.ink} strokeWidth="3" />
              <ellipse cx="130" cy="98" rx="110" ry="28" fill="#0a1530" />
              {/* Ripples */}
              <ellipse cx="130" cy="98" rx="40" ry="8" fill="none" stroke={C.cyan} strokeWidth="1.5" opacity="0.6" />
              <ellipse cx="130" cy="98" rx="60" ry="14" fill="none" stroke={C.cyan} strokeWidth="1" opacity="0.4" />
              {/* Tiny floating eyes */}
              <circle cx="80" cy="92" r="3" fill={C.bone} />
              <circle cx="80" cy="92" r="1.2" fill={C.ink} />
              <circle cx="180" cy="96" r="3" fill={C.bone} />
              <circle cx="180" cy="96" r="1.2" fill={C.ink} />
            </g>
            {/* Fishing line */}
            {state === 'casting' && (
              <g className="anim-bounce">
                <line x1="130" y1="0" x2="130" y2="98" stroke={C.bone} strokeWidth="1.4" />
                <circle cx="130" cy="98" r="3" fill={C.marigold} stroke={C.ink} strokeWidth="1" />
              </g>
            )}
            {state === 'result' && (
              <g className="anim-zoom-in">
                {result?.kind === 'gold' && (
                  <g>
                    <circle cx="130" cy="60" r="14" fill={C.marigold} stroke={C.ink} strokeWidth="2" />
                    <text x="130" y="66" fontSize="14" fill={C.ink} textAnchor="middle" fontFamily="Bowlby One">$</text>
                  </g>
                )}
                {result?.kind === 'heal' && (
                  <g transform="translate(116 46)"><StrawberryGlyph size={32} /></g>
                )}
                {result?.kind === 'item' && (
                  <g transform="translate(116 46)"><ItemIcon id={ITEMS[result.id].icon} size={32} /></g>
                )}
                {result?.kind === 'nothing' && (
                  <g>
                    <path d="M 118 70 L 138 70 L 142 60 L 116 60 Z" fill={C.bone} stroke={C.ink} strokeWidth="2" />
                    <text x="130" y="50" fontSize="9" fill={C.bone} textAnchor="middle" fontFamily="Caudex" fontStyle="italic">an old shoe</text>
                  </g>
                )}
              </g>
            )}
          </svg>
        </div>

        {state === 'idle' && (
          <button onClick={cast} disabled={tries >= 2}
                  className="btn-cyan" style={{ background: C.cyan, color: C.ink }}>
            {tries === 0 ? "cast a line" : tries === 1 ? "one more cast" : "no more casts"}
          </button>
        )}
        {state === 'casting' && (
          <div style={{ color: C.bone, fontStyle:'italic' }} className="serif">…something is biting…</div>
        )}
        {state === 'result' && (
          <div>
            <div className="serif" style={{ color: C.bone, fontStyle:'italic', fontSize: 15, marginBottom: 10 }}>
              {result.text}
            </div>
            <button onClick={accept} className="btn-primary">take it</button>
          </div>
        )}

        <button onClick={() => { SFX.click(); onLeave(); }}
                className="btn-secondary" style={{ marginTop: 14 }}>walk on →</button>
      </div>
    </div>
  );
}

function WinchRoom({ player, save, onLeave, onUpdatePlayer, onUpdateSave }) {
  const [deposit, setDeposit] = useState(Math.min(player.gold, 10));
  const [done, setDone] = useState(false);
  const send = () => {
    if (deposit <= 0 || deposit > player.gold) return;
    SFX.bell(); SFX.coin(); pickVoice('coin');
    onUpdatePlayer({ ...player, gold: player.gold - deposit });
    onUpdateSave({ ...save, surfaceGold: save.surfaceGold + deposit });
    setDone(true);
    setTimeout(() => { onLeave(); }, 1500);
  };
  return (
    <div className="full-overlay" style={{ position:'relative' }}>
      <PsychBackground floorClass="bg-floor-1" kind="sparkles" />
      <div style={{ position:'relative', zIndex:10, maxWidth: 440, width:'100%', textAlign:'center' }} className="anim-fade-up">
        <h2 className="title-text" style={{
          color: C.marigold, fontSize: 'clamp(22px, 5.5vw, 30px)',
          textShadow: `3px 3px 0 ${C.ink}`, marginBottom: 8,
        }}>THE WINCH BUCKET</h2>
        <p className="serif" style={{ color: C.bone, fontStyle:'italic', fontSize: 14, marginBottom: 12 }}>
          A bucket on a long chain disappears upward. Coins sent up survive your death. Coins kept don't.
        </p>

        {/* Winch art */}
        <svg viewBox="0 0 220 200" width={180} height={163} style={{ margin: '0 auto 12px' }}>
          <g filter="url(#wobble)">
            {/* Beam */}
            <rect x="20" y="20" width="180" height="14" fill="#7a4c1a" stroke={C.ink} strokeWidth="2.5" />
            {/* Chain */}
            <line x1="110" y1="34" x2="110" y2={done ? 60 : 130} stroke={C.ink} strokeWidth="2.5"
                  className={done ? 'anim-rise' : ''} />
            {/* Bucket */}
            <g transform={`translate(0 ${done ? -60 : 0})`} className={done ? 'anim-fade-in' : ''}>
              <path d="M 88 130 L 92 170 L 128 170 L 132 130 Z" fill="#7a4c1a" stroke={C.ink} strokeWidth="2.5" />
              <ellipse cx="110" cy="130" rx="22" ry="6" fill="#6a3c0a" stroke={C.ink} strokeWidth="2" />
              <line x1="88" y1="140" x2="132" y2="140" stroke={C.ink} strokeWidth="1.4" />
              {/* Coins inside */}
              {Array.from({ length: Math.min(8, Math.floor(deposit/2)) }).map((_, i) => (
                <circle key={i} cx={94 + (i%4)*9} cy={148 + Math.floor(i/4)*8} r="3.5" fill={C.marigold} stroke={C.ink} strokeWidth="1" />
              ))}
            </g>
            {/* Crank */}
            <circle cx="180" cy="40" r="14" fill={C.deep} stroke={C.ink} strokeWidth="2.5" />
            <line x1="180" y1="40" x2="194" y2="34" stroke={C.bone} strokeWidth="3" />
          </g>
        </svg>

        <div style={{ background: C.bone, color: C.ink, padding: '12px', borderRadius: 8,
                      border: `2.5px solid ${C.ink}`, boxShadow: `4px 4px 0 ${C.ink}` }}>
          <div style={{ display:'flex', justifyContent:'space-between', marginBottom: 8, fontFamily:"'Bowlby One',sans-serif" }}>
            <span>in pocket: {player.gold}g</span>
            <span>banked: {save.surfaceGold}g</span>
          </div>
          <div style={{ marginBottom: 8 }}>
            <input type="range" min={0} max={player.gold} value={deposit}
                   onChange={e => setDeposit(parseInt(e.target.value, 10))}
                   style={{ width:'100%' }} disabled={done} />
            <div style={{ fontFamily:"'Bowlby One',sans-serif", color: C.tangerine, fontSize: 22 }}>
              send up: {deposit}g
            </div>
          </div>
          <button onClick={send} disabled={done || deposit <= 0 || deposit > player.gold}
                  className="btn-primary" style={{ width: '100%', background: C.tangerine }}>
            {done ? '✓ sent' : 'turn the crank'}
          </button>
        </div>

        <button onClick={() => { SFX.click(); onLeave(); }}
                className="btn-secondary" style={{ marginTop: 14 }}>{done ? 'descending…' : 'leave the bucket →'}</button>
      </div>
    </div>
  );
}

          marginBottom: 12, lineHeight: 1,
        }}>THE SUN<br />RISES</h2>
        <p className="serif" style={{ color: C.bone, fontStyle:'italic', fontSize: 17, lineHeight: 1.6, marginBottom: 14 }}>
          You climb back up the long stairs with the Hollow Sun cupped in your hands.
          Above, a child opens her eyes to warmth she had forgotten the name of.
        </p>
        <div className="psych-card" style={{ display:'inline-block', marginBottom: 18 }}>
          <div style={{ fontFamily:"'Bowlby One',sans-serif", color: C.tangerine, fontSize: 18 }}>
            +{surfaceGoldGained}g sent to the Surface
          </div>
        </div>
        <div style={{ display:'flex', gap: 10, justifyContent:'center', flexWrap:'wrap' }}>
          <button onClick={() => { SFX.click(); onRestart(); }} className="btn-primary">descend again</button>
          <button onClick={() => { SFX.click(); onTitle(); }} className="btn-pink">to the surface</button>
        </div>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════════
// MAIN APP
// ═══════════════════════════════════════════════════════════════════════
function App() {
  const [save, setSave] = useState(loadSave);
  const [muted, setMutedState] = useState(false);
  const setMuted = (m) => { setMutedState(m); Audio.setMuted(m); };

  const [screen, setScreen] = useState('title'); // title | hub | charselect | story | dungeon | shop | statue | fishing | winch | gameover | victory
  const [character, setCharacter] = useState(null);
  const [floorIdx, setFloorIdx] = useState(0); // 0..3
  const [tiles, setTiles] = useState([]);
  const [visited, setVisited] = useState(0);
  const [doorOpen, setDoorOpen] = useState(false);
  const [hoveredRow, setHoveredRow] = useState(null);
  const [animation, setAnimation] = useState(null);
  const [message, setMessage] = useState('');
  const [pendingTileId, setPendingTileId] = useState(null);
  const [combat, setCombat] = useState(null);
  const [floorTrapsHit, setFloorTrapsHit] = useState(0);
  const [sparkMode, setSparkMode] = useState(false);
  const [selectingRow, setSelectingRow] = useState(null); // 'thunder' | 'mirror' | null
  const [statueMod, setStatueMod] = useState(null);
  const [nextSpecial, setNextSpecial] = useState(null);
  const [tongueActive, setTongueActive] = useState(false);
  const [dieType, setDieType] = useState('diePop');

  const [player, setPlayer] = useState(null);
  const [charms, setCharms] = useState([]);

  // Persist save on change
  useEffect(() => { persistSave(save); }, [save]);

  // Ambient when in dungeon
  useEffect(() => {
    if (['dungeon','shop','statue','fishing','winch','story'].includes(screen)) {
      Audio.startAmbient();
    } else {
      Audio.stopAmbient();
    }
  }, [screen]);

  // Mute toggle: also mute speech
  useEffect(() => {
    if (muted) Audio.shutUp();
  }, [muted]);

  // ── Begin a new run
  const startNewRun = () => {
    setScreen('charselect');
  };
  const pickCharacter = (id) => {
    const ch = CHARACTERS[id];
    const perks = save.perks;
    const startItems = [...(perks.startItems || []), 'honey'];
    setCharacter(ch);
    setPlayer({
      hp: ch.hp + (perks.startMaxHp || 0),
      maxHp: ch.hp + (perks.startMaxHp || 0),
      str: ch.str + (perks.startStr || 0),
      mag: ch.mag + (perks.startMag || 0),
      gold: 0,
      sun: 0,
      items: startItems,
    });
    setCharms([]);
    setFloorIdx(0);
    setStatueMod(null);
    setNextSpecial(null);
    setSave(s => ({ ...s, totalRuns: s.totalRuns + 1 }));
    setScreen('story');
  };

  // ── Start floor (set up grid)
  const beginFloor = useCallback(() => {
    const f = FLOORS[floorIdx];
    const charmIds = charms.map(c => c.id);
    setTiles(makeGrid(f, charmIds, statueMod));
    setVisited(0);
    setDoorOpen(false);
    setHoveredRow(null);
    setMessage('');
    setPendingTileId(null);
    setFloorTrapsHit(0);
    setSparkMode(false);
    setSelectingRow(null);
    setStatueMod(null);
    setTongueActive(false);
  }, [floorIdx, charms, statueMod]);

  const onContinueFromStory = () => { beginFloor(); setScreen('dungeon'); };

  // ── Resolve landing on a tile
  const resolveTile = useCallback((tileIdx) => {
    const tile = tiles[tileIdx];
    if (!tile || tile.visited) return;

    if (tile.type === 'monster') {
      const e = ENEMIES[tile.enemy];
      const stat = e.attack === 'str' ? player.str : player.mag;
      const dmg = Math.max(0, e.dmg - stat);
      const newHp = player.hp - dmg;
      const won = newHp > 0;
      const state = stat >= e.dmg ? 'silly' : 'looming';

      // Voice + sfx
      if (state === 'silly') { SFX.silly(); pickVoice('enemyEasy'); }
      else { SFX.loom(); pickVoice('enemyHard'); }

      setCombat({ enemy: tile.enemy, phase:'intro', dmg, won, state });
      setTimeout(() => { SFX.fight(); setCombat(c => c ? { ...c, phase:'strike' } : null); }, 900);
      setTimeout(() => {
        if (dmg > 0) { setAnimation('shake'); setTimeout(() => setAnimation(null), 500); pickVoice('damage'); }
        SFX.enemyDie();
        setCombat(c => c ? { ...c, phase:'die' } : null);
      }, 1450);
      setTimeout(() => setCombat(c => c ? { ...c, phase:'result' } : null), 2150);

      const goldGain = e.gold * (charms.find(c => c.id === 'lucky') ? 2 : 1);
      const sunGain = charms.find(c => c.id === 'sparrow') ? 1.5 : 1;
      setPlayer(p => ({
        ...p,
        hp: Math.max(0, newHp),
        gold: p.gold + (won ? goldGain : 0),
        sun: Math.min(3, p.sun + sunGain),
      }));
      setTiles(ts => ts.map(t => t.id === tileIdx ? { ...t, visited: true } : t));
      setVisited(v => v + 1);
      return;
    }

    // Non-combat
    setTiles(ts => ts.map(t => t.id === tileIdx ? { ...t, visited: true } : t));
    setVisited(v => v + 1);

    if (tile.type === 'ember') {
      SFX.heal(); pickVoice('heal');
      setPlayer(p => ({ ...p, hp: Math.min(p.maxHp, p.hp + 1) }));
      setMessage("a strawberry. you eat it. (+1 HP)");
    } else if (tile.type === 'chest') {
      SFX.coin(); pickVoice('coin');
      let g = (3 + Math.floor(Math.random()*4));
      if (charms.find(c => c.id === 'lucky')) g *= 2;
      if (tongueActive) { g *= 3; setTongueActive(false); setMessage(`golden tongue: ${g}g!`); }
      else setMessage(`a chest yields its coin. (+${g}g)`);
      setPlayer(p => ({ ...p, gold: p.gold + g }));
    } else if (tile.type === 'trap') {
      const f = FLOORS[floorIdx];
      const immune = charms.find(c => c.id === 'wax') && floorTrapsHit === 0;
      if (immune) {
        SFX.click();
        setMessage("the wax seal cracks — the trap fails.");
        setFloorTrapsHit(n => n + 1);
      } else {
        const dmg = f.trapDmg;
        SFX.trap(); pickVoice('damage');
        setPlayer(p => ({ ...p, hp: Math.max(0, p.hp - dmg) }));
        setAnimation('shake'); setTimeout(() => setAnimation(null), 500);
        setMessage(`a trap snaps shut. (-${dmg} HP)`);
        setFloorTrapsHit(n => n + 1);
      }
    }

    setTimeout(() => setPendingTileId(null), 700);
  }, [tiles, player, floorIdx, charms, floorTrapsHit, tongueActive]);

  const closeCombat = () => {
    const won = combat?.won;
    const wasKing = combat?.enemy === 'hollow_sun';
    setCombat(null);
    setPendingTileId(null);
    if (!won) {
      // Pick a random funny death type
      const dies = ['diePop','diePetals','dieDeflate','dieSwirl'];
      const picked = dies[Math.floor(Math.random()*dies.length)];
      setDieType(picked);
      pickVoice('death');
      SFX.death();
      setTimeout(() => setScreen('gameover'), 400);
    } else if (wasKing) {
      pickVoice('victory');
      // Calculate surface gold gained: any pocket gold becomes surface gold on victory
      const gained = player?.gold || 0;
      setSave(s => ({ ...s, surfaceGold: s.surfaceGold + gained, totalWins: s.totalWins + 1 }));
      setTimeout(() => setScreen('victory'), 600);
    }
  };

  // Pick a row
  const onPickRow = (rowIdx) => {
    if (combat || pendingTileId !== null) return;
    const tileIdx = rollRow(tiles, rowIdx);
    if (tileIdx === null) return;
    SFX.rowClick();
    setPendingTileId(tileIdx);
    setMessage('');
    setTimeout(() => { SFX.land(); resolveTile(tileIdx); }, 480);
  };

  // Sun ability — depends on character
  const onSparkPick = (tileIdx) => {
    if (!character || tiles[tileIdx].visited) return;
    const sunId = character.sun.id;
    setSparkMode(false);
    setPlayer(p => ({ ...p, sun: 0 }));
    if (sunId === 'humPick' || sunId === 'reach') {
      // Honey Boy: pick this tile directly
      setPendingTileId(tileIdx);
      setMessage("the sun guides your step.");
      setTimeout(() => { SFX.land(); resolveTile(tileIdx); }, 480);
    }
  };
  const useSunAbility = () => {
    if (!character) return;
    const id = character.sun.id;
    setPlayer(p => ({ ...p, sun: 0 }));
    if (id === 'wail') {
      // Bone Bride: instant-kill all monsters; mark visited; gain gold
      let goldGain = 0;
      setTiles(ts => ts.map(t => {
        if (t.visited || t.type !== 'monster') return t;
        goldGain += ENEMIES[t.enemy]?.gold || 0;
        return { ...t, visited: true };
      }));
      const monsterCount = tiles.filter(t => !t.visited && t.type === 'monster').length;
      setVisited(v => v + monsterCount);
      setPlayer(p => ({ ...p, gold: p.gold + goldGain, sun: 0 }));
      SFX.spark();
      setMessage(`a wail. all monsters fall. (+${goldGain}g)`);
    } else if (id === 'reach') {
      // Octopus King: open all four tiles in any one row
      setSelectingRow('reach');
      setMessage("pick a row to engulf →");
    } else if (id === 'serenade') {
      // Mariachi Skull: heal full + smoke petal
      setPlayer(p => ({ ...p, hp: p.maxHp, sun: 0, items: p.items.length < 4 ? [...p.items, 'smoke'] : p.items }));
      SFX.heal();
      setMessage("a song. you are full again.");
    }
  };

  // For the Honey Boy / direct-pick characters, the existing onSparkPick handles things.
  // But for Bone Bride (wail) and Mariachi (serenade), we want a non-targeting trigger.
  // Override the spark button by intercepting before sparkMode is turned on:
  const handleSparkClick = () => {
    if (!character) return;
    const id = character.sun.id;
    SFX.spark(); pickVoice('spark');
    if (id === 'humPick') setSparkMode(true);
    else if (id === 'reach') setSelectingRow('reach');
    else useSunAbility();
  };

  // For "reach" row pick
  const onSelectRowAction = (rowIdx) => {
    if (selectingRow === 'thunder') {
      const newlyVisited = tiles.slice(rowIdx*4, rowIdx*4+4).filter(t => !t.visited).length;
      setTiles(ts => ts.map((t, i) => Math.floor(i/4) === rowIdx && !t.visited ? { ...t, visited: true } : t));
      setVisited(v => v + newlyVisited);
      setSelectingRow(null);
      setMessage("thunder splits the row.");
      SFX.trap();
    } else if (selectingRow === 'mirror') {
      const newlyVisited = tiles.filter((t, i) => i % 4 === rowIdx && !t.visited).length;
      setTiles(ts => ts.map((t, i) => i % 4 === rowIdx && !t.visited ? { ...t, visited: true } : t));
      setVisited(v => v + newlyVisited);
      setSelectingRow(null);
      setMessage("mirror folds the column.");
      SFX.bell();
    } else if (selectingRow === 'reach') {
      // Open every tile in this row, applying outcomes one by one
      const rowTiles = tiles.slice(rowIdx*4, rowIdx*4+4).filter(t => !t.visited);
      setSelectingRow(null);
      setMessage("the eight reach takes the row.");
      // resolve sequentially with small delays
      let i = 0;
      const stepNext = () => {
        if (i >= rowTiles.length) return;
        const tIdx = rowTiles[i].id;
        setPendingTileId(tIdx);
        setTimeout(() => {
          resolveTile(tIdx);
          i++;
          // If a monster combat begins here, the combat overlay will block; skip the rest
          // For simplicity, keep stepping after a delay
          setTimeout(stepNext, 1400);
        }, 350);
      };
      stepNext();
    }
  };

  // Use item
  const onUseItem = (idx) => {
    if (selectingRow) return;
    const itemId = player.items[idx];
    const item = ITEMS[itemId];
    SFX.bell();
    const newItems = player.items.filter((_, i) => i !== idx);
    if (item.id === 'honey') {
      setPlayer(p => ({ ...p, hp: Math.min(p.maxHp, p.hp + 3), items: newItems }));
      setMessage("you drink the honey vial. (+3 HP)");
    } else if (item.id === 'smoke') {
      // Reroll: scramble unvisited tiles
      const f = FLOORS[floorIdx];
      const charmIds = charms.map(c => c.id);
      setTiles(ts => {
        const fresh = makeGrid(f, charmIds, statueMod);
        return ts.map(t => t.visited ? t : fresh[t.id]);
      });
      setPlayer(p => ({ ...p, items: newItems }));
      setMessage("smoke billows. the room rearranges itself.");
    } else if (item.id === 'thunder') {
      setSelectingRow('thunder');
      setPlayer(p => ({ ...p, items: newItems }));
      setMessage("⚡ pick a row to wipe");
    } else if (item.id === 'mirror') {
      setSelectingRow('mirror');
      setPlayer(p => ({ ...p, items: newItems }));
      setMessage("⊥ pick a column to wipe");
    } else if (item.id === 'tongue') {
      setTongueActive(true);
      setPlayer(p => ({ ...p, items: newItems }));
      setMessage("your tongue gleams. next chest pays triple.");
    } else if (item.id === 'bell') {
      setPlayer(p => ({ ...p, sun: 3, items: newItems }));
      setMessage("a bell rings. your sun is full.");
    }
  };

  // Door opens when threshold met
  useEffect(() => {
    const f = FLOORS[floorIdx];
    if (!f.isBoss && visited >= f.required && !doorOpen) {
      setDoorOpen(true);
      setMessage("the door creaks open. step through.");
      SFX.bell();
    }
  }, [visited, floorIdx, doorOpen]);

  // Death
  useEffect(() => {
    if (player && player.hp <= 0 && screen === 'dungeon' && !combat) {
      const dies = ['diePop','diePetals','dieDeflate','dieSwirl'];
      const picked = dies[Math.floor(Math.random()*dies.length)];
      setDieType(picked);
      pickVoice('death'); SFX.death();
      setTimeout(() => setScreen('gameover'), 600);
    }
  }, [player?.hp, screen, combat]);

  // Enter the door
  const onEnterDoor = () => {
    if (!doorOpen) return;
    const next = floorIdx + 1;
    if (next >= 4) {
      // Last floor was reached — but actually we don't go to the next floor after Hollow Sun;
      // victory triggers on king kill in closeCombat. So this fires for floor 3 -> 4.
      setFloorIdx(next);
      // Force a special between 3 and 4? no — go straight to story
      setScreen('story');
      return;
    }
    // Pick a special room: shop (1st), random middle (2nd), winch (3rd, before boss)
    let pick;
    if (next === 1) pick = 'shop';
    else if (next === 2) pick = Math.random() < 0.5 ? 'statue' : 'fishing';
    else pick = 'winch'; // before the boss
    setNextSpecial({ kind: pick, nextFloor: next });
    setScreen(pick);
  };

  const onLeaveSpecial = (modOrNothing) => {
    if (modOrNothing && typeof modOrNothing === 'object' && (modOrNothing.monster || modOrNothing.chest || modOrNothing.trap || modOrNothing.ember)) {
      setStatueMod(modOrNothing);
    }
    setFloorIdx(nextSpecial.nextFloor);
    setNextSpecial(null);
    setScreen('story');
  };

  // ── Render ──────────────────────────────────────────────────────────
  return (
    <>
      <SvgDefs />
      {screen === 'title' && (
        <TitleScreen save={save} onPlay={startNewRun}
                     onHub={() => setScreen('hub')}
                     onMute={setMuted} muted={muted} />
      )}
      {screen === 'hub' && (
        <HubScreen save={save} onUpdateSave={setSave}
                   onBack={() => setScreen('title')} />
      )}
      {screen === 'charselect' && (
        <CharSelectScreen save={save}
                          onPick={pickCharacter}
                          onBack={() => setScreen('title')} />
      )}
      {screen === 'story' && character && (
        <StoryScreen floor={floorIdx + 1} onContinue={onContinueFromStory} />
      )}
      {screen === 'dungeon' && character && player && (
        <DungeonScreen
          floorIdx={floorIdx}
          tiles={tiles}
          visited={visited}
          player={player}
          charms={charms}
          character={character}
          hoveredRow={hoveredRow}
          setHoveredRow={setHoveredRow}
          onPickRow={onPickRow}
          animation={animation}
          message={message}
          doorOpen={doorOpen}
          onEnterDoor={onEnterDoor}
          onUseItem={onUseItem}
          pendingTileId={pendingTileId}
          sparkMode={sparkMode}
          setSparkMode={(v) => v ? handleSparkClick() : setSparkMode(false)}
          onSparkPick={onSparkPick}
          selectingRow={!!selectingRow}
          onSelectRow={onSelectRowAction}
          onCancel={() => { setSparkMode(false); setSelectingRow(null); setMessage(''); }}
        />
      )}
      {(screen === 'shop' || screen === 'statue' || screen === 'fishing' || screen === 'winch') && (
        <SpecialRoomScreen
          kind={screen}
          save={save}
          player={player}
          charms={charms}
          onLeave={onLeaveSpecial}
          onUpdatePlayer={setPlayer}
          onUpdateCharms={setCharms}
          onUpdateSave={setSave}
        />
      )}
      {screen === 'gameover' && character && (
        <GameOverScreen
          floor={floorIdx + 1}
          character={character}
          dieType={dieType}
          onRestart={() => setScreen('charselect')}
          onTitle={() => setScreen('title')}
        />
      )}
      {screen === 'victory' && character && (
        <VictoryScreen
          character={character}
          surfaceGoldGained={(player?.gold || 0)}
          onRestart={() => setScreen('charselect')}
          onTitle={() => setScreen('title')}
        />
      )}
      {combat && character && (
        <CombatOverlay {...combat} character={character} onDone={closeCombat} />
      )}
    </>
  );
}

// MOUNT
// ═══════════════════════════════════════════════════════════════════════
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

</script>
