<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>◉ MAD TEA PARTY — Drink in the Correct Order ◉</title>
<link rel="stylesheet" href="assets/shared.css">
<style>
  .teaWrap { max-width: 860px; margin: 0 auto; padding: 22px 18px 80px; }

  .teahead { text-align: center; margin-bottom: 18px; }
  .teahead h1 {
    font-family: var(--font-display);
    font-size: clamp(1.8rem, 6vw, 3rem); margin: 0;
    background: linear-gradient(90deg, var(--neon-pink), var(--neon-yellow));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    background-size: 200% auto;
    animation: hueSlide 4s linear infinite;
  }
  .teahead p { color: #d0b898; font-style: italic; margin: 8px 0 0; }

  /* the clock banner */
  .clockband {
    display: flex; justify-content: center; align-items: center;
    gap: 20px; padding: 10px; flex-wrap: wrap;
    font-family: var(--font-mondo); font-size: 22px;
    color: var(--neon-yellow); text-shadow: 0 0 8px currentColor;
  }
  .clockband .clock {
    display: inline-block; font-size: 36px;
    animation: clockSpin 10s linear infinite;
    filter: drop-shadow(0 0 10px var(--neon-yellow));
  }
  @keyframes clockSpin {
    0% { transform: rotate(0deg) scale(1); }
    50% { transform: rotate(180deg) scale(1.1); }
    100% { transform: rotate(360deg) scale(1); }
  }

  .table {
    position: relative;
    margin: 30px auto;
    max-width: 620px;
    aspect-ratio: 1;
    border-radius: 50%;
    background:
      radial-gradient(circle at 50% 50%, rgba(102,26,0,.8) 0%, rgba(60,10,0,.95) 70%, transparent 100%),
      repeating-conic-gradient(from 0deg, #661a00 0deg 30deg, #4a1200 30deg 60deg);
    border: 6px double var(--neon-yellow);
    box-shadow: 0 0 60px rgba(255,230,0,.35), inset 0 0 80px rgba(0,0,0,.7);
  }
  .table::before {
    content: ""; position: absolute; inset: 15%;
    border-radius: 50%;
    border: 2px dashed rgba(255,230,0,.4);
  }
  .table::after {
    content: "6 O'CLOCK"; position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-family: var(--font-display);
    font-size: clamp(16px, 3.5vw, 22px);
    color: var(--neon-yellow); text-shadow: 0 0 15px currentColor;
    letter-spacing: .15em;
    text-align: center;
    opacity: .75;
  }

  .cup {
    position: absolute;
    width: 18%;
    aspect-ratio: 1;
    border-radius: 50%;
    border: 3px solid #fff;
    display: grid; place-items: center;
    font-size: clamp(30px, 6vw, 44px);
    cursor: pointer;
    transition: transform .15s, filter .15s;
    transform: translate(-50%, -50%);
    box-shadow: 0 6px 22px rgba(0,0,0,.6);
    user-select: none;
  }
  .cup:hover { transform: translate(-50%, -50%) scale(1.08); }
  .cup:active { transform: translate(-50%, -50%) scale(0.92); }

  .cup.c1 { background: radial-gradient(circle at 30% 30%, #ff77b0, var(--neon-pink));   box-shadow: 0 0 20px var(--neon-pink); }
  .cup.c2 { background: radial-gradient(circle at 30% 30%, #77f3ff, var(--neon-cyan));   box-shadow: 0 0 20px var(--neon-cyan); }
  .cup.c3 { background: radial-gradient(circle at 30% 30%, #fff477, var(--neon-yellow)); box-shadow: 0 0 20px var(--neon-yellow); }
  .cup.c4 { background: radial-gradient(circle at 30% 30%, #d4ff77, var(--neon-lime));   box-shadow: 0 0 20px var(--neon-lime); }
  .cup.c5 { background: radial-gradient(circle at 30% 30%, #c58cff, var(--neon-purple)); box-shadow: 0 0 20px var(--neon-purple); }
  .cup.c6 { background: radial-gradient(circle at 30% 30%, #ff8484, var(--blood));       box-shadow: 0 0 20px var(--blood); }

  .cup.flash {
    filter: brightness(1.8) saturate(1.5);
    transform: translate(-50%, -50%) scale(1.18);
    box-shadow: 0 0 50px currentColor;
  }
  .cup.disabled { pointer-events: none; filter: grayscale(.7) brightness(.7); }

  .status {
    text-align: center; margin-top: 10px;
    font-family: var(--font-mono); font-size: 20px;
    color: var(--neon-cyan);
    min-height: 48px;
    letter-spacing: .05em;
  }
  .status .hatter {
    color: var(--neon-yellow); font-style: italic;
    font-family: var(--font-body);
    text-shadow: 0 0 8px currentColor;
  }
  .status .level { color: var(--cream); font-family: var(--font-display); font-size: 18px; letter-spacing: .1em; }

  .controls {
    display: flex; justify-content: center; gap: 10px; margin-top: 16px; flex-wrap: wrap;
  }

  .finale-card {
    text-align: center; margin: 30px auto 0; padding: 22px;
    background: rgba(0,0,0,.7);
    border: 2px solid var(--neon-yellow);
    box-shadow: 0 0 40px rgba(255,230,0,.4);
    display: none;
    max-width: 540px;
  }
  .finale-card.show { display: block; animation: fadeIn .5s both; }
  .finale-card h2 {
    font-family: var(--font-display);
    font-size: clamp(1.4rem,4vw,2rem); margin: 0 0 10px;
    background: linear-gradient(90deg, var(--neon-pink), var(--neon-yellow), var(--neon-lime));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    background-size: 200% auto; animation: hueSlide 3s linear infinite;
  }
  .reward { font-family: var(--font-mono); font-size: 18px; margin: 14px 0; }
  .reward div { border-left: 3px solid var(--neon-acid); padding: 2px 10px; margin: 4px auto; max-width: 340px; text-align: left; }

  .weapon-reveal {
    margin: 18px auto; padding: 14px;
    background: radial-gradient(ellipse at center, rgba(255,0,153,.25), transparent 70%);
    font-family: var(--font-horror);
    font-size: clamp(1.4rem, 4vw, 2rem);
    color: var(--neon-pink);
    text-shadow: 0 0 20px currentColor;
    letter-spacing: .08em;
    animation: weaponPulse 2s ease-in-out infinite;
  }
  @keyframes weaponPulse {
    0%,100% { transform: scale(1); }
    50%     { transform: scale(1.05); text-shadow: 0 0 30px currentColor, 0 0 50px currentColor; }
  }
</style>
</head>
<body>

<div class="teaWrap">

  <div class="teahead">
    <h1>◈ THE MAD TEA PARTY ◈</h1>
    <p>Watch the Hatter pour. Drink the cups back in the same order. <br>
       Each round adds one cup. Three rounds or you're out.</p>
  </div>

  <div class="clockband">
    <span class="clock">🕕</span>
    <span>IT IS ALWAYS SIX O'CLOCK</span>
    <span class="clock" style="animation-direction:reverse">🕕</span>
  </div>

  <div class="table" id="table">
    <!-- cups positioned clock-style -->
    <div class="cup c1" data-i="0" style="left:50%;top:12%">🫖</div>
    <div class="cup c2" data-i="1" style="left:82%;top:28%">☕</div>
    <div class="cup c3" data-i="2" style="left:88%;top:65%">🍵</div>
    <div class="cup c4" data-i="3" style="left:50%;top:88%">🏺</div>
    <div class="cup c5" data-i="4" style="left:12%;top:65%">🥃</div>
    <div class="cup c6" data-i="5" style="left:18%;top:28%">🧋</div>
  </div>

  <div class="status" id="status">
    <span class="hatter">The Hatter watches you with eight hands and one watch. "Shall we?"</span>
  </div>

  <div class="controls">
    <button class="trip-btn" id="startBtn">▶ POUR THE FIRST CUP</button>
    <a href="index.html" class="trip-btn ghost">◉ HUB</a>
  </div>

  <div class="finale-card" id="finale">
    <h2 id="finaleTitle">—</h2>
    <div id="finaleBody" style="color:#d0c0a0;font-style:italic"></div>
    <div class="weapon-reveal" id="weaponBox" style="display:none"></div>
    <div class="reward" id="rewardList"></div>
    <div class="mt2">
      <a href="index.html" class="trip-btn cyan">◉ RETURN TO HUB</a>
      <button class="trip-btn ghost" onclick="restart()">⟲ AGAIN</button>
    </div>
  </div>
</div>

<script src="assets/shared.js"></script>
<script>
TRIP.mountAtmosphere();
TRIP.mountHUD();
TRIP.mountTopNav('tea');
TRIP.visit('tea');

let sequence = [];
let playerIdx = 0;
let round = 0;
const TOTAL_ROUNDS = 3;   // 3 rounds: 3 cups, 4 cups, 5 cups
const START_LEN = 3;
let playing = false;
let acceptingInput = false;
let failed = false;

const cups = [...document.querySelectorAll('.cup')];
const statusEl = document.getElementById('status');

cups.forEach(c => c.addEventListener('click', () => {
  if (!acceptingInput) return;
  const i = +c.dataset.i;
  flashCup(i);
  playSound(i);
  if (i === sequence[playerIdx]) {
    playerIdx++;
    if (playerIdx === sequence.length) {
      // round complete
      acceptingInput = false;
      disableCups();
      setTimeout(nextRound, 800);
    }
  } else {
    // wrong
    acceptingInput = false;
    disableCups();
    failed = true;
    statusEl.innerHTML = `<span class="hatter">"Oh <em>dear</em>," says the Hatter, folding time back into itself. "Not that one."</span>`;
    setTimeout(endGame, 1500);
  }
}));

document.getElementById('startBtn').addEventListener('click', () => {
  if (playing) return;
  startGame();
});

function startGame() {
  playing = true;
  round = 0;
  failed = false;
  sequence = [];
  document.getElementById('startBtn').style.display = 'none';
  document.getElementById('finale').classList.remove('show');
  nextRound();
}

function nextRound() {
  round++;
  if (round > TOTAL_ROUNDS) { win(); return; }
  // extend sequence so round 1 = 3 cups, round 2 = 4, round 3 = 5
  const targetLen = START_LEN + (round - 1);
  while (sequence.length < targetLen) sequence.push(Math.floor(Math.random()*6));
  statusEl.innerHTML = `
    <div class="level">ROUND ${round} / ${TOTAL_ROUNDS} — ${sequence.length} CUPS</div>
    <span class="hatter">The Hatter pours...</span>`;
  setTimeout(playSequence, 900);
}

function disableCups(){ cups.forEach(c => c.classList.add('disabled')); }
function enableCups(){ cups.forEach(c => c.classList.remove('disabled')); }

async function playSequence() {
  disableCups();
  for (let i = 0; i < sequence.length; i++) {
    await sleep(500);
    flashCup(sequence[i]);
    playSound(sequence[i]);
    await sleep(260);
  }
  await sleep(300);
  statusEl.innerHTML = `
    <div class="level">ROUND ${round} / ${TOTAL_ROUNDS} — YOUR TURN</div>
    <span class="hatter">"Your go. Don't make a mess of the tea."</span>`;
  playerIdx = 0;
  enableCups();
  acceptingInput = true;
}

function flashCup(i) {
  cups[i].classList.add('flash');
  setTimeout(() => cups[i].classList.remove('flash'), 320);
}

// web audio — simple tones per cup
const AC = window.AudioContext || window.webkitAudioContext;
let actx;
function playSound(i) {
  if (!actx) try { actx = new AC(); } catch(e){ return; }
  if (!actx) return;
  const notes = [440, 523, 587, 659, 740, 880]; // A4 C5 D5 E5 F#5 A5
  const o = actx.createOscillator();
  const g = actx.createGain();
  o.type = 'triangle';
  o.frequency.value = notes[i];
  g.gain.value = 0.0001;
  o.connect(g); g.connect(actx.destination);
  o.start();
  g.gain.exponentialRampToValueAtTime(0.22, actx.currentTime + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + 0.34);
  o.stop(actx.currentTime + 0.36);
}

function sleep(ms){ return new Promise(r => setTimeout(r,ms)); }

function win() {
  playing = false;
  statusEl.innerHTML = `<span class="hatter">The Hatter removes his hat, bows inside it, and hands you something wrapped in paper.</span>`;

  // reward
  const threads = 400 + round * 50;
  const lucidity = 15;
  const paranoia = -10;
  TRIP.adjust('threads', threads);
  TRIP.adjust('lucidity', lucidity);
  TRIP.adjust('paranoia', paranoia);
  TRIP.adjust('days', 1);

  TRIP.complete('tea');
  TRIP.unlockCodex('mad-hatter');
  TRIP.flag('teaWeapon', 'vorpal');   // this shows up in Wonder/Doom
  TRIP.flag('whimsyWeaponOffer', true);

  document.getElementById('finaleTitle').textContent = 'TEA CLAIMED';
  document.getElementById('finaleBody').innerHTML = `You drank every cup in the Hatter's order. The six o'clock holds, for now.`;
  const wb = document.getElementById('weaponBox');
  wb.style.display = 'block';
  wb.innerHTML = `✦ THE VORPAL PARING KNIFE ✦<br><span style="font-family:var(--font-mono);font-size:16px;color:#d0d0d0;letter-spacing:.05em">(shoots the dark in the face. appears in Wonder/Doom.)</span>`;

  const rew = document.getElementById('rewardList');
  rew.innerHTML = `
    <div>+${threads} THREADS</div>
    <div>+${lucidity} LUCIDITY</div>
    <div>−10 PARANOIA</div>
    <div class="pink">CODEX: Mad Hatter</div>
    <div class="pink">NEW WEAPON CARRIED</div>
  `;

  document.getElementById('finale').classList.add('show');
  document.getElementById('finale').scrollIntoView({behavior:'smooth',block:'start'});
}

function endGame() {
  playing = false;
  // partial rewards based on round reached
  const threadsEarned = round * 80;
  TRIP.adjust('threads', threadsEarned);
  TRIP.adjust('paranoia', 10);
  TRIP.adjust('days', 1);

  document.getElementById('finaleTitle').textContent = 'THE CHAIRS REARRANGE';
  document.getElementById('finaleBody').innerHTML = `The Hatter shakes his head. The chairs, all of them, slide one seat counter-clockwise. You are now in the Dormouse's seat, which was not part of the deal.`;
  document.getElementById('weaponBox').style.display = 'none';
  const rew = document.getElementById('rewardList');
  rew.innerHTML = `
    <div>+${threadsEarned} THREADS (partial)</div>
    <div class="blood">+10 PARANOIA</div>
    <div style="color:#aaa">No weapon today. Come back, get it right.</div>
  `;
  document.getElementById('finale').classList.add('show');
  document.getElementById('finale').scrollIntoView({behavior:'smooth',block:'start'});
}

function restart() {
  document.getElementById('finale').classList.remove('show');
  document.getElementById('startBtn').style.display = '';
  enableCups();
  statusEl.innerHTML = `<span class="hatter">The Hatter refills his watch. "Another round?"</span>`;
}
</script>
</body>
</html>
