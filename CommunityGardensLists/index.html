        // Render Eugene Gardens
        const eugeneGardenList = document.getElementById('eugene-garden-list');
        eugeneGardenLocations.forEach(garden => {
            const listItem = document.createElement('li');
            const link = document.createElement('a');

            link.href = `../CommunityGardensMaps/indexEugeneMap.html?id=${garden.id}`;
            link.textContent = garden.name;

            listItem.appendChild(link);
            eugeneGardenList.appendChild(listItem);
        });

        // Render Portland Gardens
        const portlandGardenList = document.getElementById('portland-garden-list');
        portlandGardenLocations.forEach(garden => {

            portlandGardenList.appendChild(listItem);
