<body>
<!-- Placeholder for the nav -->
  <div id="nav-container"></div>

	
  <h1>FOOD4THOTH Music Mixer</h1>
  
  <div>
  <label for="songSelect"><strong>Select Song:</strong></label>
  <select id="songSelect"></select>
  <button id="playBtn">Play All</button>
  <button id="stopBtn">Stop All</button>
  <button id="playSelectedBtn">Play Selected</button>
</div>

  <!-- Dynamic list of tracks for the selected song -->
  <div id="tracksContainer"></div>
  
  <!-- Effects Controls -->
  <div class="effects">
    <h2>Effects Control</h2>
    <!-- Reverb -->
    <div>
      <input type="checkbox" id="reverbToggle" />
      <label for="reverbToggle">Reverb</label>
      <label for="reverbDecay">Decay:</label>
      <input type="range" id="reverbDecay" min="0.1" max="6" step="0.1" value="1.5" />
    </div>

    <!-- Delay -->
    <div>
      <input type="checkbox" id="delayToggle" />
      <label for="delayToggle">Delay</label>
      <label for="delayTime">Time (sec):</label>
      <input type="range" id="delayTime" min="0" max="1" step="0.05" value="0.5" />
    </div>

    <!-- Distortion -->
    <div>
      <input type="checkbox" id="distToggle" />
      <label for="distToggle">Distortion</label>
      <label for="distAmount">Amount:</label>
      <input type="range" id="distAmount" min="0" max="1" step="0.01" value="0.4" />
    </div>
  </div>
