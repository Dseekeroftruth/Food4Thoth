<script>
  // Preload all tarot card images
  function preloadImages(cards) {
    const promises = cards.map(card => {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.src = card.imagePath;
        img.onload = resolve;   // Once loaded, we know the image is cached
        img.onerror = reject;   // We can capture if an image fails
      });
    });
    return Promise.all(promises);
  }

  // Then, inside your DOMContentLoaded or a <script> after tarotCards definition:
  document.addEventListener("DOMContentLoaded", () => {
    preloadImages(tarotCards)
      .then(() => {
        console.log("All images preloaded successfully!");
        // Now you can safely start your randomizing logic.
        startRandomizing();
      })
      .catch(error => {
        console.error("Some images failed to preload:", error);
        startRandomizing(); // or handle it gracefully
      });
  });
</script>

<script type="x-shader/x-fragment" id="vertShader">
    precision mediump float;

    varying vec2 vUv;
    attribute vec2 a_position;

    void main() {
        vUv = .5 * (a_position + 1.);
        gl_Position = vec4(a_position, 0.0, 1.0);
    }
</script>

<script type="x-shader/x-fragment" id="fragShader">
    precision mediump float;

    varying vec2 vUv;
    uniform float u_time;
    uniform float u_ratio;
    uniform vec2 u_pointer_position;
    uniform float u_scroll_progress;

    vec2 rotate(vec2 uv, float th) {
        return mat2(cos(th), sin(th), -sin(th), cos(th)) * uv;
    }

    float neuro_shape(vec2 uv, float t, float p) {
        vec2 sine_acc = vec2(0.);
        vec2 res = vec2(0.);
        float scale = 8.;

        for (int j = 0; j < 15; j++) {
            uv = rotate(uv, 1.);
            sine_acc = rotate(sine_acc, 1.);
            vec2 layer = uv * scale + float(j) + sine_acc - t;
            sine_acc += sin(layer);
            res += (.5 + .5 * cos(layer)) / scale;
            scale *= (1.2 - .07 * p);
        }
        return res.x + res.y;
    }

    void main() {
        vec2 uv = .5 * vUv;
        uv.x *= u_ratio;

        vec2 pointer = vUv - u_pointer_position;
        pointer.x *= u_ratio;
        float p = clamp(length(pointer), 0., 1.);
        p = .5 * pow(1. - p, 2.);

        float t = .001 * u_time;
        vec3 color = vec3(0.);

        float noise = neuro_shape(uv, t, p);

        noise = 1.2 * pow(noise, 3.);
        noise += pow(noise, 10.);
        noise = max(.0, noise - .5);
        noise *= (1. - length(vUv - .5));

        color = normalize(vec3(.2, .5 + .4 * cos(3. * u_scroll_progress), .5 + .5 * sin(3. * u_scroll_progress)));

        color = color * noise;

        gl_FragColor = vec4(color, noise);
    }
</script>

<script>
    const canvas = document.getElementById('neuro');
    const gl = canvas.getContext('webgl');

    const vertexShaderSource = document.getElementById('vertShader').text;
    const fragmentShaderSource = document.getElementById('fragShader').text;

    function createShader(gl, type, source) {
        const shader = gl.createShader(type);
        gl.shaderSource(shader, source);
        gl.compileShader(shader);
        if (gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
            return shader;
        }
        console.error(gl.getShaderInfoLog(shader));
        gl.deleteShader(shader);
    }

    function createProgram(gl, vertexShader, fragmentShader) {
        const program = gl.createProgram();
        gl.attachShader(program, vertexShader);
        gl.attachShader(program, fragmentShader);
        gl.linkProgram(program);
        if (gl.getProgramParameter(program, gl.LINK_STATUS)) {
            return program;
        }
        console.error(gl.getProgramInfoLog(program));
        gl.deleteProgram(program);
    }

    function resizeCanvasToDisplaySize(canvas) {
        const displayWidth  = canvas.clientWidth;
        const displayHeight = canvas.clientHeight;

        if (canvas.width !== displayWidth || canvas.height !== displayHeight) {
            canvas.width = displayWidth;
            canvas.height = displayHeight;
        }
    }

    const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
    const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);
    const program = createProgram(gl, vertexShader, fragmentShader);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'u_time');
    const ratioLocation = gl.getUniformLocation(program, 'u_ratio');
    const pointerPositionLocation = gl.getUniformLocation(program, 'u_pointer_position');
    const scrollProgressLocation = gl.getUniformLocation(program, 'u_scroll_progress');

    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    const positions = new Float32Array([
        -1, -1,
         1, -1,
        -1,  1,
         1,  1,
    ]);
    gl.bufferData(gl.ARRAY_BUFFER, positions, gl.STATIC_DRAW);

    function render(time) {
        resizeCanvasToDisplaySize(canvas);
        gl.viewport(0, 0, gl.drawingBufferWidth, gl.drawingBufferHeight);

        gl.clear(gl.COLOR_BUFFER_BIT);

        gl.useProgram(program);

        gl.enableVertexAttribArray(positionLocation);
        gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
        gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

        gl.uniform1f(timeLocation, time);
        gl.uniform1f(ratioLocation, canvas.clientWidth / canvas.clientHeight);
        gl.uniform2f(pointerPositionLocation, 0.5, 0.5);
        gl.uniform1f(scrollProgressLocation, 0);

        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

        requestAnimationFrame(render);
    }

    { id: 78, name: "King of Pentacles", description: "The King of Pentacles symbolizes wealth, leadership, and mastery over the material realm.", imagePath: "./images/KINGPENTACLES.PNG", fileName: "./full_descriptions/78_14KingofPentaclesMinorArcana.txt" }
];

    let randomInterval;
    let currentCardIndex = 0;
    let descriptionStep = 0;
    let speechSynthesisInstance = window.speechSynthesis;
    let isRandomizing = false; // New flag to track randomization state

    const imageElement = document.getElementById('image');
    const randomizeButton = document.getElementById('randomize');
    const descriptionButton = document.getElementById('descriptionBtn');
    const descriptionDiv = document.getElementById('description');
    const closeDescriptionButton = document.getElementById('closeDescription');

    function startRandomizing() {
        if (isRandomizing) return; // Prevent re-randomizing while already randomizing
        isRandomizing = true; // Set the flag to true
        descriptionStep = 0;
        hideDescriptions();
        randomInterval = setInterval(() => {
            currentCardIndex = Math.floor(Math.random() * tarotCards.length);
            const selectedCard = tarotCards[currentCardIndex];
            loadImage(selectedCard);
        }, 100); // Change image every 100ms (adjust as needed)
    }

    function stopRandomizing() {
        clearInterval(randomInterval);
        isRandomizing = false; // Set the flag to false
        descriptionButton.classList.remove('hidden');
    }
		
		

    function hideDescriptions() {
        descriptionDiv.classList.add('hidden');
        descriptionButton.textContent = "Description";
    }

    function fetchFullDescription(card) {
    fetch(card.fileName)
        .then(response => {
            if (!response.ok) {
                throw new Error(`Failed to load ${card.fileName} (Status: ${response.status})`);
            }
            return response.text();
        })
        .then(data => {
            descriptionDiv.textContent = data;
            descriptionDiv.classList.remove('hidden');
        })
        .catch(error => logError(error.message));
}

    function loadImage(card) {
		
        imageElement.src = card.imagePath;
    }
		
		

    

    function toggleDescription() {
        const selectedCard = tarotCards[currentCardIndex];
        if (descriptionStep === 0) {
            // Show short description
            descriptionDiv.textContent = selectedCard.description;
            descriptionDiv.classList.remove('hidden');
            descriptionButton.textContent = "Full Description";
        } else if (descriptionStep === 1) {
            // Fetch and show full description
            fetchFullDescription(selectedCard);
            descriptionButton.textContent = "Play Audio";
        } else if (descriptionStep === 2) {
            // Use Speech Synthesis to read the full description aloud
            const textToRead = descriptionDiv.textContent;
            const utterance = new SpeechSynthesisUtterance(textToRead);
           
						// Ensure Bluetooth or headphones audio output
            utterance.onstart = () => {
                console.log("Audio will play through connected device (Bluetooth/headphones).");
            };
						speechSynthesisInstance.speak(utterance);

            descriptionButton.textContent = "Stop Audio";
            // Handle the end of speech to reset the button
            utterance.onend = () => {
                descriptionButton.textContent = "Play Audio";
            };
        } else if (descriptionStep === 3) {
            // Stop the audio
            speechSynthesisInstance.cancel(); // Stop the speech
            descriptionButton.textContent = "Close";
        }
        descriptionStep = (descriptionStep + 1) % 4;
    }

    // Event Listeners
    imageElement.addEventListener('click', stopRandomizing);
    window.addEventListener('keydown', (event) => {
        if (event.code === 'Space') {
            stopRandomizing();
        }
    });

    descriptionButton.addEventListener('click', toggleDescription);

    closeDescriptionButton.addEventListener('click', () => {
        descriptionDiv.classList.add('hidden');
    });

    // Re-randomize after stopping
    randomizeButton.addEventListener('click', () => {
        if (!isRandomizing) {
            startRandomizing();
            descriptionButton.classList.add('hidden');
        }
    });

    // Start randomization immediately
    startRandomizing();

</script>
