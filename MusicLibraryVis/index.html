  <!-- TITLE for the Visualizer (can be toggled via JS) -->

  <button id="toggle-Controls1" class="toggle-button1">☰ Controls</button>

  <!-- Controls for Visualization #0 (Fractal) -->
  <div id="controls" class="controls hidden">
    <div>
      <label for="spin-speed">Spin Speed:</label>
      <input
        type="range"
        id="spin-speed"
        min="0.00"
        max="10"
        step="0.05"
        value="1"
        oninput="updateSpinSpeed(this.value)"
      />
      <span id="spin-speed-label">1</span>
    </div>
    <div>
      <label for="spiral-spread-slider">Spiral Spread:</label>
      <input
        type="range"
        id="spiral-spread-slider"
        min="1"
        max="12"
        step="1"
        value="4"
        oninput="updateSpiralSpread(this.value)"
      />
      <span id="spiral-spread-label">4</span>
    </div>
    <div>
      <label for="shape-size-factor">Shape Size (Fractal):</label>
      <input
        type="range"
        id="shape-size-factor"
        min="0.1"
        max="5"
        step="0.1"
        value="1"
        oninput="updateShapeSizeFactor(this.value)"
      />
      <span id="shape-size-factor-label">1</span>
    </div>
    <button id="toggle-visualization-btn">Hide Visualization</button>
  </div>

	<!-- BUTTON to Toggle Music Library -->
<button id="toggle-music" class="toggle-button2">Hide Library</button>

  <!-- MUSIC LIBRARY (Vue) -->
  <div class="music-container" id="media-list">
    <h1>{{ title }}</h1>
    <select v-on:change="filterList">
      <option value="">Filter by album...</option>
      <option v-for="item in uniqueAlbumsList" :key="item">{{ item }}</option>
    </select>
    <ul>
      <li
        v-for="media in filteredMediaList"
        :key="media.title"
        :class="{
          playing: currentlyPlaying === media,
          active: currentlyPlaying === media
        }"
      >
        <h3 @click="toggleDetails(media)">{{ media.title }}</h3>
        <div v-show="media.showDetails">
          <p><strong>Artist:</strong> {{ media.artist }}</p>
          <p><strong>Genre:</strong> {{ media.genre }}</p>
          <p><strong>Released:</strong> {{ media.released }}</p>
          <p><strong>Album:</strong> {{ media.album }}</p>
          <audio
            :src="media.url"
            controls
            @play="playAudio(media, $event)"
          ></audio>
        </div>
      </li>
    </ul>
  </div>

  <!-- THE VISUALIZER CANVASES -->

  <canvas id="visualization1"></canvas>
  <canvas id="visualization2"></canvas>
