		<!-- Include Three.js from CDN, fallback to local copy if offline -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r162/three.min.js"></script>

<!-- Optionally Include OrbitControls if needed -->
<script src="https://cdn.jsdelivr.net/npm/three@0.164.1/examples/js/controls/OrbitControls.js"></script>
<script>

    <script>

        let scene, camera, renderer, fractal, controls;

        init();
        animate();

        function init() {
            // Scene
            scene = new THREE.Scene();

            // Camera
            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 5;

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setClearColor(0x000000);
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Controls
            controls = new THREE.OrbitControls(camera, renderer.domElement);

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(0xffffff, 1);
            camera.add(pointLight);
            scene.add(camera);

            // Generate initial fractal
            generateFractal();

            // Event Listeners
            document.getElementById('generateButton').addEventListener('click', generateFractal);
            document.getElementById('styleSelect').addEventListener('change', generateFractal);
            window.addEventListener('resize', onWindowResize, false);
        }

        function generateFractal() {
            // Remove existing fractal if any
            if (fractal) {
                scene.remove(fractal);
                fractal.geometry.dispose();
                fractal.material.dispose();
                fractal = null;
            }

            const style = document.getElementById('styleSelect').value;

            // Create geometry with some randomization in parameters
            let geometry;
            switch (style) {
                case 'sacred_geometry':
                    // Random detail for Icosahedron
                    const icosaDetail = Math.floor(Math.random() * 5) + 2;
                    geometry = new THREE.IcosahedronGeometry(1, icosaDetail);
                    break;
                case 'paisley':
                    // Random segments for TorusKnot
                    const tKnotSegments = Math.floor(Math.random() * 200) + 80;
                    geometry = new THREE.TorusKnotGeometry(1, 0.3, tKnotSegments, 32, 2, 3);
                    break;
                case 'tessellation':
                    // Random detail for Dodecahedron
                    const dodecaDetail = Math.floor(Math.random() * 5) + 2;
                    geometry = new THREE.DodecahedronGeometry(1, dodecaDetail);
                    break;
                case 'kaleidoscope':
                    // Random detail for Octahedron
                    const octaDetail = Math.floor(Math.random() * 5) + 2;
                    geometry = new THREE.OctahedronGeometry(1, octaDetail);
                    break;
                case 'mandala':
                    // Random segments for Circle
                    const circleSegments = Math.floor(Math.random() * 64) + 64;
                    geometry = new THREE.CircleGeometry(1, circleSegments);
                    break;
                case 'spiral':
                    // Random width/height segments for Sphere
                    const widthSegments = Math.floor(Math.random() * 64) + 64;
                    const heightSegments = Math.floor(Math.random() * 64) + 64;
                    geometry = new THREE.SphereGeometry(1, widthSegments, heightSegments);
                    break;
                case 'toroidal':
                    // Random tube radius & radial segments for Torus
                    const tubeRadius = Math.random() * 0.4 + 0.1;
                    const radialSegments = Math.floor(Math.random() * 50) + 50;
                    geometry = new THREE.TorusGeometry(1, tubeRadius, radialSegments, 100);
                    break;
                default:
                    // Default to Icosahedron if no style is selected
                    geometry = new THREE.IcosahedronGeometry(1, 5);
            }
						
						

            // Material with rainbow color
            const material = new THREE.MeshStandardMaterial({
                vertexColors: true,
                wireframe: false,
                side: THREE.DoubleSide,
                flatShading: true
            });

            // Apply more dramatic rainbow colors
            applyRainbowColors(geometry);

            fractal = new THREE.Mesh(geometry, material);
						
						// After fractal is created and before: scene.add(fractal);
const rotationModes = ["constant", "oscillate", "spiral", "wiggle", "zigzag"];
const chosenMode = rotationModes[Math.floor(Math.random() * rotationModes.length)];
fractal.userData.rotationMode = chosenMode;

// Set up rotation parameters based on the chosen mode.
switch (chosenMode) {
    case "constant":
        // Random velocities (can be positive or negative).
        fractal.userData.rotationVelocity = {
            x: (Math.random() - 0.5) * 0.02,
            y: (Math.random() - 0.5) * 0.02,
            z: (Math.random() - 0.5) * 0.02
        };
        break;
    case "oscillate":
        // Oscillatory motion on each axis.
        fractal.userData.oscillation = {
            amplitude: {
                x: Math.random() * 0.1,
                y: Math.random() * 0.1,
                z: Math.random() * 0.1
            },
            speed: {
                x: Math.random() * 2,
                y: Math.random() * 2,
                z: Math.random() * 2
            },
            phase: {
                x: Math.random() * Math.PI * 2,
                y: Math.random() * Math.PI * 2,
                z: Math.random() * Math.PI * 2
            }
        };
        // Save the current rotation as the base.
        fractal.userData.baseRotation = fractal.rotation.clone();
        break;
    case "spiral":
        // A constant rotation with one axis modulated by a sine function.
        fractal.userData.rotationVelocity = {
            x: (Math.random() - 0.5) * 0.015,
            y: (Math.random() - 0.5) * 0.015,
            z: (Math.random() - 0.5) * 0.015
        };
        fractal.userData.spiral = {
            amplitude: Math.random() * 0.1,
            speed: Math.random() * 2,
            phase: Math.random() * Math.PI * 2
        };
        // Save a base rotation if needed.
        fractal.userData.baseRotation = fractal.rotation.clone();
        break;
    case "wiggle":
        // Small oscillations around a base rotation.
        fractal.userData.oscillation = {
            amplitude: {
                x: Math.random() * 0.05,
                y: Math.random() * 0.05,
                z: Math.random() * 0.05
            },
            speed: {
                x: Math.random() * 3,
                y: Math.random() * 3,
                z: Math.random() * 3
            },
            phase: {
                x: Math.random() * Math.PI * 2,
                y: Math.random() * Math.PI * 2,
                z: Math.random() * Math.PI * 2
            }
        };
        fractal.userData.baseRotation = fractal.rotation.clone();
        break;
    case "zigzag":
        // Use a constant velocity with an additional zigzag effect.
        fractal.userData.rotationVelocity = {
            x: (Math.random() - 0.5) * 0.02,
            y: (Math.random() - 0.5) * 0.02,
            z: (Math.random() - 0.5) * 0.02
        };
        fractal.userData.zigzag = {
            amplitude: {
                x: Math.random() * 0.1,
                y: Math.random() * 0.1,
                z: Math.random() * 0.1
            },
            speed: Math.random() * 3,
            phase: Math.random() * Math.PI * 2
        };
        break;
}

            // Random overall scaling for more variation
            const scaleFactor = Math.random() * 2 + 0.5; // Range: 0.5 - 2.5
            fractal.scale.set(scaleFactor, scaleFactor, scaleFactor);

            scene.add(fractal);
        }

        function applyRainbowColors(geometry) {
    // Define a list of possible themes
    let themes = ["rainbow", "pastel", "vivid", "panelRainbow", "monochrome", "cool", "warm"];
    const style = document.getElementById('styleSelect').value; // Get the selected style

    // Prevent "panelRainbow" from being applied to Infinity, Mandala, Spiral, and Toroidal
if (["paisley", "mandala", "spiral", "toroidal"].includes(style)) {
    themes = themes.filter(theme => theme !== "panelRainbow"); // Remove "panelRainbow"
}

    // Randomly select a theme from the adjusted list
    const theme = themes[Math.floor(Math.random() * themes.length)];
    console.log("Color theme:", theme, "Selected style:", style);

    const positionAttribute = geometry.attributes.position;
    const colors = [];
    const color = new THREE.Color();

    // Special handling for "panelRainbow" where each face gets a solid rainbow color.
    if (theme === "panelRainbow") {
        if (geometry.index) {
            geometry = geometry.toNonIndexed();
        }
        const rainbowColors = [
            new THREE.Color(0xff0000), // red
            new THREE.Color(0xff7f00), // orange
            new THREE.Color(0xffff00), // yellow
            new THREE.Color(0x00ff00), // green
            new THREE.Color(0x0000ff), // blue
            new THREE.Color(0x4b0082), // indigo
            new THREE.Color(0x8f00ff)  // violet
        ];
        const count = geometry.attributes.position.count;
        for (let i = 0; i < count; i += 3) {
            const randomColor = rainbowColors[Math.floor(Math.random() * rainbowColors.length)];
            colors.push(randomColor.r, randomColor.g, randomColor.b);
            colors.push(randomColor.r, randomColor.g, randomColor.b);
            colors.push(randomColor.r, randomColor.g, randomColor.b);
        }
        geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
        return;
    }

    // Apply colors based on selected theme
    for (let i = 0; i < positionAttribute.count; i++) {
        if (theme === "pastel") {
            const hue = Math.random();
            const saturation = 0.3;
            const lightness = 0.8;
            color.setHSL(hue, saturation, lightness);
        } else if (theme === "vivid") {
            const hue = Math.random();
            const saturation = 1.0;
            const lightness = 0.5;
            color.setHSL(hue, saturation, lightness);
        } else if (theme === "monochrome") {
            const gray = Math.random() * 0.5 + 0.25;
            color.setRGB(gray, gray, gray);
        } else if (theme === "cool") {
            const hue = Math.random() * 0.33 + 0.5;
            const saturation = 0.7;
            const lightness = 0.5;
            color.setHSL(hue, saturation, lightness);
        } else if (theme === "warm") {
            const hue = Math.random() * 0.16;
            const saturation = 0.7;
            const lightness = 0.5;
            color.setHSL(hue, saturation, lightness);
        } else {
            const x = positionAttribute.getX(i);
            const y = positionAttribute.getY(i);
            const z = positionAttribute.getZ(i);
            const hue = ((x + y + z) * 0.1 + Math.random() * 5) % 1;
            const saturation = 0.5 + Math.random() * 0.5;
            const lightness = 0.4 + Math.random() * 0.4;
            color.setHSL(hue, saturation, lightness);
        }
        colors.push(color.r, color.g, color.b);
    }
    geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
}

        function animate() {
    requestAnimationFrame(animate);
    const t = performance.now() / 1000; // current time in seconds

    if (fractal) {
        const mode = fractal.userData.rotationMode;
        switch (mode) {
            case "constant":
                fractal.rotation.x += fractal.userData.rotationVelocity.x;
                fractal.rotation.y += fractal.userData.rotationVelocity.y;
                fractal.rotation.z += fractal.userData.rotationVelocity.z;
                break;
            case "oscillate":
                fractal.rotation.x = fractal.userData.baseRotation.x + fractal.userData.oscillation.amplitude.x * Math.sin(t * fractal.userData.oscillation.speed.x + fractal.userData.oscillation.phase.x);
                fractal.rotation.y = fractal.userData.baseRotation.y + fractal.userData.oscillation.amplitude.y * Math.sin(t * fractal.userData.oscillation.speed.y + fractal.userData.oscillation.phase.y);
                fractal.rotation.z = fractal.userData.baseRotation.z + fractal.userData.oscillation.amplitude.z * Math.sin(t * fractal.userData.oscillation.speed.z + fractal.userData.oscillation.phase.z);
                break;
            case "spiral":
                fractal.rotation.x += fractal.userData.rotationVelocity.x;
                // Modulate the y-axis with a sine function for a spiral effect.
                fractal.rotation.y = fractal.userData.baseRotation.y + fractal.userData.spiral.amplitude * Math.sin(t * fractal.userData.spiral.speed + fractal.userData.spiral.phase);
                fractal.rotation.z += fractal.userData.rotationVelocity.z;
                break;
            case "wiggle":
                fractal.rotation.x = fractal.userData.baseRotation.x + fractal.userData.oscillation.amplitude.x * Math.sin(t * fractal.userData.oscillation.speed.x + fractal.userData.oscillation.phase.x);
                fractal.rotation.y = fractal.userData.baseRotation.y + fractal.userData.oscillation.amplitude.y * Math.sin(t * fractal.userData.oscillation.speed.y + fractal.userData.oscillation.phase.y);
                fractal.rotation.z = fractal.userData.baseRotation.z + fractal.userData.oscillation.amplitude.z * Math.sin(t * fractal.userData.oscillation.speed.z + fractal.userData.oscillation.phase.z);
                break;
            case "zigzag":
                // Use constant rotation plus an added zigzag effect based on the absolute sine.
                fractal.rotation.x += fractal.userData.rotationVelocity.x + fractal.userData.zigzag.amplitude.x * Math.abs(Math.sin(t * fractal.userData.zigzag.speed + fractal.userData.zigzag.phase));
                fractal.rotation.y += fractal.userData.rotationVelocity.y + fractal.userData.zigzag.amplitude.y * Math.abs(Math.sin(t * fractal.userData.zigzag.speed + fractal.userData.zigzag.phase));
                fractal.rotation.z += fractal.userData.rotationVelocity.z + fractal.userData.zigzag.amplitude.z * Math.abs(Math.sin(t * fractal.userData.zigzag.speed + fractal.userData.zigzag.phase));
                break;
            default:
                // Fallback rotation.
                fractal.rotation.x += 0.005;
                fractal.rotation.y += 0.005;
        }
    }

    controls.update();
    renderer.render(scene, camera);
}

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
