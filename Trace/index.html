<script>
(() => {
  const LS = {
    get: (k, d=null) => { try { const v = localStorage.getItem(k); return v===null?d:JSON.parse(v); } catch { return d; } },
    set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };

  const video   = document.getElementById('camera');
  const wrap    = document.getElementById('cameraWrap');
  const grid    = document.getElementById('grid');
  const overlay = document.getElementById('overlay');
  const img     = document.getElementById('ref');

  // Inputs (Photos vs Camera)
  const filePhotos = document.getElementById('filePhotos');
  const fileCam    = document.getElementById('fileCam');

  // Buttons
  const grab   = document.getElementById('grab');
  const resetB = document.getElementById('reset');
  const lockB  = document.getElementById('lock');
  const mirror = document.getElementById('mirror');
  const gridBtn= document.getElementById('gridBtn');
  const torch  = document.getElementById('torch');
  const help   = document.getElementById('help');
  const a2hs   = document.getElementById('a2hs');

  // Sliders + readouts
  const opacity= document.getElementById('opacity');
  const rotate = document.getElementById('rotate');
  const camzoom= document.getElementById('camzoom');
  const opacityVal = document.getElementById('opacityVal');
  const rotateVal  = document.getElementById('rotateVal');
  const zoomVal    = document.getElementById('zoomVal');

  // Nudge
  const nup = document.getElementById('nup'), ndown = document.getElementById('ndown'),
        nleft = document.getElementById('nleft'), nright = document.getElementById('nright'),
        nreset = document.getElementById('nreset'), nsnap = document.getElementById('nsnap'),
        status = document.getElementById('status');

  // Tip
  const tip    = document.getElementById('tip');

  let mediaStream = null;
  let videoTrack  = null;
  let zoomCaps    = null;
  let torchCaps   = false;

  // Overlay transform state
  let state = {
    x: 0, y: 0, scale: 1, rot: 0, mirror: 1, locked: false
  };
	
	// NEW: toggle bottom bar
const bottomBar    = document.getElementById('bottomBar');
const toggleBottom = document.getElementById('toggleBottom');

function setBottomOpen(open){
  bottomBar.classList.toggle('collapsed', !open);
  toggleBottom.setAttribute('aria-expanded', open ? 'true' : 'false');
  toggleBottom.innerHTML = open
    ? '⬇︎ <span class="txt">Hide</span>'
    : '⬆︎ <span class="txt">Show</span>';
  LS.set('trace.bottomOpen', open);
}

toggleBottom.addEventListener('click', () => {
  const willOpen = bottomBar.classList.contains('collapsed'); // if collapsed, next is open
  setBottomOpen(willOpen);
});

// In your restore() block, after other restores:
const savedBottomOpen = LS.get('trace.bottomOpen', true);
setBottomOpen(savedBottomOpen);

  const active = new Map();
  let startState = null;

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const vibrate = (p=10)=> { if (navigator.vibrate) navigator.vibrate(p); };

  function applyOverlayTransform(){
    img.style.transform = `translate(${state.x}px, ${state.y}px) rotate(${state.rot}deg) scale(${state.scale}) scaleX(${state.mirror})`;
  }
  function centerOverlayInitial(){
    state.x=0; state.y=0; state.scale=1; state.rot=0; state.mirror=1;
    img.style.display='block';
    img.style.maxWidth='90vw';
    img.style.maxHeight='80vh';
    applyOverlayTransform();
  }
  function resetOverlay(){
    const locked = state.locked;
    state = { x:0, y:0, scale:1, rot:0, mirror:1, locked };
    img.style.transform = 'translate(0,0) rotate(0deg) scale(1) scaleX(1)';
    rotate.value = 0;
    rotateVal.textContent = '0°';
    LS.set('trace.state', state);
  }

  function snapAngle(a){
    const snaps = [ -180, -90, 0, 90, 180 ];
    for (const s of snaps){
      if (Math.abs(a - s) <= 3) { return s; }
    }
    return a;
  }

  function updateReadouts(){
    opacityVal.textContent = Math.round(parseFloat(opacity.value)*100)+'%';
    rotateVal.textContent = Math.round(state.rot)+'°';
    zoomVal.textContent   = (parseFloat(camzoom.value)||1).toFixed(2)+'×';
  }

  // Camera
  async function startCamera(){
    try{
      mediaStream = await navigator.mediaDevices.getUserMedia({
        video:{ facingMode:{ideal:'environment'}, width:{ideal:1920}, height:{ideal:1080} },
        audio:false
      });
      video.srcObject = mediaStream;
      videoTrack = mediaStream.getVideoTracks()[0];

      if (videoTrack?.getCapabilities){
        const caps = videoTrack.getCapabilities();
        if ('zoom' in caps){
          zoomCaps = { min: caps.zoom.min || 1, max: caps.zoom.max || 3, step: caps.zoom.step || 0.01 };
          camzoom.min = zoomCaps.min; camzoom.max = zoomCaps.max; camzoom.step = zoomCaps.step;
          const savedZoom = LS.get('trace.zoom', 1);
          camzoom.value = savedZoom; setCameraZoom(savedZoom);
        }
        torchCaps = !!caps.torch;
      }
      keepAwake();
    }catch(e){
      console.error(e);
      alert('Camera permission or HTTPS required. Open via https:// or on localhost.');
    }
  }

  // Torch
  let torchOn = false;
  async function toggleTorch(){
    if (!videoTrack || !torchCaps) { alert('Torch not supported on this device/browser.'); return; }
    try{
      torchOn = !torchOn;
      await videoTrack.applyConstraints({ advanced: [{ torch: torchOn }]});
      torch.setAttribute('aria-pressed', torchOn ? 'true' : 'false');
      torch.innerHTML = torchOn ? '💡 <span class="txt">Torch On</span>' : '💡 <span class="txt">Torch</span>';
    }catch(err){
      console.warn('Torch set failed', err);
      alert('Torch control not available here.');
    }
  }

  // Camera zoom (hardware if possible; else CSS scale)
  async function setCameraZoom(v){
    if (zoomCaps && videoTrack){
      const z = clamp(v, zoomCaps.min, zoomCaps.max);
      try{
        await videoTrack.applyConstraints({ advanced: [{ zoom: z }]});
        camzoom.value = z;
        LS.set('trace.zoom', z);
        updateReadouts();
        return;
      }catch(e){ /* fallback below */ }
    }
    const z = clamp(v, 1, 4);
    wrap.style.transform = `scale(${z})`;
    camzoom.value = z;
    LS.set('trace.zoom', z);
    updateReadouts();
  }

  // Unified loader for a selected file
  function loadSelectedFile(file){
    if (!file) return;
    const url = URL.createObjectURL(file);
    img.onload = ()=>{ URL.revokeObjectURL(url); centerOverlayInitial(); };
    img.src = url;
  }

  // Choose from Photos / Take photo
  filePhotos.addEventListener('change', (e)=> loadSelectedFile(e.target.files?.[0]));
  fileCam.addEventListener('change', (e)=> loadSelectedFile(e.target.files?.[0]));

  // Grab frame from camera
  grab.addEventListener('click', ()=>{
    if (!video.videoWidth){ alert('Camera not ready.'); return; }
    const c = document.createElement('canvas');
    c.width = video.videoWidth; c.height = video.videoHeight;
    c.getContext('2d').drawImage(video, 0, 0, c.width, c.height);
    img.onload = ()=> centerOverlayInitial();
    img.src = c.toDataURL('image/jpeg', 0.92);
  });

  // UI controls
  opacity.addEventListener('input', ()=>{
    img.style.opacity = opacity.value;
    updateReadouts();
    LS.set('trace.opacity', opacity.value);
  });

  rotate.addEventListener('input', ()=>{
    state.rot = parseFloat(rotate.value)||0;
    applyOverlayTransform();
    updateReadouts();
    LS.set('trace.state', state);
  });

  gridBtn.addEventListener('click', ()=>{
    const on = !grid.classList.contains('on');
    grid.classList.toggle('on', on);
    gridBtn.setAttribute('aria-pressed', on?'true':'false');
    LS.set('trace.grid', on);
  });

  mirror.addEventListener('click', ()=>{
    state.mirror *= -1; applyOverlayTransform(); LS.set('trace.state', state);
    mirror.setAttribute('aria-pressed', state.mirror<0?'true':'false');
  });

  resetB.addEventListener('click', ()=>{ resetOverlay(); vibrate(8); });

  torch.addEventListener('click', toggleTorch);

  camzoom.addEventListener('input', ()=> setCameraZoom(parseFloat(camzoom.value)||1));

  a2hs.addEventListener('click', ()=> alert('Share menu → “Add to Home Screen” for fullscreen experience.'));

  lockB.addEventListener('click', ()=>{
    state.locked = !state.locked;
    overlay.classList.toggle('locked', state.locked);
    lockB.setAttribute('aria-pressed', state.locked?'true':'false');
    lockB.innerHTML = state.locked ? '🔓 <span class="txt">Unlock</span>' : '🔒 <span class="txt">Lock</span>';
    tip.classList.add('hidden');
    LS.set('trace.state', state);
  });

  help.addEventListener('click', ()=>{
    tip.classList.toggle('hidden');
  });

  // Fit buttons
  const fitW = document.getElementById('fitW');
  const fitH = document.getElementById('fitH');

  fitW.addEventListener('click', ()=>{
    if (!img.naturalWidth) return;
    const target = Math.min(window.innerWidth*0.9, img.naturalWidth);
    const curW = img.getBoundingClientRect().width;
    state.scale *= (target / curW);
    applyOverlayTransform();
    LS.set('trace.state', state);
  });
  fitH.addEventListener('click', ()=>{
    if (!img.naturalHeight) return;
    const target = Math.min(window.innerHeight*0.8, img.naturalHeight);
    const curH = img.getBoundingClientRect().height;
    state.scale *= (target / curH);
    applyOverlayTransform();
    LS.set('trace.state', state);
  });

  // Nudge controls
  const NUDGE = 4;
  nup.addEventListener('click',   ()=>{ state.y -= NUDGE; applyOverlayTransform(); status.textContent='Moved up'; });
  ndown.addEventListener('click', ()=>{ state.y += NUDGE; applyOverlayTransform(); status.textContent='Moved down'; });
  nleft.addEventListener('click', ()=>{ state.x -= NUDGE; applyOverlayTransform(); status.textContent='Moved left'; });
  nright.addEventListener('click',()=>{ state.x += NUDGE; applyOverlayTransform(); status.textContent='Moved right'; });
  nreset.addEventListener('click',()=>{ state.x=0; state.y=0; applyOverlayTransform(); status.textContent='Centered'; });
  nsnap.addEventListener('click', ()=>{ state.rot = snapAngle(state.rot); applyOverlayTransform(); rotate.value = Math.round(state.rot); updateReadouts(); vibrate(12); });

  // Overlay gestures (drag / pinch / rotate) + double-tap to reset
  overlay.addEventListener('dblclick', ()=>{ resetOverlay(); vibrate(8); });

  overlay.addEventListener('pointerdown', onPointerDown);
  overlay.addEventListener('pointermove', onPointerMove);
  overlay.addEventListener('pointerup', onPointerUp);
  overlay.addEventListener('pointercancel', onPointerUp);
  overlay.addEventListener('pointerleave', onPointerUp);

  function onPointerDown(e){
    if (state.locked) return;
    overlay.setPointerCapture(e.pointerId);
    active.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if (active.size === 1){
      startState = {...state, __one:{x:e.clientX, y:e.clientY}};
    } else if (active.size === 2){
      startState = {...state, ...gestureBaseline()};
    }
    e.preventDefault();
  }
  function onPointerMove(e){
    if (state.locked) return;
    if (!active.has(e.pointerId)) return;
    active.set(e.pointerId, {x:e.clientX, y:e.clientY});

    if (active.size === 1 && startState){
      const p = Array.from(active.values())[0];
      const s = startState.__one;
      state.x = startState.x + (p.x - s.x);
      state.y = startState.y + (p.y - s.y);
      applyOverlayTransform();
    } else if (active.size >= 2 && startState){
      const g = gestureValues(); const base = startState;
      const nextScale = clamp(base.scale * (g.dist / base.dist0), 0.05, 20);
      let delta = g.angle - base.angle0;
      if (delta > 180) delta -= 360; if (delta < -180) delta += 360;
      let ang = base.rot + delta;
      ang = snapAngle(ang);
      state.scale = nextScale;
      state.rot = ang;
      state.x = base.x + (g.cx - base.cx0);
      state.y = base.y + (g.cy - base.cy0);
      applyOverlayTransform();
      rotate.value = Math.round(state.rot);
      updateReadouts();
    }
    e.preventDefault();
  }
  function onPointerUp(e){
    if (overlay.hasPointerCapture(e.pointerId)) overlay.releasePointerCapture(e.pointerId);
    active.delete(e.pointerId);
    if (active.size === 0) { startState = null; LS.set('trace.state', state); }
  }
  function gestureBaseline(){ const {dist, angle, cx, cy} = gestureValues(); return { dist0:dist, angle0:angle, cx0:cx, cy0:cy }; }
  function gestureValues(){
    const pts = Array.from(active.values()).slice(0,2);
    const [p1, p2] = pts;
    const dx = p2.x - p1.x, dy = p2.y - p1.y;
    const dist = Math.hypot(dx, dy);
    const angle = Math.atan2(dy, dx) * 180/Math.PI;
    const cx = (p1.x + p2.x)/2, cy = (p1.y + p2.y)/2;
    return {dist, angle, cx, cy};
  }

  // When locked, pinch anywhere to zoom camera
  const camPinch = { active:false, startDist:0, startZoom:1 };
  document.addEventListener('touchstart', (e)=>{
    if (!state.locked) return;
    if (e.touches.length === 2){
      camPinch.active = true;
      camPinch.startDist = dist(e.touches[0], e.touches[1]);
      camPinch.startZoom = parseFloat(camzoom.value)||1;
    }
  }, {passive:false});
  document.addEventListener('touchmove', (e)=>{
    if (!state.locked || !camPinch.active) return;
    if (e.touches.length === 2){
      const scale = dist(e.touches[0], e.touches[1]) / camPinch.startDist;
      setCameraZoom(camPinch.startZoom * scale);
      e.preventDefault();
    }
  }, {passive:false});
  document.addEventListener('touchend', ()=> camPinch.active=false);

  function dist(a,b){ const dx=b.clientX-a.clientX, dy=b.clientY-a.clientY; return Math.hypot(dx,dy); }

  // Wake lock
  let wakeLock = null;
  async function keepAwake(){
    try{
      if ('wakeLock' in navigator){
        wakeLock = await navigator.wakeLock.request('screen');
        document.addEventListener('visibilitychange', async ()=>{
          if (document.visibilityState === 'visible'){
            try{ wakeLock = await navigator.wakeLock.request('screen'); }catch{}
          }
        });
      }
    }catch{}
  }

  // Orientation reflow
  window.addEventListener('orientationchange', ()=>{
    setTimeout(()=>{ applyOverlayTransform(); }, 300);
  });

  // Restore persisted UI
  (function restore(){
    const savedOpacity = LS.get('trace.opacity', 0.6);
    opacity.value = savedOpacity; img.style.opacity = savedOpacity;

    const savedGrid = LS.get('trace.grid', false);
    grid.classList.toggle('on', !!savedGrid);
    gridBtn.setAttribute('aria-pressed', savedGrid?'true':'false');

    const savedState = LS.get('trace.state', null);
    if (savedState){
      state = {...state, ...savedState};
      overlay.classList.toggle('locked', state.locked);
      lockB.setAttribute('aria-pressed', state.locked?'true':'false');
      lockB.innerHTML = state.locked ? '🔓 <span class="txt">Unlock</span>' : '🔒 <span class="txt">Lock</span>';
      applyOverlayTransform();
    }
    updateReadouts();
  })();

  // Init
  startCamera();
  setTimeout(()=> tip.classList.add('hidden'), 6000);

  // Optional service worker registration (if /Trace/sw.js exists)
  if ('serviceWorker' in navigator){
    navigator.serviceWorker.register('/Trace/sw.js').catch(()=>{ /* ignore */ });
  }
})();
</script>

<script src="../nav-fetch.js"></script>
