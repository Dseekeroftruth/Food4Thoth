    <h2>Join the Movement</h2>

        <input type="email" id="email" name="email" placeholder="example@domain.com" required>

<div class="contact-preference">
    <label for="phone">Phone Number (Optional):</label>
    <input type="tel" id="phone" name="phone" placeholder="+1 123-456-7890">

    <p>Preferred Contact Method:</p>
    <div>
        <button type="button" class="contact-button" data-value="whatsapp">
            <i class="fab fa-whatsapp"></i> WhatsApp
        </button>
        <button type="button" class="contact-button" data-value="telegram">
            <i class="fab fa-telegram"></i> Telegram
        </button>
        <button type="button" class="contact-button" data-value="signal">
            <i class="fas fa-signal"></i> Signal
        </button>
    </div>

    <!-- Hidden input to store the selected value -->
    <input type="hidden" id="contact-method" name="contact-method" value="">

    <!-- Optional Input Field for Username/Handle -->
    <div id="username-container" class="hidden">
        <label for="username">Enter Your Username/Handle:</label>
        <input type="text" id="username" name="username" placeholder="Enter your username">
    </div>
</div>

        <!-- Participation -->
        <label for="interest">Your Interest in the Movement:</label>
        <select id="interest" name="interest" required>
            <option value="" disabled selected>Select an option</option>
            <option value="Create TAZ">Creating a Temporary Autonomous Zone</option>
            <option value="Immediatism">Engaging in Immediatism</option>
            <option value="Poetic Terrorism">Practicing Poetic Action</option>
            <option value="Learning More">Learning More</option>
            <option value="Other">Other</option>
        </select>

        <label for="skills">Skills or Resources You Bring:</label>
        <textarea id="skills" name="skills" rows="4" placeholder="Tell us about your unique contributions (e.g., art, organization, resources)."></textarea>

        <label for="vision">Your Vision for the Movement:</label>
        <textarea id="vision" name="vision" rows="4" placeholder="What inspires you to join? What do you hope to achieve?"></textarea>

        <label for="location">Your Current Location:</label>
        <input type="text" id="location" name="location" placeholder="City, State, or Country">

        <!-- Additional Information -->
        <label for="additionalInfo">Additional Information (Optional):</label>
        <textarea id="additionalInfo" name="additionalInfo" rows="4" placeholder="Anything else you'd like us to know?"></textarea>

        <!-- Submit Button -->
        <button type="submit">Join Now</button>
    </form>

    <a href="./index.html" class="return-link">Return to Home</a>
</div>

<!-- Include JavaScript for Copy to Clipboard Functionality -->
    <script>
        // Select elements
const buttons = document.querySelectorAll('.contact-button');
const hiddenInput = document.getElementById('contact-method');
const usernameContainer = document.getElementById('username-container');
const usernameInput = document.getElementById('username');

// Add event listeners to buttons
buttons.forEach(button => {
    button.addEventListener('click', function () {
        // Set the hidden input value based on the selected button
        const service = this.getAttribute('data-value');
        hiddenInput.value = service;

        // Show the username input and update its placeholder dynamically
        usernameContainer.classList.remove('hidden');
        usernameInput.placeholder = `Enter your ${service} username/handle`;

        // Highlight the selected button (optional visual feedback)
        buttons.forEach(btn => btn.classList.remove('selected'));
        this.classList.add('selected');
    });
});
				
				
    </script>
