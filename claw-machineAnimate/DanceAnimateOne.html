<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dancing Toys Disco</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    /* ---------- Basic Reset & Background ---------- */
    body {
      margin: 0;
      padding: 0;
      background: #000;
      overflow: hidden;
      font-family: sans-serif;
    }
    /* ---------- Container for Toys ---------- */
    .dancing-toys {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100vh;
    }
    /* ---------- Toy Element Styles ---------- */
    .toy {
      position: relative;
      width: 100px;
      height: 100px;
      margin: 10px;
      /* Dance: bounce and slight rotation */
      animation: dance 2s ease-in-out infinite, disco 4s linear infinite;
    }
    /* Bounce animation */
    @keyframes dance {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-20px) rotate(10deg); }
    }
    /* Rainbow disco effect via hue rotation */
    @keyframes disco {
      0% { filter: hue-rotate(0deg); }
      50% { filter: hue-rotate(180deg); }
      100% { filter: hue-rotate(360deg); }
    }
    /* ---------- Pseudo-element for Toy Image ---------- */
    .toy::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      transition: background-image 0.3s ease;
    }
    /* ---------- Toy Image Definitions ---------- */
    .toy.bear::after {
      background-image: url('./images/IMG_1220.png');
    }
    .toy.bear.grabbed::after {
      background-image: url('./images/IMG_1221.png');
    }
    .toy.bunny::after {
      background-image: url('./images/IMG_1223.png');
    }
    .toy.bunny.grabbed::after {
      background-image: url('./images/IMG_1224.png');
    }
    .toy.golem::after {
      background-image: url('./images/IMG_1226.png');
    }
    .toy.golem.grabbed::after {
      background-image: url('./images/IMG_1227.png');
    }
    .toy.cucumber::after {
      background-image: url('./images/IMG_1229.png');
    }
    .toy.cucumber.grabbed::after {
      background-image: url('./images/IMG_1230.png');
    }
    .toy.penguin::after {
      background-image: url('./images/IMG_1232.png');
    }
    .toy.penguin.grabbed::after {
      background-image: url('./images/IMG_1233.png');
    }
    .toy.robot::after {
      background-image: url('./images/IMG_1235.png');
    }
    .toy.robot.grabbed::after {
      background-image: url('./images/IMG_1236.png');
    }
    /* ---------- Confetti Styles ---------- */
    .confetto {
      position: fixed;
      width: 8px;
      height: 8px;
      background: hsl(calc(360 * var(--rand)), 100%, 50%);
      border-radius: 50%;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="dancing-toys" id="dancing-toys"></div>
  <script>
    // Array of toy types (should match your CSS class names)
    const toyTypes = ["bear", "bunny", "golem", "cucumber", "penguin", "robot"];
    const container = document.getElementById("dancing-toys");

    // Create 12 toy elements – cycle through the toy types
    for (let i = 0; i < 12; i++) {
      const toy = document.createElement("div");
      // Alternate toy types using modulo
      toy.className = "toy " + toyTypes[i % toyTypes.length];
      container.appendChild(toy);
    }

    // Cycle the state ("grabbed" vs. default) in a staggered fashion so each toy cycles at a different time.
    function cycleToyStates() {
      const toys = document.querySelectorAll(".dancing-toys .toy");
      toys.forEach((toyEl, i) => {
        // Start each toy's cycle after a delay (staggered)
        setTimeout(() => {
          let state = 0;
          const states = ["grabbed", ""]; // toggling between grabbed and default
          setInterval(() => {
            // Remove both states, then add the current one if nonempty
            toyEl.classList.remove("grabbed");
            if (states[state] !== "") {
              toyEl.classList.add(states[state]);
            }
            state = (state + 1) % states.length;
          }, 1000); // Change state every second
        }, i * 300); // Each toy starts 300ms later
      });
    }
    cycleToyStates();

    // A refined confetti generator:
    function launchConfetti() {
      // Create 100 confetti pieces for a denser effect
      for (let i = 0; i < 100; i++) {
        setTimeout(() => {
          const confetto = document.createElement("div");
          confetto.className = "confetto";
          // Random horizontal start position
          confetto.style.left = Math.random() * 100 + "%";
          // Start above the viewport
          confetto.style.top = -20 + "px";
          // Set a random value for --rand so the hsl calculation is valid
          confetto.style.setProperty("--rand", Math.random());
          document.body.appendChild(confetto);
          
          // Animate: fall down with horizontal drift and rotation.
          const horizontalDrift = (Math.random() * 100) - 50; // drift between -50px to +50px
          const rotation = Math.random() * 720; // random rotation up to 720 deg
          confetto.animate([
            { transform: `translate(0, 0) rotate(0deg)`, opacity: 1 },
            { transform: `translate(${horizontalDrift}px, 110vh) rotate(${rotation}deg)`, opacity: 0 }
          ], {
            duration: 4000 + Math.random() * 2000,
            easing: "ease-out",
            fill: "forwards"
          });
          // Remove after the animation
          setTimeout(() => confetto.remove(), 6000);
        }, i * 50);
      }
    }
    // Launch confetti once after a delay (for demo, 2 seconds after page load)
    setTimeout(launchConfetti, 2000);
  </script>
</body>
</html>
