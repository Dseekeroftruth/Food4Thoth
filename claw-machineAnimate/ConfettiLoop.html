<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dancing Toys Disco</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    /* ---------- Basic Reset & Background ---------- */
    body {
      margin: 0;
      padding: 0;
      background: #000;
      overflow: hidden;
      font-family: sans-serif;
    }
    /* ---------- Container for Dancing Toys ---------- */
    .dancing-toys {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100vh;
    }
    /* ---------- Toy Element ---------- */
    .toy {
      position: relative;
      width: 100px;
      height: 100px;
      margin: 10px;
      /* Each toy uses its own random dance parameters */
      animation: dance var(--dance-duration, 2s) ease-in-out infinite,
                 disco 4s linear infinite;
      animation-delay: var(--dance-delay, 0s);
    }
    /* Bounce/sway keyframes */
    @keyframes dance {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-20px) rotate(10deg); }
    }
    /* Rainbow disco effect */
    @keyframes disco {
      0% { filter: hue-rotate(0deg); }
      50% { filter: hue-rotate(180deg); }
      100% { filter: hue-rotate(360deg); }
    }
    /* ---------- Pseudo-element for Toy Images ---------- */
    .toy::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      /* Use a transition on opacity to fade between states */
      transition: opacity 0.3s ease;
      opacity: 1;
    }
    /* A helper class to fade the pseudo-element out */
    .toy.fade-out::after {
      opacity: .95;
    }
    /* ---------- Toy Image Definitions ---------- */
    .toy.bear::after { background-image: url('./images/IMG_1220.png'); }
    .toy.bear.grabbed::after { background-image: url('./images/IMG_1221.png'); }
    
    .toy.bunny::after { background-image: url('./images/IMG_1223.png'); }
    .toy.bunny.grabbed::after { background-image: url('./images/IMG_1224.png'); }
    
    .toy.golem::after { background-image: url('./images/IMG_1226.png'); }
    .toy.golem.grabbed::after { background-image: url('./images/IMG_1227.png'); }
    
    .toy.cucumber::after { background-image: url('./images/IMG_1229.png'); }
    .toy.cucumber.grabbed::after { background-image: url('./images/IMG_1230.png'); }
    
    .toy.penguin::after { background-image: url('./images/IMG_1232.png'); }
    .toy.penguin.grabbed::after { background-image: url('./images/IMG_1233.png'); }
    
    .toy.robot::after { background-image: url('./images/IMG_1235.png'); }
    .toy.robot.grabbed::after { background-image: url('./images/IMG_1236.png'); }
    
    /* ---------- Confetti Styles ---------- */
    .confetto {
      position: fixed;
      width: 8px;
      height: 8px;
      background: hsl(calc(360 * var(--rand)), 100%, 50%);
      border-radius: 50%;
      pointer-events: none;
    }
    @keyframes confettiSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="dancing-toys" id="dancing-toys"></div>
  <script>
    /***********************
     * Create Dancing Toys Immediately
     ***********************/
    const toyTypes = ["bear", "bunny", "golem", "cucumber", "penguin", "robot"];
    const container = document.getElementById("dancing-toys");
    const numToys = 12;
    for (let i = 0; i < numToys; i++) {
      const toy = document.createElement("div");
      toy.className = "toy " + toyTypes[i % toyTypes.length];
      // Set random dance parameters so each toy dances at a different rate
      toy.style.setProperty("--dance-duration", (1.8 + Math.random() * 0.4) + "s");
      toy.style.setProperty("--dance-delay", (Math.random() * 1.5) + "s");
      container.appendChild(toy);
    }
    
    /***********************
     * Immediate, Smooth State Cycling
     ***********************/
    function cycleToyStates() {
      const toys = document.querySelectorAll(".dancing-toys .toy");
      toys.forEach((toyEl) => {
        // Each toy gets its own cycle period between 1.5s and 2s
        const period = 1500 + Math.random() * 500;
        let state = -1;
        const states = ["grabbed", ""]; // alternate grabbed vs. default
        setInterval(() => {
          // Trigger fade-out by adding "fade-out" class
          toyEl.classList.add("fade-out");
          // After 300ms (fade duration), toggle the state and remove fade-out
          setTimeout(() => {
            toyEl.classList.remove("grabbed");
            if (states[state] === "grabbed") {
              toyEl.classList.add("grabbed");
            }
            toyEl.classList.remove("fade-out");
            state = (state + 1) % states.length;
          }, 0);
        }, period);
      });
    }
    cycleToyStates();
    
    function launchConfetti() {
  const confettiCount = 100; // Number of confetti pieces per cycle

  function createConfetti() {
    for (let i = 0; i < confettiCount; i++) {
      setTimeout(() => {
        const confetto = document.createElement("div");
        confetto.className = "confetto";

        // Random horizontal position
        confetto.style.left = Math.random() * 100 + "%";
        // Start above the viewport
        confetto.style.top = "-20px";
        // Assign a random HSL color variation
        confetto.style.setProperty("--rand", Math.random());

        document.body.appendChild(confetto);

        // Randomized movement
        const horizontalDrift = (Math.random() * 100) - 50; // Drift between -50px to +50px
        const rotation = Math.random() * 720; // Rotate up to 720 degrees

        // Animation: Falling with rotation
        confetto.animate([
          { transform: "translate(0, 0) rotate(0deg)", opacity: 1 },
          { transform: `translate(${horizontalDrift}px, 110vh) rotate(${rotation}deg)`, opacity: 0 }
        ], {
          duration: 4000 + Math.random() * 2000, // Randomized fall speed
          easing: "ease-out",
          fill: "forwards"
        });

        // Remove confetto after animation
        setTimeout(() => confetto.remove(), 10000);
      }, i * 50); // Staggered release for a smoother effect
    }
  }

  // **Loop the confetti effect indefinitely**
  createConfetti();
  setInterval(createConfetti, 5000); // Restart every 5 seconds for a continuous flow
}

// **Start confetti animation immediately**
launchConfetti();
  </script>
</body>
</html>
