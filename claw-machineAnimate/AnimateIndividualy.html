<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dancing Toys Disco</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    /* Basic reset and full–screen dark background */
    body {
      margin: 0;
      padding: 0;
      background: #000;
      overflow: hidden;
      font-family: sans-serif;
    }
    /* Container for the dancing toys */
    .dancing-toys {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100vh;
    }
    /* Each toy is a 100x100px square */
    .toy {
      position: relative;
      width: 100px;
      height: 100px;
      margin: 10px;
      /* Use CSS custom properties for individual dance timing */
      animation: dance var(--dance-duration, 2s) ease-in-out infinite,
                 disco 4s linear infinite;
      animation-delay: var(--dance-delay, 0s);
    }
    /* Bounce/sway keyframes – the basic movement */
    @keyframes dance {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-20px) rotate(10deg); }
    }
    /* Rainbow disco effect using hue rotation */
    @keyframes disco {
      0% { filter: hue-rotate(0deg); }
      50% { filter: hue-rotate(180deg); }
      100% { filter: hue-rotate(360deg); }
    }
    /* The pseudo-element displays the toy’s image */
    .toy::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      /* Transition on opacity for smooth fade-out/in */
      transition: opacity 0.3s ease;
      opacity: 1;
    }
    /* Define default and "grabbed" backgrounds for each toy type */
    .toy.bear::after { background-image: url('./images/IMG_1220.png'); }
    .toy.bear.grabbed::after { background-image: url('./images/IMG_1221.png'); }
    
    .toy.bunny::after { background-image: url('./images/IMG_1223.png'); }
    .toy.bunny.grabbed::after { background-image: url('./images/IMG_1224.png'); }
    
    .toy.golem::after { background-image: url('./images/IMG_1226.png'); }
    .toy.golem.grabbed::after { background-image: url('./images/IMG_1227.png'); }
    
    .toy.cucumber::after { background-image: url('./images/IMG_1229.png'); }
    .toy.cucumber.grabbed::after { background-image: url('./images/IMG_1230.png'); }
    
    .toy.penguin::after { background-image: url('./images/IMG_1232.png'); }
    .toy.penguin.grabbed::after { background-image: url('./images/IMG_1233.png'); }
    
    .toy.robot::after { background-image: url('./images/IMG_1235.png'); }
    .toy.robot.grabbed::after { background-image: url('./images/IMG_1236.png'); }
    
    /* ------------------ Confetti Styles ------------------ */
    .confetto {
      position: fixed;
      width: 8px;
      height: 8px;
      background: hsl(calc(360 * var(--rand)), 100%, 50%);
      border-radius: 50%;
      pointer-events: none;
    }
    @keyframes confettiSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="dancing-toys" id="dancing-toys">
    <!-- Toys will be injected here -->
  </div>
  <script>
    /***********************
     * Create Dancing Toys
     ***********************/
    const toyTypes = ["bear", "bunny", "golem", "cucumber", "penguin", "robot"];
    const container = document.getElementById("dancing-toys");
    const numToys = 12;
    for (let i = 0; i < numToys; i++) {
      const toy = document.createElement("div");
      // Cycle through toy types
      toy.className = "toy " + toyTypes[i % toyTypes.length];
      // Set individual dance parameters:
      // Random duration between 1.8s and 2.2s, and a random delay up to 1.5s
      toy.style.setProperty("--dance-duration", (1.8 + Math.random() * 0.4) + "s");
      toy.style.setProperty("--dance-delay", (Math.random() * 1.5) + "s");
      container.appendChild(toy);
    }
    
    /***********************
     * Smooth State Cycling (with fade)
     ***********************/
    function cycleToyStates() {
      const toys = document.querySelectorAll(".dancing-toys .toy");
      toys.forEach((toyEl, i) => {
        // Start with a slight delay so they don't all change at once
        setTimeout(() => {
          let state = 0;
          const states = ["grabbed", ""]; // toggling grabbed vs. default
          setInterval(() => {
            // Fade out the pseudo-element by lowering its opacity
            toyEl.style.opacity = ".9";
            setTimeout(() => {
              // Remove any state class and then add the new state if applicable
              toyEl.classList.remove("grabbed");
              if (states[state] !== "") {
                toyEl.classList.add(states[state]);
              }
              // Fade back in
              toyEl.style.opacity = "1";
              state = (state + 1) % states.length;
            }, 300); // 300ms fade duration
          }, 1500); // Each cycle lasts 1.5 seconds
        }, i * 300); // Stagger the start times for each toy
      });
    }
    cycleToyStates();
    
    // A refined confetti generator:
    function launchConfetti() {
      // Create 100 confetti pieces for a denser effect
      for (let i = 0; i < 100; i++) {
        setTimeout(() => {
          const confetto = document.createElement("div");
          confetto.className = "confetto";
          // Random horizontal start position
          confetto.style.left = Math.random() * 100 + "%";
          // Start above the viewport
          confetto.style.top = -20 + "px";
          // Set a random value for --rand so the hsl calculation is valid
          confetto.style.setProperty("--rand", Math.random());
          document.body.appendChild(confetto);
          
          // Animate: fall down with horizontal drift and rotation.
          const horizontalDrift = (Math.random() * 100) - 50; // drift between -50px to +50px
          const rotation = Math.random() * 720; // random rotation up to 720 deg
          confetto.animate([
            { transform: `translate(0, 0) rotate(0deg)`, opacity: 1 },
            { transform: `translate(${horizontalDrift}px, 110vh) rotate(${rotation}deg)`, opacity: 0 }
          ], {
            duration: 4000 + Math.random() * 2000,
            easing: "ease-out",
            fill: "forwards"
          });
          // Remove after the animation
          setTimeout(() => confetto.remove(), 10000);
        }, i * 50);
      }
    }
    // Launch confetti once after a delay (for demo, 2 seconds after page load)
    setTimeout(launchConfetti, 2000);
  </script>
</body>
</html>
